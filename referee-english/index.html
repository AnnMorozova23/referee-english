</b> = если не: <i>No advantage <b>unless</b> there is a clear chance.</i></li>\n<li><b>as long as / provided (that) / providing</b> = при условии, что: <i>Back-heeling is permitted <b>provided that</b> the ball moves forwards.</i></li>\n<li><b>in case</b> = на случай, если: <i>Take a spare whistle <b>in case</b> yours breaks.</i></li>\n<li><b>otherwise</b> = иначе: <i>Hurry, <b>otherwise</b> we'll be late.</i></li></ul>\n<div class=\"note\">⚠️ <b>in case ≠ if</b>: <i>I'll take an umbrella <b>in case</b> it rains.</i> (беру в любом случае) / <i>I'll take an umbrella <b>if</b> it rains.</i> (возьму только если пойдёт)</div>\n\n<h4>3. Время</h4>\n<ul><li><b>until / till</b> = до тех пор, пока (не): <i>Opponents stay 5 m away <b>until</b> the ball is in play.</i> (в русском «пока не» — в английском без not!)</li>\n<li><b>by</b> = не позже (срок): <i>Send the report <b>by</b> Friday.</i> — сравните: <i>I'll be here <b>until</b> Friday.</i> (до пятницы, всё время)</li>\n<li><b>as soon as, once</b> = как только: <i><b>Once</b> the ball is kicked, it's in play.</i></li>\n<li><b>while / during</b>: while + предложение, during + существительное: <i><b>during</b> the timeout / <b>while</b> the timeout is running</i></li></ul>\n\n<h4>4. Причина и следствие</h4>\n<p class=\"ex\"><b>because / as / since</b> + предложение: <i><b>As</b> it was late, we went home.</i><br>\n<b>because of / due to</b> + существительное: <i>The match was suspended <b>due to</b> a leak.</i><br>\n<b>so</b> / <b>therefore</b> / <b>as a result</b>: <i>He was injured, <b>so</b> he left. The ball hit the ceiling; <b>therefore</b>, a kick-in was awarded.</i></p>\n\n<h4>5. Добавление</h4>\n<p class=\"ex\"><b>also, too, as well</b>; <b>in addition, moreover, furthermore</b> (формально): <i><b>In addition</b>, the referee must report the incident.</i></p>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ Despite of the rain → ✅ <b>Despite</b> the rain / <b>In spite of</b> the rain<br>❌ Wait until the referee doesn't whistle. → ✅ Wait <b>until</b> the referee <b>whistles</b>.<br>❌ Because of it was late → ✅ <b>Because</b> it was late<br>❌ I'll stay by 6. (в смысле «до 6») → ✅ I'll stay <b>until</b> 6.</div>","ex":[{"q":"The goalkeeper must stay on the line ___ the ball is kicked.","o":["until","although","however"],"a":0,"why":"До момента удара → until."},{"q":"___ it was raining, the match started on time.","o":["However","Although","Unless"],"a":1,"why":"Хотя → although (с придаточным)."},{"q":"A goal counts ___ the ball wholly passes over the goal line.","o":["provided that","although","until"],"a":0,"why":"При условии что → provided that."},{"q":"You won't improve ___ you practise every day.","o":["until","unless","however"],"a":1,"why":"Если не будешь → unless."},{"q":"Blocking is allowed. ___, the player must be stationary.","o":["Although","However","Unless"],"a":1,"why":"Однако (новое предложение, запятая) → However."},{"q":"___ being tired, she refereed brilliantly.","o":["Although","Despite","However"],"a":1,"why":"Despite + -ing."},{"q":"Send me the match report ___ Friday.","o":["until","by","during"],"a":1,"why":"Срок «не позже» → by."},{"q":"Take a spare whistle ___ yours breaks.","o":["in case","unless","until"],"a":0,"why":"in case = на случай, если."},{"q":"The match was suspended ___ a leak in the roof.","o":["because","due to","although"],"a":1,"why":"due to + существительное."},{"q":"Football has offside, ___ futsal doesn't.","o":["whereas","despite","unless"],"a":0,"why":"Сравнение двух фактов → whereas."}]},"reading":{"title":"DOGSO — Denying an obvious goalscoring opportunity","text":["If a player denies the opponents a goal or an obvious goalscoring opportunity with a deliberate handball, the player is sent off, wherever this happens.","If a defender commits a foul inside their own penalty area and denies an obvious goalscoring opportunity, the referees award a penalty kick. If the foul was an attempt to play the ball, the player is only cautioned. But if it wasn't — for example, holding, pulling or pushing — the player is sent off.","To decide if it is DOGSO, the referees think about: the distance to the goal, the direction of play, the chance of controlling the ball, and the number and position of defenders and attackers. They also check whether the goal is guarded — that is, whether the goalkeeper is in their penalty area, inside the triangle between the posts and the ball.","DOGSO is more likely when the goal is unguarded, which often happens when a team plays with a flying goalkeeper."],"q":[{"q":"A defender denies a goal with a deliberate handball outside the penalty area. What is the sanction?","o":["Yellow card","Red card","No card"],"a":1},{"q":"A defender holds an attacker in the penalty area and denies an obvious chance. What happens?","o":["Penalty + red card","Penalty + yellow card","Indirect free kick"],"a":0},{"q":"When is the goal 'guarded'?","o":["When there are two defenders","When the goalkeeper is between the posts and the ball in the penalty area","When the goal is fixed"],"a":1}]},"listening":{"title":"Referee fitness test","theme":"futsal","lines":[["Instructor","Good morning, everyone. Today is the fitness test. First, warm up for ten minutes."],["Referee","Is it the same test as last year?"],["Instructor","Almost. There are sprints first, and then the interval run. You must pass both."],["Referee","I've been working out all summer, so I hope I'll be fine."],["Instructor","Good. Remember: in futsal you have short, fast sprints along the touchline. Keeping fit is part of the job."],["Referee","Of course. And after the test?"],["Instructor","Stretch, drink some water, and then we have a video session about handball and DOGSO."]],"q":[{"q":"What should the referees do first?","o":["Sprints","Warm up","Watch a video"],"a":1},{"q":"What has the referee been doing all summer?","o":["Working out","Refereeing","Resting"],"a":0},{"q":"What is the topic of the video session?","o":["Positioning","Handball and DOGSO","Timeouts"],"a":1}]}},{"title":"Sent-off & 2 minutes · Проблемы и решения","futsal":[{"en":"two-minute numerical reduction","ru":"двухминутное численное меньшинство","ex":"After a sending-off, the team serves a two-minute numerical reduction."},{"en":"to elapse","ru":"пройти, истечь (о времени)","ex":"The substitute can enter after two minutes have elapsed."},{"en":"team official","ru":"официальное лицо команды","ex":"Team officials can also receive yellow and red cards."},{"en":"to serve (a suspension)","ru":"отбывать (наказание)","ex":"The team served its two minutes with three outfield players."},{"en":"to be entitled to","ru":"иметь право на","ex":"Each team is entitled to one timeout per period."},{"en":"head coach","ru":"главный тренер","ex":"The head coach was sent off for abusive language."},{"en":"vicinity","ru":"окрестность, район (рядом с)","ex":"A sent-off player must leave the vicinity of the pitch."},{"en":"to be completed (with a player)","ru":"быть дополненной (игроком)","ex":"After the goal, the team can be completed with a fifth player."},{"en":"numerical superiority","ru":"численное превосходство","ex":"They scored while playing with numerical superiority."},{"en":"authorisation","ru":"разрешение","ex":"The substitute may enter with the authorisation of the timekeeper."}],"life":[{"en":"to get to the bottom of","ru":"докопаться до сути","ex":"We need to get to the bottom of this problem."},{"en":"to weigh up the pros and cons","ru":"взвесить все за и против","ex":"I weighed up the pros and cons before accepting."},{"en":"a setback","ru":"неудача, препятствие","ex":"The injury was a big setback for her career."},{"en":"to iron out","ru":"уладить, сгладить (мелкие проблемы)","ex":"We still have a few details to iron out."},{"en":"to think outside the box","ru":"мыслить нестандартно","ex":"To solve this, we need to think outside the box."},{"en":"a blessing in disguise","ru":"нет худа без добра","ex":"Missing the flight was a blessing in disguise."},{"en":"to back down","ru":"отступить, уступить","ex":"The coach refused to back down."},{"en":"to tackle (a problem)","ru":"взяться за решение (проблемы)","ex":"We need to tackle this problem now."},{"en":"We'll cross that bridge when we come to it","ru":"Будем решать проблемы по мере поступления","ex":"What if it rains? We'll cross that bridge when we come to it."},{"en":"a workaround","ru":"обходной путь, временное решение","ex":"We found a workaround for the scoreboard problem."}],"grammar":{"title":"Phrasal verbs","explain":"\n<h4>1. Что это</h4>\n<p>Глагол + частица (up, off, out, on, in, down, away, back…). Смысл часто <b>не выводится</b> из частей: <i>give</i> (дать) + <i>up</i> = бросить, сдаться.</p>\n\n<h4>2. Четыре типа — от этого зависит порядок слов</h4>\n<p><b>1) Без дополнения</b> (непереходные): <i>The plane <b>took off</b>. Prices <b>went up</b>. Don't <b>give up</b>!</i></p>\n<p><b>2) Разделяемые</b> — дополнение-существительное можно поставить в двух местах:</p>\n<p class=\"ex\">The referee <b>sent off</b> the player. = The referee <b>sent</b> the player <b>off</b>.</p>\n<div class=\"note\">⚠️ Местоимение (him, it, them) — <b>только между</b>: The referee sent <b>him</b> off. (не <s>sent off him</s>)<br>Put <b>it</b> on. Turn <b>it</b> off. Pick <b>me</b> up at 7.</div>\n<p><b>3) Неразделяемые</b> — дополнение всегда после частицы: <i>look <b>after</b> the kids, get <b>over</b> an injury, run <b>into</b> an old friend, deal <b>with</b> it</i>.</p>\n<p><b>4) Трёхчастные</b> — неразделяемые: <i>look forward <b>to</b>, run out <b>of</b>, get on <b>with</b>, put up <b>with</b>, come up <b>with</b>, catch up <b>with</b></i>.</p>\n\n<h4>3. Значения частиц (подсказки)</h4>\n<ul><li><b>up</b> — полностью, до конца, вверх: <i>eat up, fill up, use up, tidy up, warm up</i></li>\n<li><b>off</b> — отделение, отмена, отключение: <i>send off, call off (отменить), switch off, take off</i></li>\n<li><b>out</b> — наружу, до конца, исчезновение: <i>run out, find out (узнать), work out, sort out</i></li>\n<li><b>on</b> — продолжение, включение: <i>carry on, go on, keep on, put on, switch on</i></li>\n<li><b>down</b> — уменьшение, запись, отказ: <i>slow down, write down, turn down (отклонить), calm down</i></li>\n<li><b>back</b> — возврат: <i>call back, pay back, come back</i></li></ul>\n\n<h4>4. Один глагол — много значений</h4>\n<p class=\"ex\"><b>take off</b>: снять (одежду) / взлететь / резко стать успешным<br>\n<b>pick up</b>: поднять / забрать (кого-то) / выучить «на слух» (язык)<br>\n<b>work out</b>: тренироваться / решить, понять / получиться<br>\n<b>get on</b>: садиться (в автобус) / ладить (get on with) / продвигаться (How are you getting on?)</p>\n\n<h4>5. Футзал и судейство</h4>\n<p class=\"ex\">send off — удалить; take a kick — выполнить удар; kick off — начать матч; blow up (for a foul) — свистнуть нарушение; play on — продолжать игру; calm down — успокоиться; back off — отойти; break up (a fight) — разнять; hold up play — задерживать игру; call off a match — отменить матч</p>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ The referee sent off him. → ✅ The referee sent <b>him off</b>.<br>❌ I look forward to see you. → ✅ …to <b>seeing</b> you.<br>❌ Turn off it. → ✅ Turn <b>it off</b>.<br>❌ We run out water. → ✅ We've run out <b>of</b> water.</div>","ex":[{"q":"The referee sent ___ for a second caution.","o":["off him","him off","him out"],"a":1,"why":"Местоимение между глаголом и частицей."},{"q":"We've run ___ of water — can someone buy some?","o":["out","off","up"],"a":0,"why":"run out of — закончиться."},{"q":"I'm looking forward ___ you next week.","o":["to see","to seeing","seeing"],"a":1,"why":"look forward to + -ing."},{"q":"Don't give ___! You're making progress.","o":["off","up","on"],"a":1,"why":"give up — сдаваться."},{"q":"The player had to take ___ his jewellery before the match.","o":["off","on","out"],"a":0,"why":"take off — снять."},{"q":"The match was ___ because of the storm. (отменили)","o":["called off","called up","called back"],"a":0,"why":"call off = отменить."},{"q":"Please turn ___. (the music)","o":["off it","it off","off"],"a":1,"why":"Местоимение — между глаголом и частицей."},{"q":"How did you ___ that the match was cancelled? (узнать)","o":["find out","look after","give up"],"a":0,"why":"find out = узнать, выяснить."},{"q":"The coach refused to ___ and kept shouting.","o":["calm down","calm up","calm off"],"a":0,"why":"calm down = успокоиться."},{"q":"I can't put up ___ his behaviour any longer.","o":["for","with","to"],"a":1,"why":"put up with = терпеть."}]},"reading":{"title":"Law 3 — Playing with fewer players","text":["In futsal, when a player is sent off after the kick-off, the team doesn't play with fewer players for the rest of the match. Instead, the team serves a two-minute numerical reduction.","A substitute may replace the sent-off player after two minutes of playing time have elapsed, with the permission of the timekeeper or the third referee. However, if a goal is scored before the two minutes are over, special rules apply.","If it's five players against four (or four against three) and the team with more players scores, the team with fewer players can be completed with one player. If the team with fewer players scores, nothing changes — they must wait until the two minutes are over. If both teams are playing with fewer players and someone scores, neither team gets a player back until its two minutes have elapsed."],"q":[{"q":"How long is the numerical reduction after a sending-off?","o":["One minute","Two minutes","The rest of the match"],"a":1},{"q":"5 v 4: the team with five players scores. What happens?","o":["The team with four can add one player","Nothing changes","The match is restarted with a dropped ball"],"a":0},{"q":"5 v 4: the team with four players scores. What happens?","o":["They get a player back","Nothing changes until the two minutes are over","The other team loses a player"],"a":1}]},"listening":{"title":"A booking problem","theme":"life","lines":[["Receptionist","Good evening. How can I help you?"],["Guest","Hi. I booked three nights, but your system says two. I'd like to get to the bottom of this."],["Receptionist","Let me check... You're right, there was a setback with our new booking system this week."],["Guest","I'm here for a tournament until Sunday, so I really need that third night."],["Receptionist","The hotel is full on Saturday, but let me think outside the box. Our sister hotel is just across the street."],["Guest","Hmm, I'd have to weigh up the pros and cons. Would I need to move my luggage?"],["Receptionist","No, we'll do it for you. And breakfast is free. I'm sure we can iron out any other details."]],"q":[{"q":"What is the problem?","o":["The room is dirty","The booking is for two nights instead of three","The price is wrong"],"a":1},{"q":"What caused the problem?","o":["A setback with the new booking system","The guest made a mistake","A tournament"],"a":0},{"q":"What solution does the receptionist offer?","o":["A room in the sister hotel across the street","A refund","A bigger room"],"a":0}]}},{"title":"Signals & positioning · Изучение языка","futsal":[{"en":"whistle","ru":"свисток / свистеть","ex":"The referee blew the whistle to stop play."},{"en":"signal","ru":"сигнал (жест) / подавать сигнал","ex":"The referees must give the mandatory signals."},{"en":"action area","ru":"зона действия (где мяч)","ex":"One referee controls the action area."},{"en":"influence area","ru":"зона влияния (где мяча нет, но возможен конфликт)","ex":"The other referee watches the influence area."},{"en":"eye contact","ru":"зрительный контакт","ex":"After a goal, the referees make eye contact."},{"en":"diagonal system","ru":"диагональная система (расстановка)","ex":"The referees use a diagonal system."},{"en":"positioning","ru":"позиционирование, выбор позиции","ex":"Good positioning helps the referees see the offence."},{"en":"field of vision","ru":"поле зрения","ex":"The other referee should stay within your field of vision."},{"en":"mandatory signal","ru":"обязательный сигнал","ex":"The goalscorer's number is shown with a mandatory signal."},{"en":"to face the pitch","ru":"стоять лицом к площадке","ex":"The referees must always face the pitch."}],"life":[{"en":"to get the hang of","ru":"наловчиться, освоить","ex":"It took me a while to get the hang of the four-second count."},{"en":"to struggle with","ru":"с трудом справляться с","ex":"I still struggle with phrasal verbs."},{"en":"to grasp","ru":"уловить, понять (суть)","ex":"She quickly grasped the main idea of the rule."},{"en":"to learn by heart","ru":"выучить наизусть","ex":"I learned all the referee signals by heart."},{"en":"to be rusty","ru":"«заржаветь», подзабыть (навык)","ex":"My English is a bit rusty — I haven't spoken it for years."},{"en":"to pick someone's brain","ru":"посоветоваться со знающим человеком","ex":"Can I pick your brain about the new handball rule?"},{"en":"a steep learning curve","ru":"когда нужно быстро освоить много нового","ex":"My first season as a referee was a steep learning curve."},{"en":"to cram (for an exam)","ru":"зубрить (перед экзаменом)","ex":"I crammed for the referee exam all night."},{"en":"to read up on","ru":"почитать, изучить (тему)","ex":"I need to read up on the video support protocol."},{"en":"trial and error","ru":"метод проб и ошибок","ex":"I learned to position myself by trial and error."}],"grammar":{"title":"used to / be used to / get used to","explain":"\n<h4>1. used to + глагол — «раньше (а теперь нет)»</h4>\n<p>Привычки и состояния в прошлом, которых больше нет:</p>\n<p class=\"ex\">I <b>used to play</b> futsal, but now I referee.<br><span class=\"t\">Раньше я играла в футзал, а теперь сужу.</span></p>\n<p class=\"ex\">There <b>used to be</b> a cinema here. She <b>used to have</b> long hair.</p>\n<p><b>Отрицание и вопрос</b> — через did, и тогда <b>use</b> (без d):</p>\n<p class=\"ex\">I <b>didn't use to</b> like vegetables. <b>Did</b> you <b>use to</b> live here?</p>\n<div class=\"note\">⚠️ used to — только о прошлом. Для настоящих привычек — Present Simple + usually: <s>I use to get up at 7</s> → I <b>usually</b> get up at 7.</div>\n\n<h4>2. would — повторяющиеся действия в прошлом</h4>\n<p>В воспоминаниях вместо used to можно <b>would</b>, но <b>только для действий</b>, не для состояний:</p>\n<p class=\"ex\">When I was a child, my dad <b>would take</b> me to every match. ✅<br>I <b>would have</b> a dog. ❌ → I <b>used to have</b> a dog. ✅ (состояние)</p>\n\n<h4>3. be used to + -ing / существительное — «привыкла»</h4>\n<p class=\"ex\">I'<b>m used to working</b> under pressure. — Я привыкла работать под давлением.<br>Referees <b>are used to</b> criticism.<br>She <b>wasn't used to</b> the noise.</p>\n\n<h4>4. get used to + -ing / существительное — «привыкать»</h4>\n<p class=\"ex\">It took me a year to <b>get used to</b> the new rules.<br>You'll <b>get used to getting</b> up early.<br>I'm <b>getting used to</b> refereeing with video support.</p>\n\n<h4>5. Сравним три конструкции</h4>\n<table><tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>\n<tr><td>used to <b>do</b></td><td>раньше делал(а)</td><td>I used to <b>live</b> in Brest.</td></tr>\n<tr><td>be used to <b>doing</b></td><td>привык(ла) (состояние)</td><td>I'm used to <b>living</b> alone.</td></tr>\n<tr><td>get used to <b>doing</b></td><td>привыкаю (процесс)</td><td>I'm getting used to <b>living</b> here.</td></tr></table>\n<div class=\"note\">⚠️ В be/get used to слово <b>to — предлог</b>, поэтому дальше -ing, а не начальная форма!</div>\n\n<h4>6. Не путать с глаголом use</h4>\n<p class=\"ex\">The ball <b>is used</b> [juːzd] in official matches. — Мяч используется (пассив от use).<br>I <b>used to</b> [juːstə] play. — Раньше я играла.</p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ I'm used to work late. → ✅ I'm used to <b>working</b> late.<br>❌ Did you used to…? → ✅ Did you <b>use</b> to…?<br>❌ I use to drink coffee every day. → ✅ I <b>usually</b> drink coffee every day.</div>","ex":[{"q":"I ___ be a player before I became a referee.","o":["used to","am used to","use to"],"a":0,"why":"Прошлое, которого сейчас нет → used to + V."},{"q":"Referees ___ shouting fans.","o":["used to","are used to","use to"],"a":1,"why":"Привычны к → are used to + noun."},{"q":"I'm slowly getting used to ___ up at 6 am.","o":["get","getting","got"],"a":1,"why":"get used to + -ing."},{"q":"Did you ___ watch cartoons when you were a child?","o":["used to","use to","using to"],"a":1,"why":"В вопросе с did → use to."},{"q":"She isn't used to ___ in English yet.","o":["speak","speaking","spoke"],"a":1,"why":"be used to + -ing."},{"q":"When I was a child, my grandmother ___ me stories every night.","o":["would tell","was used to tell","is used to telling"],"a":0,"why":"Повторяющееся действие в прошлом → would / used to."},{"q":"I ___ have a dog when I was a child.","o":["would","used to","am used to"],"a":1,"why":"Состояние (have) → только used to, не would."},{"q":"It took me months to get used to ___ in English.","o":["think","thinking","thought"],"a":1,"why":"get used to + -ing."},{"q":"I ___ get up at 7 on weekdays. (сейчас)","o":["use to","usually","used to"],"a":1,"why":"Настоящая привычка → Present Simple + usually."},{"q":"She ___ the noise of the fans — she's refereed for ten years.","o":["used to","is used to","uses to"],"a":1,"why":"Привыкла (состояние) → is used to + существительное."}]},"reading":{"title":"Positioning of the referees","text":["The two referees use a diagonal system. They usually stay outside the pitch, along opposite touchlines, so the play is between them. They only enter the pitch to get a better view.","The referee nearest to the ball controls the action area — the place where the ball is. The other referee watches the influence area — the place where the ball isn't, but where a dispute between players may happen. What needs to be seen is not always near the ball.","One referee should be in line with the second-last defender, or with the ball if it is nearer to the end line. The referees must always face the pitch.","After a clear goal, the two referees make eye contact. Then the referee nearest to the timekeeper's table goes there and shows the number of the player who scored with the mandatory signal."],"q":[{"q":"What is the 'influence area'?","o":["Where the ball is","Where the ball isn't, but a dispute may happen","The technical area"],"a":1},{"q":"When do the referees enter the pitch?","o":["Never","To get a better view","At every restart"],"a":1},{"q":"What do the referees do after a clear goal?","o":["Make eye contact","Stop the chronometer","Talk to the coaches"],"a":0}]},"listening":{"title":"Learning English for refereeing","theme":"life","lines":[["Teacher","So, why do you want to improve your English?"],["Referee","I've been selected for international tournaments, and all the communication there is in English."],["Teacher","Congratulations! How would you describe your level?"],["Referee","I studied English at school, but I'm a bit rusty. I can grasp most written texts, but I struggle with speaking."],["Teacher","That's very common. Once you start speaking every day, you'll get the hang of it quickly."],["Referee","I've already learned the key referee phrases by heart."],["Teacher","Great start. Now let's practise using them in real situations."]],"q":[{"q":"Why does the referee need English?","o":["International tournaments","A new job abroad","A university exam"],"a":0},{"q":"What does the referee struggle with?","o":["Reading","Speaking","Listening"],"a":1},{"q":"What has the referee already done?","o":["Learned key referee phrases by heart","Lived in England","Passed an exam"],"a":0}]}},{"title":"Video support · Идиомы","futsal":[{"en":"video support (VS)","ru":"видеоподдержка","ex":"Video support can be used for goals, penalties and direct red cards."},{"en":"to challenge a decision","ru":"оспорить решение (запросить просмотр)","ex":"The head coach challenged the decision."},{"en":"review","ru":"просмотр (видеоповтора) / пересматривать","ex":"The referees went to the review area to watch the replay."},{"en":"to overturn","ru":"отменить (решение)","ex":"After the review, the referee overturned the decision."},{"en":"spirit of the game","ru":"дух игры","ex":"Referees should apply the Laws within the spirit of the game."},{"en":"replay","ru":"повтор (видео)","ex":"The replay showed there was no contact."},{"en":"slow motion","ru":"замедленный повтор","ex":"Slow motion should only be used for facts."},{"en":"TV signal","ru":"сигнал «телевизор» (жест)","ex":"The referee showed the TV signal and went to the review area."},{"en":"mistaken identity","ru":"ошибка в определении игрока","ex":"A review is possible in cases of mistaken identity."},{"en":"to confirm (a decision)","ru":"подтвердить (решение)","ex":"After the review, the referee confirmed the goal."}],"life":[{"en":"to bite off more than you can chew","ru":"взять на себя больше, чем можешь","ex":"Three tournaments in one month? You've bitten off more than you can chew."},{"en":"to call it a day","ru":"закончить (на сегодня)","ex":"It's late — let's call it a day."},{"en":"to go the extra mile","ru":"сделать больше, чем требуется","ex":"She always goes the extra mile to prepare for a match."},{"en":"to be on the same page","ru":"одинаково понимать ситуацию, быть на одной волне","ex":"Before the match, the referees make sure they're on the same page."},{"en":"to cut corners","ru":"халтурить, экономить на качестве","ex":"Never cut corners when you check the pitch."},{"en":"to keep your eye on the ball","ru":"не терять бдительности, быть сосредоточенным","ex":"Keep your eye on the ball — the exam is next week."},{"en":"a level playing field","ru":"равные условия для всех","ex":"The new rules create a level playing field."},{"en":"to move the goalposts","ru":"менять правила по ходу дела","ex":"Our boss keeps moving the goalposts."},{"en":"to blow the whistle (on)","ru":"разоблачить, сообщить о нарушениях","ex":"An employee blew the whistle on the company's fraud."},{"en":"to be on the ball","ru":"быть сообразительным, начеку","ex":"The timekeeper was really on the ball today."}],"grammar":{"title":"Present Perfect Continuous; for vs since","explain":"\n<h4>1. Образование</h4>\n<p><b>have / has been + -ing</b></p>\n<p class=\"ex\">I'<b>ve been refereeing</b> for six years. She'<b>s been studying</b> since September.<br>\nI <b>haven't been sleeping</b> well. How long <b>have</b> you <b>been waiting</b>?</p>\n\n<h4>2. Когда используем</h4>\n<ul><li><b>Действие началось в прошлом и продолжается сейчас</b> (часто с for/since/how long):\n<p class=\"ex\">I'<b>ve been learning</b> English <b>for</b> three months.<br><span class=\"t\">Я учу английский (уже) три месяца.</span></p></li>\n<li><b>Недавно закончилось, и виден результат/следы:</b>\n<p class=\"ex\">You're out of breath. <b>Have</b> you <b>been running</b>?<br>It'<b>s been raining</b> — the streets are wet.</p></li>\n<li><b>Раздражение от длительности:</b> <p class=\"ex\">Who'<b>s been using</b> my whistle?! I'<b>ve been waiting</b> for an hour!</p></li></ul>\n<div class=\"note\">⚠️ В русском «Я живу здесь пять лет» — настоящее время. В английском нельзя Present Simple: ❌ <s>I live here for five years</s> → ✅ I'<b>ve been living</b> / I'<b>ve lived</b> here for five years.</div>\n\n<h4>3. for vs since</h4>\n<table><tr><th>for + период</th><th>since + точка отсчёта</th></tr>\n<tr><td>for two hours, for ten years, for a long time, for ages</td><td>since 2019, since Monday, since 9 am, since I was a child, since the match started</td></tr></table>\n<p>После since с придаточным — Past Simple: <i>I've been refereeing <b>since</b> I <b>was</b> 20.</i></p>\n\n<h4>4. Present Perfect Continuous vs Present Perfect Simple</h4>\n<table><tr><th>Continuous — процесс, длительность</th><th>Simple — результат, количество</th></tr>\n<tr><td>I'<b>ve been reading</b> the Laws all morning. (процесс, может, не закончила)</td><td>I'<b>ve read</b> the Laws twice. (результат: 2 раза)</td></tr>\n<tr><td>She'<b>s been writing</b> reports for hours.</td><td>She'<b>s written</b> five reports.</td></tr>\n<tr><td>How long have you been learning English?</td><td>How many words have you learned?</td></tr></table>\n<div class=\"note\">⚠️ Если есть <b>число/количество</b> (how many, three times, five reports) → Simple.<br>Если важна <b>длительность</b> (how long, all day, for hours) → обычно Continuous.</div>\n\n<h4>5. Глаголы состояния — только Simple</h4>\n<p class=\"ex\">I'<b>ve known</b> her for years. (не <s>have been knowing</s>)<br>He'<b>s had</b> this car since 2015. She'<b>s been</b> a referee since 2019.</p>\n<p>С <b>live, work, teach, study</b> подходят оба варианта, разница минимальна: <i>I've lived / I've been living here for 5 years.</i> (Continuous — чуть более «временно»)</p>\n\n<h4>6. It's been … since — «прошло … с тех пор»</h4>\n<p class=\"ex\">It'<b>s been</b> two years <b>since</b> I refereed in Spain.<br><span class=\"t\">Прошло два года с тех пор, как я судила в Испании.</span></p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ I study English for 3 months. → ✅ I'<b>ve been studying</b> English for 3 months.<br>❌ I've been knowing him since school. → ✅ I'<b>ve known</b> him since school.<br>❌ since three years → ✅ <b>for</b> three years<br>❌ I've been writing three reports today. → ✅ I'<b>ve written</b> three reports today.</div>","ex":[{"q":"I've been learning English ___ three months.","o":["since","for","from"],"a":1,"why":"Период → for."},{"q":"She has been a referee ___ 2019.","o":["for","since","ago"],"a":1,"why":"Точка отсчёта → since."},{"q":"You look tired. ___ you been running?","o":["Have","Did","Are"],"a":0,"why":"Have you been running? — видимый результат."},{"q":"I ___ him since we were at school.","o":["have been knowing","have known","know"],"a":1,"why":"know — глагол состояния → Present Perfect."},{"q":"How long ___ you been waiting?","o":["have","are","did"],"a":0,"why":"How long have you been + -ing."},{"q":"I ___ five matches this month.","o":["have been refereeing","have refereed","referee"],"a":1,"why":"Количество (five matches) → Present Perfect Simple."},{"q":"It's been two years ___ I refereed in Spain.","o":["for","since","ago"],"a":1,"why":"It's been + период + since."},{"q":"The streets are wet. It ___.","o":["has been raining","rains","has rained for"],"a":0,"why":"Видимый результат длительного действия → Continuous."},{"q":"She's been a referee since she ___ twenty.","o":["has been","was","is"],"a":1,"why":"После since с придаточным → Past Simple."},{"q":"I ___ my keys. Can you help me look for them?","o":["have been losing","have lost","lose"],"a":1,"why":"Результат (ключей нет) → Present Perfect Simple."}]},"reading":{"title":"Video Support in futsal","text":["In futsal, video support (VS) works differently from VAR in football. There is no video assistant watching all the time. Instead, a team's head coach can challenge a decision.","A coach can ask for a review only in certain situations: goal or no goal, penalty or no penalty, direct red cards, and mistaken identity. To challenge, the coach twirls a finger in the air and tells the third or fourth referee.","The referees show the TV signal — the outline of a screen — and go to the referee review area to watch the replay. Slow motion is used for facts, like the position of a foul; normal speed is used to judge how strong a foul was.","After the review, the referee makes the final decision and can confirm or overturn the first decision. Accuracy is more important than speed, so there is no time limit for a review."],"q":[{"q":"Who can ask for a video review?","o":["Any player","The head coach","The timekeeper"],"a":1},{"q":"Which situation can be reviewed?","o":["A kick-in","Penalty or no penalty","A second yellow card"],"a":1},{"q":"Why is there no time limit for a review?","o":["Accuracy is more important than speed","Because the clock is stopped","Because coaches can talk"],"a":0}]},"listening":{"title":"After the final","theme":"futsal","lines":[["Assessor","Congratulations on the final. How do you feel?"],["Referee","Relieved! I was worried I'd bitten off more than I could chew with three tournaments this month."],["Assessor","Well, it didn't show. You and your colleague were clearly on the same page all match."],["Referee","We spent a lot of time on the briefing. I didn't want to cut corners."],["Assessor","And the video review in the second half? You overturned the penalty."],["Referee","After the replay, I saw there was no contact. Getting it right matters more than my pride."],["Assessor","That's going the extra mile. Now go and rest — let's call it a day."]],"q":[{"q":"What was the referee worried about?","o":["Taking on too much","The weather","Her English"],"a":0},{"q":"Why did the referees work well together?","o":["They had a long briefing","They are old friends","They used video support"],"a":0},{"q":"What happened to the penalty decision?","o":["It was confirmed","It was overturned after the replay","It was never given"],"a":1}]}}];

function completeStep(n, k, score){
  const p=lp(n); const first = p.steps[k]===undefined;

}

/* Generic multiple-choice runner */
function runQuiz(container, questions, opts){
  // questions: [{q, o:[], a, why?, html?}]
  const state = opts.state; // persistent across renders
  if(!state.qs){ state.qs = questions.map(q=>{ const order=shuffle(q.o.map((_,i)=>i)); return {...q, order}; }); state.i=0; state.score=0; state.picked=null; }
  const draw = () => {
    const q = state.qs[state.i];
    if(!q){ // finished
      const pct = Math.round(state.score/state.qs.length*100);
      container.innerHTML = `<div class="card center"><div class="big">${pct>=80?'🏆':pct>=50?'👍':'💪'}</div><h3>${state.score} из ${state.qs.length}</h3><div class="muted small">${pct>=80?'Отлично!':pct>=50?'Хорошо, но есть что подтянуть':'Стоит повторить ещё раз'}</div></div>
        <div class="btns"><button class="btn line" id="again">Ещё раз</button><button class="btn" id="cont">${opts.nextLabel||'Дальше'}</button></div>`;
      container.querySelector('#again').onclick=()=>{ Object.keys(state).forEach(k=>delete state[k]); runQuiz(container, questions, opts); };
      container.querySelector('#cont').onclick=()=>opts.onDone(state.score/state.qs.length);
      return;
    }
    const picked = state.picked;
    container.innerHTML = `
      <div class="progress"><i style="width:${state.i/state.qs.length*100}%"></i></div>
      <div class="card">
        <div class="small muted">${opts.label||'Вопрос'} ${state.i+1} / ${state.qs.length}</div>
        <div class="q" style="margin:6px 0 10px">${q.html||esc(q.q)}</div>
        ${q.order.map(k=>{ let cls=''; if(picked!==null){ if(k===q.a) cls='ok'; else if(k===picked) cls='bad'; }
          return `<button class="opt ${cls}" data-k="${k}" ${picked!==null?'disabled':''}>${esc(q.o[k])}</button>`; }).join('')}
        ${picked!==null?`<div class="feedback ${picked===q.a?'ok':'bad'}">${picked===q.a?'Верно! ':'Правильно: <b>'+esc(q.o[q.a])+'</b>. '}${q.why?esc(q.why):''}</div>`:''}
      </div>
      ${picked!==null?`<button class="btn" id="nx">${state.i<state.qs.length-1?'Следующий':'Результат'}</button>`:''}`;
    container.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; state.picked=k; const ok=k===q.a; if(ok) state.score++; answer(ok); if(opts.onAnswer) opts.onAnswer(q,ok); save(); draw(); });
    const nx=container.querySelector('#nx'); if(nx) nx.onclick=()=>{ state.i++; state.picked=null; draw(); };
  };
  draw();
}

function playerHTML(id){
  return `<div class="card player"><button class="play" id="pp">${ICON.play}</button>

    <button class="speed" id="spd">${audioRate}×</button></div>`;
}
function fmt(t){ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function bindPlayer(id, onLine){
  const pp=$('#pp'), bar=$('#bar'), spd=$('#spd');
  const src='audio/'+id+'.mp3';
  const sync=(ended)=>{
    if(!pp || !pp.isConnected) return;
    const mine = audio.src.endsWith(src);
    const playing = mine && !audio.paused && !ended;
    pp.innerHTML = playing?ICON.pause:ICON.play;
    if(mine && audio.duration){ bar.firstElementChild.style.width=(audio.currentTime/audio.duration*100)+'%'; $('#tcur').textContent=fmt(audio.currentTime); $('#tdur').textContent=fmt(audio.duration); }
    if(onLine) onLine(mine?audio.currentTime:-1, ended);
  };
  onTick = sync;
  pp.onclick=()=>{
    if(audio.src.endsWith(src)){ if(audio.paused){ audio.playbackRate=audioRate; audio.play(); } else audio.pause(); }
    else play(id, audioRate);
    setTimeout(()=>sync(),50);
  };
  audio.onpause = ()=>sync(); audio.onplay=()=>sync(); audio.onloadedmetadata=()=>sync();
  bar.onclick=(e)=>{ if(!audio.src.endsWith(src)||!audio.duration) return; const r=bar.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; };
  spd.onclick=()=>{ audioRate = audioRate===1?0.8:audioRate===0.8?1.2:1; spd.textContent=audioRate+'×'; audio.playbackRate=audioRate; };
  return sync;
}

/* Reading */
function termIndex(upTo){
  const terms=[];
  WORDS.filter(w=>w.lesson<=upTo).forEach(w=>{
    let base=w.en.replace(/\(.*?\)/g,'').replace(/^to /,'').replace(/[?!.]/g,'').replace(/\.\.\./g,'').trim();
    if(base.length<3 || /\.\.\.|…/.test(w.en)) return;
    terms.push({base, w});
  });
  terms.sort((a,b)=>b.base.length-a.base.length);
  return terms;
}
function highlight(text, terms){
  // mark terms (case-insensitive, allow simple endings)
  let html = esc(text); const segs=[];
  terms.forEach(t=>{
    const re = new RegExp('(^|[^\\w])('+t.base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s')+'(?:s|es|ed|d|ing)?)(?!\\w)','i');
    if(re.test(html)) html = html.replace(re, (m,a,b)=>{ segs.push([t.w.id,b]); return a+'\u0001'+(segs.length-1)+'\u0002'; });
  });
  return html.replace(/\u0001(\d+)\u0002/g,(m,k)=>`<span class="term" onclick="showTerm('${segs[k][0]}')">${segs[k][1]}</span>`);
}
let popT;
window.showTerm = (id) => {
  const w=WMAP[id]; let p=$('.pop'); if(!p){ p=document.createElement('div'); p.className='pop'; document.body.appendChild(p); }
  p.innerHTML = `<b>${esc(w.en)}</b> — ${esc(w.ru)}`; p.style.display='block'; say(id,'w');
  clearTimeout(popT); popT=setTimeout(()=>p.style.display='none', 3500);
};

    <h2>Слова</h2>
    <div class="card">
      ${[['Новые (0)',boxes[0]],['Знакомые (1–2)',boxes[1]+boxes[2]],['Почти выучены (3–4)',boxes[3]+boxes[4]],['Выучены (5–6)',boxes[5]+boxes[6]]].map(([l,v])=>`<div class="row between" style="padding:6px 0"><span>${l}</span><b>${v}</b></div>`).join('')}
      <div class="small muted" style="margin-top:6px">Слово возвращается через 1, 2, 4, 7, 14, 30 и 60 дней, если ты его помнишь. Если забыла — снова через день.</div>
    </div>
    <h2>Сохранение</h2>
    <div class="card small">${inTG?'Прогресс сохраняется в облаке Telegram и не пропадёт при смене телефона.':'Прогресс сохраняется в этом браузере. Внутри Telegram он будет храниться в облаке Telegram.'}
      <div class="btns"><button class="btn line" onclick="exportProgress()">Резервная копия</button><button class="btn line" onclick="importProgress()">Восстановить</button></div>
      <button class="btn line" style="color:var(--red)" onclick="resetAll()">Сбросить весь прогресс</button></div>`;
};
window.exportProgress = () => { const s=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alertMsg('Резервная копия скопирована. Сохрани её, например, в «Избранном» Telegram.')).catch(()=>prompt('Скопируй этот код:', s)); };
window.importProgress = () => { const s=prompt('Вставь код резервной копии:'); if(!s) return; try{ S=JSON.parse(decodeURIComponent(escape(atob(s.trim())))); save(); render(); alertMsg('Прогресс восстановлен'); }catch(e){ alertMsg('Код не подошёл'); } };
window.resetAll = () => { const doit=()=>{ S=blank(); save(); tab('home'); };
  if(inTG && tg.showConfirm) tg.showConfirm('Точно удалить весь прогресс?', ok=>ok&&doit()); else if(confirm('Точно удалить весь прогресс?')) doit(); };
function alertMsg(m){ if(inTG && tg.showAlert) tg.showAlert(m); else alert(m); }

/* ---------- Boot ---------- */
// If a lesson got new words after it was studied, reopen its Words + Quiz steps.
function migrate(){
  let changed=false;
  LESSONS.forEach((L,i)=>{ const n=i+1, p=S.lessons[n]; if(!p||p.steps.words===undefined) return;
    const ids=[...L.futsal.map((_,j)=>cardId(n,'futsal',j)), ...L.life.map((_,j)=>cardId(n,'life',j))];
    if(ids.some(id=>!S.cards[id])){ delete p.steps.words; delete p.steps.quiz; delete p.done; changed=true; } });
  if(changed) save();
}
(async function(){
  const local = loadLocal(); if(local) S = Object.assign(blank(), local);
  migrate(); render();
  const cloud = await loadCloud();
  if(cloud && (cloud.updated||0) > (S.updated||0)){ S = Object.assign(blank(), cloud); migrate(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
})();
</script>
