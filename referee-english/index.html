<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Referee English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #f4f3ef);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #1b1d1c);
  --hint: var(--tg-theme-hint-color, #7b807d);
  --accent: #1f7a4d;
  --accent-soft: rgba(31,122,77,.12);
  --yellow: #f2b705;
  --red: #d64541;
  --line: rgba(127,127,127,.18);
  --ok: #1f9d55;
  --bad: #d64541;
  --r: 16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg: var(--tg-theme-bg-color,#121413); --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color,#1d201f)); --text: var(--tg-theme-text-color,#eceeed); --hint: var(--tg-theme-hint-color,#8d938f); --accent:#3fb37a; --accent-soft: rgba(63,179,122,.16); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px;min-height:100vh}
h1{font-size:24px;line-height:1.2;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--hint)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-align:center;margin-top:12px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.life{background:rgba(242,183,5,.18);color:#a37700}
@media (prefers-color-scheme: dark){.pill.life{color:#f2c94c}}
.hero{background:linear-gradient(135deg,#1f7a4d,#145236);color:#fff;border-radius:20px;padding:18px;margin:10px 0;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .btn{background:#fff;color:#145236}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:2px solid rgba(255,255,255,.18);border-radius:50%}
.hero:before{content:"";position:absolute;right:35px;top:-30px;width:2px;height:200px;background:rgba(255,255,255,.18)}
.stepdots{display:flex;gap:6px;margin:12px 0 4px}
.stepdots span{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}
.stepdots span.on{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--hint)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.num.done{background:var(--accent);color:#fff}
.num.lock{background:var(--line);color:var(--hint)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}
.tabs button{padding:8px 12px;border-radius:99px;background:var(--card);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button.done:not(.on){color:var(--accent)}
.word{font-size:30px;font-weight:700;line-height:1.15;margin:10px 0 4px;letter-spacing:-.01em}
.tr{font-size:18px;margin:8px 0}
.exs{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-top:14px}
.say{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.say.sm{width:32px;height:32px}
.say svg{width:20px;height:20px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.12)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,65,.10)}
.opt:disabled{color:var(--text)}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.feedback.ok{background:rgba(31,157,85,.12)}
.feedback.bad{background:rgba(214,69,65,.10)}
.q{font-size:18px;font-weight:600}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.grammar p{margin:8px 0}
.grammar .ex{background:var(--accent-soft);padding:8px 12px;border-radius:10px;font-style:italic}
.text p{margin:0 0 12px}
.term{border-bottom:2px dotted var(--accent);cursor:pointer}
.player{display:flex;align-items:center;gap:12px}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.bar{flex:1;height:6px;background:var(--line);border-radius:4px;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.speed{font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);min-width:46px}
.tline{padding:8px 10px;border-radius:10px;margin:2px 0;transition:background .2s}
.tline.cur{background:var(--accent-soft)}
.tline b{color:var(--accent);font-weight:600}
.pop{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1d1c;color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;max-width:90vw;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.boxdots{display:inline-flex;gap:3px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--accent)}
input.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.center{text-align:center}
.big{font-size:48px;margin:8px 0}
.dict .item{align-items:flex-start}
.ycard{display:inline-block;width:12px;height:16px;border-radius:2px;background:var(--yellow);vertical-align:-2px;margin-right:6px;transform:rotate(-8deg)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const LESSONS = [{"title":"The pitch · Знакомство","futsal":[{"en":"touchline","ru":"боковая линия","ex":"The two longer boundary lines are the touchlines."},{"en":"end line","ru":"линия ворот (лицевая линия)","ex":"The ball went over the end line, so it's a corner kick."},{"en":"halfway line","ru":"средняя линия","ex":"The halfway line divides the pitch into two halves."},{"en":"penalty area","ru":"штрафная площадь","ex":"The goalkeeper can use their hands only inside the penalty area."},{"en":"substitution zone","ru":"зона замены","ex":"Players must leave the pitch through their own substitution zone."}],"life":[{"en":"How's it going?","ru":"Как дела? (неформально)","ex":"Hi Anna! How's it going?"},{"en":"Nice to meet you too","ru":"Мне тоже приятно познакомиться","ex":"— I'm Tom. — Nice to meet you too, Tom."},{"en":"What do you do?","ru":"Чем вы занимаетесь? (о работе)","ex":"So, what do you do? — I'm a futsal referee."},{"en":"to be into something","ru":"увлекаться чем-то","ex":"I'm really into sports, especially futsal."},{"en":"by the way","ru":"кстати","ex":"By the way, are you coming to the match on Saturday?"}],"grammar":{"title":"Present Simple vs Present Continuous","explain":"<p><b>Present Simple</b> — факты, правила, привычки. Именно в нём написаны правила игры.</p>\n<p class=\"ex\">The match <b>lasts</b> 40 minutes. The referee <b>blows</b> the whistle.</p>\n<p><b>Present Continuous</b> (am/is/are + -ing) — то, что происходит прямо сейчас или временно.</p>\n<p class=\"ex\">Look! The goalkeeper <b>is playing</b> as a flying goalkeeper.</p>\n<p>Маркеры: <i>always, usually, every day</i> → Simple; <i>now, at the moment, look!</i> → Continuous.</p>\n<p>⚠️ Глаголы состояния (<i>know, like, want, need, believe</i>) обычно не используются в Continuous: <i>I <b>know</b> the rules</i>, а не <s>I am knowing</s>.</p>","ex":[{"q":"A futsal team ___ five players on the pitch.","o":["has","is having","have"],"a":0,"why":"Это правило, факт → Present Simple, he/she/it + -s."},{"q":"Be quiet! The referee ___ to the captain right now.","o":["talks","is talking","talk"],"a":1,"why":"«right now» — действие происходит в момент речи."},{"q":"I ___ the Laws of the Game very well.","o":["am knowing","knows","know"],"a":2,"why":"know — глагол состояния, не бывает в Continuous."},{"q":"This month I ___ English every evening.","o":["am studying","study","studies"],"a":0,"why":"Временная ситуация (this month) → Present Continuous."},{"q":"The timekeeper usually ___ next to the third referee.","o":["is sitting","sits","sit"],"a":1,"why":"usually — привычка/регулярность → Present Simple."}]},"reading":{"title":"Law 1 — The Pitch","text":["A futsal pitch is a rectangle. The two longer lines are called touchlines, and the two shorter lines are called end lines. The part of the end line between the goalposts is the goal line. All lines are 8 cm wide, and they belong to the area they surround.","The halfway line divides the pitch into two halves. In the middle of it there is a centre mark with a circle around it. The radius of this circle is 3 metres.","For international matches, the touchline is between 38 and 42 metres long, and the end line is between 20 and 25 metres long. The surface should be flat and smooth, and wood is the preferred material.","In front of each team bench there is a substitution zone. It is 5 metres long, and it is always in the half of the pitch that the team defends. In the second half the teams change ends, so their substitution zones change too."],"q":[{"q":"What are the two shorter lines of the pitch called?","o":["Touchlines","End lines","Halfway lines"],"a":1},{"q":"How long is the touchline in an international match?","o":["25–38 m","38–42 m","20–25 m"],"a":1},{"q":"Where is a team's substitution zone?","o":["In the half the team attacks","In the half the team defends","Next to the timekeeper's table"],"a":1}]},"listening":{"title":"Meeting a new colleague","theme":"life","lines":[["Kate","Hi! I don't think we've met. I'm Kate."],["Mark","Hi Kate, I'm Mark. Nice to meet you."],["Kate","Nice to meet you too. So, what do you do, Mark?"],["Mark","I'm a PE teacher at a school. And at the weekends I referee futsal matches."],["Kate","Really? That's interesting. I'm into futsal too. I play in an amateur team."],["Mark","Oh, great. By the way, how long have you been playing?"],["Kate","About three years. We train twice a week, on Tuesdays and Thursdays."],["Mark","Cool. Maybe I'll see you at a match one day. Just don't argue with the referee!"]],"q":[{"q":"What is Mark's main job?","o":["Futsal referee","PE teacher","Futsal coach"],"a":1},{"q":"When does Kate's team train?","o":["Tuesdays and Thursdays","At the weekends","Every day"],"a":0},{"q":"What does Mark joke about at the end?","o":["Kate's team","Arguing with the referee","The school"],"a":1}]}},{"title":"Marks & goals · Распорядок дня","futsal":[{"en":"penalty mark","ru":"отметка пенальти (6 м)","ex":"The penalty mark is 6 m from the middle of the goal line."},{"en":"10 m mark","ru":"10-метровая отметка (второй пенальти)","ex":"The sixth accumulated foul is often taken from the 10 m mark."},{"en":"corner arc","ru":"угловая дуга","ex":"Defenders must be at least 5 m from the corner arc."},{"en":"technical area","ru":"техническая зона","ex":"The coach must stay inside the technical area."},{"en":"crossbar","ru":"перекладина","ex":"The ball hit the crossbar and stayed on the pitch."}],"life":[{"en":"to oversleep","ru":"проспать","ex":"I overslept and missed my bus."},{"en":"to run late","ru":"опаздывать (быть в процессе опоздания)","ex":"Sorry, I'm running late — I'll be there in ten minutes."},{"en":"commute","ru":"дорога на работу / ездить на работу","ex":"My commute takes about forty minutes."},{"en":"to grab a coffee","ru":"взять / выпить кофе (быстро)","ex":"Let's grab a coffee before the meeting."},{"en":"chores","ru":"домашние дела","ex":"I usually do the chores on Sunday morning."}],"grammar":{"title":"Past Simple vs Present Perfect","explain":"<p><b>Past Simple</b> — законченное действие в известный момент прошлого (yesterday, last week, in 2023, ago).</p>\n<p class=\"ex\">The referee <b>showed</b> a red card <b>in the second half</b>.</p>\n<p><b>Present Perfect</b> (have/has + V3) — результат важен сейчас, время не указано; опыт; <i>already, yet, just, ever, never</i>.</p>\n<p class=\"ex\">I <b>have</b> never <b>refereed</b> an international match. She <b>has just scored</b>!</p>\n<p>Если есть конкретное время в прошлом — только Past Simple: <s>I have seen him yesterday</s> → I <b>saw</b> him yesterday.</p>","ex":[{"q":"I ___ this match last Saturday.","o":["have refereed","refereed","referee"],"a":1,"why":"last Saturday — конкретное время → Past Simple."},{"q":"Have you ever ___ a penalty shoot-out?","o":["seen","saw","see"],"a":0,"why":"Present Perfect: have + V3 (see–saw–seen)."},{"q":"The team ___ already ___ five accumulated fouls in this half.","o":["did / commit","has / committed","have / commit"],"a":1,"why":"already + результат сейчас → has committed."},{"q":"She ___ her job two years ago.","o":["has changed","changed","changes"],"a":1,"why":"ago — всегда Past Simple."},{"q":"I can't find my whistle. I think I ___ it.","o":["have lost","lost yesterday","lose"],"a":0,"why":"Результат сейчас (не могу найти) → Present Perfect."}]},"reading":{"title":"Marks on the pitch","text":["Inside each penalty area there is a penalty mark. It is 6 metres from the midpoint between the goalposts. Penalty kicks are taken from this mark.","There is also a second mark, 10 metres from the goal. In futsal it is called the 10 m mark. A direct free kick for the sixth accumulated foul (and every foul after that) can be taken from here. Two small marks, 5 metres to the left and right of it, show the distance other players must respect.","In each corner of the pitch there is a corner arc with a radius of 25 cm. Outside the pitch, 5 metres from each corner arc, there is a short mark. It helps the referees check that defenders are far enough away at a corner kick.","The goals are placed in the middle of each goal line. They are 3 metres wide and 2 metres high, and they must be fixed safely."],"q":[{"q":"How far is the penalty mark from the goal?","o":["5 m","6 m","10 m"],"a":1},{"q":"What is the 10 m mark used for?","o":["Kick-offs","Free kicks from the sixth accumulated foul","Goal clearances"],"a":1},{"q":"What does the mark outside the pitch near the corner help with?","o":["Checking the distance at corner kicks","Substitutions","Measuring the ball"],"a":0}]},"listening":{"title":"Pre-match check","theme":"futsal","lines":[["Referee","Good evening! Let's do a quick check of the pitch before the match."],["Second referee","Sure. The lines look fine, but the left goal is moving a bit."],["Referee","That's not safe. Can you ask the hall manager to fix it, please?"],["Second referee","Of course. What about the balls?"],["Referee","I've already checked them. Two balls are perfect, one is too soft."],["Second referee","OK. And the substitution zones are marked correctly, five metres from the halfway line."],["Referee","Great. Let's meet the timekeeper at the table in ten minutes."]],"q":[{"q":"What problem does the second referee find?","o":["The lines are wrong","A goal is moving","There is no timekeeper"],"a":1},{"q":"What is wrong with one ball?","o":["It is too soft","It is too heavy","It is the wrong colour"],"a":0},{"q":"Where will they meet in ten minutes?","o":["In the dressing room","At the timekeeper's table","In the technical area"],"a":1}]}},{"title":"The players · Работа","futsal":[{"en":"substitute","ru":"запасной игрок / заменять","ex":"An unlimited number of substitutions may be made."},{"en":"flying goalkeeper","ru":"вратарь-игрок («летающий» вратарь)","ex":"The team is losing, so they are playing with a flying goalkeeper."},{"en":"outfield player","ru":"полевой игрок","ex":"Any outfield player may change places with the goalkeeper during a stoppage."},{"en":"bib","ru":"манишка","ex":"The substitute takes the bib from the player who is leaving the pitch."},{"en":"team list","ru":"заявка команды (протокол)","ex":"Only players named on the team list can take part in the match."}],"life":[{"en":"deadline","ru":"крайний срок, дедлайн","ex":"The deadline for the report is Friday."},{"en":"to be swamped","ru":"быть заваленным работой","ex":"Sorry, I can't talk now — I'm swamped."},{"en":"to catch up on","ru":"наверстать, догнать (дела, сон, новости)","ex":"I need to catch up on my emails."},{"en":"to take a day off","ru":"взять выходной","ex":"I'm taking a day off on Monday."},{"en":"colleague","ru":"коллега","ex":"My colleague helped me with the presentation."}],"grammar":{"title":"Modal verbs: must, have to, mustn't, don't have to","explain":"<p>В правилах футзала модальные глаголы встречаются постоянно!</p>\n<p><b>must / have to</b> — обязанность. <i>must</i> часто — правило или решение говорящего; <i>have to</i> — внешняя необходимость.</p>\n<p class=\"ex\">The ball <b>must</b> be stationary. I <b>have to</b> get up early tomorrow.</p>\n<p><b>mustn't</b> — запрет («нельзя»).</p>\n<p class=\"ex\">Substitutes <b>mustn't</b> enter the pitch during a timeout.</p>\n<p><b>don't have to</b> — нет необходимости («не обязательно»).</p>\n<p class=\"ex\">The player <b>doesn't have to</b> ask the referees' permission to leave the pitch.</p>\n<p>⚠️ <b>mustn't ≠ don't have to</b>! Это главная ловушка.</p>","ex":[{"q":"A substitution: the player leaving the pitch ___ ask the referees for permission.","o":["mustn't","doesn't have to","must"],"a":1,"why":"По правилам разрешение не нужно → не обязательно = doesn't have to."},{"q":"Players ___ make marks on the pitch with their feet. It's unsporting behaviour.","o":["mustn't","don't have to","have to"],"a":0,"why":"Это запрещено → mustn't."},{"q":"A team ___ have at least three players to start the match.","o":["mustn't","must","doesn't have to"],"a":1,"why":"Обязательное правило → must."},{"q":"It's Sunday, so I ___ go to work. Great!","o":["mustn't","don't have to","must"],"a":1,"why":"Нет необходимости → don't have to."},{"q":"Yesterday I ___ stay late at work. (прошедшее время)","o":["must","had to","musted"],"a":1,"why":"У must нет прошедшего времени → had to."}]},"reading":{"title":"Law 3 — The Players","text":["A futsal match is played by two teams. Each team has a maximum of five players on the pitch, and one of them must be the goalkeeper. A match cannot start or continue if a team has fewer than three players.","In futsal, substitutions are unlimited, and a player who has been replaced can come back later. In official competitions, a team may use up to nine substitutes.","Substitutions can be made at any time, even when the ball is in play, but not during a timeout. The player leaves the pitch through the team's own substitution zone and does not need permission from the referees. The substitute hands over the bib and enters the pitch only after the other player has left.","Any substitute can change places with the goalkeeper without telling the referees. However, if an outfield player wants to become the goalkeeper, this must happen during a stoppage, and the referees must be informed first."],"q":[{"q":"What is the minimum number of players a team needs to continue a match?","o":["Two","Three","Four"],"a":1},{"q":"When can't substitutions be made?","o":["When the ball is in play","During a timeout","In the second half"],"a":1},{"q":"What must happen if an outfield player becomes the goalkeeper?","o":["The referees must be informed during a stoppage","The coach must ask the timekeeper","Nothing special"],"a":0}]},"listening":{"title":"A busy week at work","theme":"life","lines":[["Anna","Hi Tom, have you got a minute?"],["Tom","Honestly, not really. I'm swamped this week. The deadline for the project is Friday."],["Anna","Oh no. Is there anything I can do to help?"],["Tom","Actually, yes. Could you check the figures in the report? I haven't had time."],["Anna","Sure, no problem. I'll do it this afternoon."],["Tom","Thanks a lot. After Friday I'm taking a day off. I really need to catch up on sleep."],["Anna","Good idea. You've been working too hard."]],"q":[{"q":"Why is Tom so busy?","o":["He is moving house","He has a project deadline on Friday","He is ill"],"a":1},{"q":"What will Anna do?","o":["Check the figures in the report","Write the report","Call the client"],"a":0},{"q":"What will Tom do after Friday?","o":["Start a new project","Take a day off","Go on a business trip"],"a":1}]}},{"title":"Match officials · Покупки","futsal":[{"en":"second referee","ru":"второй судья","ex":"The second referee works on the opposite touchline."},{"en":"third referee","ru":"третий судья","ex":"The third referee records the accumulated fouls."},{"en":"timekeeper","ru":"хронометрист","ex":"The timekeeper stops the clock when the ball is out of play."},{"en":"chronometer","ru":"хронометр (табло времени)","ex":"The chronometer shows the playing time."},{"en":"final decision","ru":"окончательное решение","ex":"The referee always makes the final decision."}],"life":[{"en":"receipt","ru":"чек","ex":"Keep the receipt in case you want to return it."},{"en":"to be on sale","ru":"продаваться со скидкой","ex":"These trainers are on sale — 30% off!"},{"en":"refund","ru":"возврат денег","ex":"Can I get a refund if it doesn't fit?"},{"en":"Can I try it on?","ru":"Можно примерить?","ex":"I like this jacket. Can I try it on?"},{"en":"It's a bargain","ru":"Это выгодная покупка / очень дёшево","ex":"Only ten euros? It's a bargain!"}],"grammar":{"title":"Passive voice (Present Simple)","explain":"<p><b>Пассив</b> = <b>am/is/are + V3</b>. Используется, когда важно действие, а не кто его выполняет. В правилах игры пассив — повсюду!</p>\n<p class=\"ex\">A penalty kick <b>is awarded</b>. The player <b>is cautioned</b>. The ball <b>is dropped</b>.</p>\n<p>Сравните: <i>The referees <b>caution</b> the player</i> (актив) → <i>The player <b>is cautioned</b></i> (пассив).</p>\n<p>Если нужно назвать исполнителя — <b>by</b>: <i>The time is controlled <b>by</b> the timekeeper.</i></p>","ex":[{"q":"A direct free kick ___ if a player trips an opponent.","o":["awards","is awarded","is award"],"a":1,"why":"is + V3 (awarded)."},{"q":"Accumulated fouls ___ by the third referee.","o":["are recorded","is recorded","records"],"a":0,"why":"fouls — множественное число → are + V3."},{"q":"The match ___ by two referees on the pitch.","o":["controls","is controlling","is controlled"],"a":2,"why":"Пассив: is controlled by."},{"q":"These shoes ___ in Italy.","o":["are made","make","are make"],"a":0,"why":"are + V3 (make–made–made)."},{"q":"A player who commits a reckless foul ___.","o":["cautions","is cautioned","is caution"],"a":1,"why":"Игрока предупреждают → is cautioned."}]},"reading":{"title":"Laws 5 & 6 — The Match Officials","text":["A futsal match is controlled by two referees on the pitch: the referee and the second referee. They usually move along opposite touchlines, so the play is always between them.","The referee has the final decision. If the two referees signal different decisions at the same time, the referee's decision is the one that counts.","Competitions can also appoint other match officials: a third referee, a timekeeper and sometimes a fourth referee. They sit at a table next to the pitch, near the substitution zones.","The timekeeper controls the playing time. The chronometer is stopped every time the ball goes out of play and started again at the restart. The third referee helps with substitutions, records accumulated fouls and watches the behaviour of the team officials in the technical areas."],"q":[{"q":"Who makes the final decision?","o":["The second referee","The referee","The timekeeper"],"a":1},{"q":"When is the chronometer stopped?","o":["Only at half-time","When the ball goes out of play","Only after goals"],"a":1},{"q":"Which of these is a job of the third referee?","o":["Recording accumulated fouls","Taking kick-ins","Choosing the ball"],"a":0}]},"listening":{"title":"At a sports shop","theme":"life","lines":[["Assistant","Hi there! Can I help you?"],["Customer","Yes, I'm looking for indoor shoes for futsal."],["Assistant","These ones are very popular, and they're on sale this week — twenty percent off."],["Customer","They look nice. Can I try them on? I'm a size thirty-eight."],["Assistant","Of course. Here you are."],["Customer","They fit perfectly. And if they're uncomfortable after a game, can I get a refund?"],["Assistant","Yes, within fourteen days, if you keep the receipt and the shoes are clean."],["Customer","Great, I'll take them. Forty-five euros — it's a bargain!"]],"q":[{"q":"What discount is there this week?","o":["10%","20%","30%"],"a":1},{"q":"What size is the customer?","o":["36","38","40"],"a":1},{"q":"What does the customer need to get a refund?","o":["The receipt and clean shoes","A bank card","The box only"],"a":0}]}},{"title":"Time & timeouts · В кафе","futsal":[{"en":"period","ru":"тайм (период игры)","ex":"The match lasts for two equal periods of 20 minutes."},{"en":"timeout","ru":"тайм-аут","ex":"Each team is entitled to a one-minute timeout in each period."},{"en":"half-time interval","ru":"перерыв между таймами","ex":"The half-time interval must not exceed 15 minutes."},{"en":"extra time","ru":"дополнительное время","ex":"Extra time consists of two periods of five minutes."},{"en":"acoustic signal","ru":"звуковой сигнал (сирена)","ex":"The period ends when the acoustic signal sounds."}],"life":[{"en":"Could I get ...?","ru":"Можно мне ...? (заказ)","ex":"Could I get a cappuccino, please?"},{"en":"takeaway","ru":"навынос","ex":"Is that to eat in or takeaway?"},{"en":"the bill","ru":"счёт (в ресторане; в США — check)","ex":"Could we have the bill, please?"},{"en":"to be starving","ru":"умирать от голода, очень хотеть есть","ex":"Let's eat now — I'm starving!"},{"en":"leftovers","ru":"остатки еды","ex":"We had the pizza leftovers for lunch."}],"grammar":{"title":"Conditionals 0 & 1 (If ...)","explain":"<p><b>Zero conditional</b> — всегда верно, правила, законы: <b>If + Present, Present</b>.</p>\n<p class=\"ex\">If the ball <b>hits</b> the ceiling, play <b>restarts</b> with a kick-in.</p>\n<p><b>First conditional</b> — реальная ситуация в будущем: <b>If + Present, will + V</b>.</p>\n<p class=\"ex\">If you <b>argue</b> with the referee, he <b>will show</b> you a yellow card.</p>\n<p>⚠️ После <b>if</b> не ставим will: <s>If it will rain</s> → If it <b>rains</b>, we <b>will</b> stay at home.</p>\n<p><b>unless</b> = if ... not: <i>Unless you hurry, you'll miss the bus.</i></p>","ex":[{"q":"If a team ___ a goal, the other team takes the kick-off.","o":["scores","will score","scored"],"a":0,"why":"Правило → zero conditional, Present в обеих частях."},{"q":"If I finish work early, I ___ you at the café.","o":["meet","will meet","met"],"a":1,"why":"Реальное будущее → will в главной части."},{"q":"If it ___ tomorrow, the match will be indoors anyway.","o":["will rain","rains","rained"],"a":1,"why":"После if — Present Simple, не will."},{"q":"___ the kick-in is taken within four seconds, the ball goes to the opponents.","o":["If","Unless","When"],"a":1,"why":"Unless = if not: если НЕ выполнен за 4 секунды."},{"q":"The period ends when the acoustic signal ___.","o":["sounds","will sound","sounded"],"a":0,"why":"После when (во временных придаточных) — Present."}]},"reading":{"title":"Law 7 — Duration of the Match","text":["A futsal match has two equal periods of 20 minutes. This is playing time, not real time: the timekeeper stops the chronometer whenever the ball is out of play. That's why a futsal match usually takes much longer than 40 minutes.","Each period ends when the timekeeper's acoustic signal sounds, even if the referees do not blow their whistle. There is one exception: if a penalty kick or a free kick for the sixth accumulated foul is awarded just before the end, the period continues until the kick is completed.","Each team can ask for a one-minute timeout in each period. A team official asks the third referee or the timekeeper, and the timeout is given when that team has the ball and the ball is out of play. A team that doesn't use its timeout in the first period still has only one in the second. There are no timeouts in extra time.","The half-time interval must not be longer than 15 minutes."],"q":[{"q":"Why is a futsal match longer than 40 minutes in real time?","o":["Because of extra time","Because the clock stops when the ball is out of play","Because of long timeouts"],"a":1},{"q":"If a team doesn't use its timeout in the first period, how many can it have in the second?","o":["Two","One","None"],"a":1},{"q":"When is a timeout given?","o":["At any moment","When the requesting team has the ball and it's out of play","Only after a goal"],"a":1}]},"listening":{"title":"Timeout request","theme":"futsal","lines":[["Coach","Excuse me! We'd like a timeout, please."],["Third referee","OK, but I can only give it when your team has the ball and the ball is out of play."],["Coach","Yes, I know. Our goalkeeper has the ball now — he's going to take a goal clearance."],["Third referee","Right. Timekeeper, timeout for the blue team!"],["Timekeeper","Signal given. One minute starts now."],["Third referee","Coach, remember: you can't give instructions on the pitch, and no substitutions until the timeout ends."],["Coach","Understood. Thanks."]],"q":[{"q":"Why can the timeout be given now?","o":["The blue team has scored","The blue team's goalkeeper is taking a goal clearance","The half is over"],"a":1},{"q":"How long is the timeout?","o":["30 seconds","One minute","Two minutes"],"a":1},{"q":"What is the coach NOT allowed to do?","o":["Talk to players off the pitch","Give instructions on the pitch","Sit on the bench"],"a":1}]}},{"title":"Start & restart · Путешествия","futsal":[{"en":"kick-off","ru":"начальный удар (с центра)","ex":"After a goal, the kick-off is taken by the other team."},{"en":"centre mark","ru":"центральная отметка","ex":"The ball must be stationary on the centre mark."},{"en":"toss a coin","ru":"подбросить монету (жеребьёвка)","ex":"The referee tosses a coin before the match."},{"en":"dropped ball","ru":"спорный мяч","ex":"Play restarts with a dropped ball after an injury."},{"en":"restart (of play)","ru":"возобновление игры","ex":"A kick-in is one of the restarts of play."}],"life":[{"en":"boarding pass","ru":"посадочный талон","ex":"Please show your boarding pass and passport."},{"en":"to check in","ru":"зарегистрироваться (в аэропорту, отеле)","ex":"We need to check in two hours before the flight."},{"en":"delay","ru":"задержка / задерживать","ex":"There's a two-hour delay because of the weather."},{"en":"round trip","ru":"поездка туда и обратно","ex":"A round trip ticket to London costs 150 euros."},{"en":"to miss the flight","ru":"опоздать на рейс","ex":"Hurry up, or we'll miss the flight!"}],"grammar":{"title":"Past Continuous vs Past Simple","explain":"<p><b>Past Continuous</b> (was/were + -ing) — процесс в прошлом, «фон».</p>\n<p><b>Past Simple</b> — короткое событие, которое произошло на фоне или прервало процесс.</p>\n<p class=\"ex\">The striker <b>was running</b> towards the goal <b>when</b> the defender <b>tripped</b> him.</p>\n<p class=\"ex\"><b>While</b> I <b>was waiting</b> at the airport, I <b>met</b> an old friend.</p>\n<p><b>when</b> + короткое действие; <b>while</b> + длительный процесс.</p>","ex":[{"q":"The goalkeeper ___ the ball when the opponent kicked it.","o":["was releasing","released","releases"],"a":0,"why":"Процесс прерван другим действием → Past Continuous."},{"q":"While we ___ for the bus, it started to rain.","o":["waited","were waiting","are waiting"],"a":1,"why":"while + длительный процесс → were waiting."},{"q":"I ___ my phone while I was running to the gate.","o":["was dropping","dropped","drop"],"a":1,"why":"Короткое событие → Past Simple."},{"q":"What ___ you doing at 8 pm yesterday?","o":["were","did","was"],"a":0,"why":"Процесс в конкретный момент → were you doing."},{"q":"The players ___ when the referee blew the whistle.","o":["were arguing","argue","have argued"],"a":0,"why":"Фон в прошлом → Past Continuous."}]},"reading":{"title":"Law 8 — Start and Restart of Play","text":["Before the match, the referee tosses a coin. The team that wins the toss decides whether to take the kick-off in the first or the second period. In the second period the teams change ends.","At the kick-off, the ball must be stationary on the centre mark, and all players must be in their own half. The opponents must be at least 3 metres from the ball. The ball is in play when it is kicked and clearly moves. A goal can be scored directly from the kick-off against the opponents.","Sometimes the referees stop play without any offence — for example, because a player is injured. Then play restarts with a dropped ball. The ball is dropped for one player of the team that had the ball, or would have got it. All other players must be at least 2 metres away. The ball is in play when it touches the floor."],"q":[{"q":"How far must the opponents be at the kick-off?","o":["2 m","3 m","5 m"],"a":1},{"q":"When is a dropped ball used?","o":["After a foul","When play is stopped without an offence","After a goal"],"a":1},{"q":"When is a dropped ball in play?","o":["When it touches the floor","When a player kicks it","When the referee whistles"],"a":0}]},"listening":{"title":"At the airport","theme":"life","lines":[["Agent","Good morning. Where are you flying today?"],["Passenger","To Barcelona. I'm going to referee at a futsal tournament there."],["Agent","Lovely. Can I see your passport, please? Is it a round trip?"],["Passenger","Yes, I'm coming back on Sunday."],["Agent","Here's your boarding pass. I'm afraid there's a forty-minute delay today."],["Passenger","Oh, that's OK. I was worried I'd miss the flight — the traffic was terrible."],["Agent","Don't worry, you have plenty of time. Boarding starts at gate twelve at ten fifteen."]],"q":[{"q":"Why is the passenger going to Barcelona?","o":["On holiday","To referee at a tournament","For a business meeting"],"a":1},{"q":"How long is the delay?","o":["15 minutes","40 minutes","Two hours"],"a":1},{"q":"Which gate is it?","o":["Gate 10","Gate 12","Gate 15"],"a":1}]}},{"title":"Ball in & out · Здоровье","futsal":[{"en":"out of play","ru":"мяч вне игры (не в игре)","ex":"The ball is out of play when it hits the ceiling."},{"en":"wholly passed over","ru":"полностью пересёк (линию)","ex":"The ball is out only when it has wholly passed over the touchline."},{"en":"kick-in","ru":"удар с боковой линии (ввод мяча ногой)","ex":"A kick-in is awarded to the opponents of the player who last touched the ball."},{"en":"ceiling","ru":"потолок","ex":"If the ball hits the ceiling, the opponents take a kick-in."},{"en":"rebound","ru":"отскок / отскакивать","ex":"The ball rebounded off the goalpost and stayed in play."}],"life":[{"en":"to feel under the weather","ru":"неважно себя чувствовать","ex":"I'm feeling a bit under the weather today."},{"en":"sore throat","ru":"боль в горле","ex":"I've got a sore throat and a headache."},{"en":"to get over","ru":"поправиться, оправиться от (болезни, проблемы)","ex":"It took me a week to get over the flu."},{"en":"appointment","ru":"запись (к врачу), встреча","ex":"I've made an appointment with the doctor for Monday."},{"en":"prescription","ru":"рецепт (на лекарство)","ex":"You need a prescription for this medicine."}],"grammar":{"title":"Future: will, be going to, Present Continuous","explain":"<p><b>will</b> — спонтанное решение, обещание, предсказание-мнение.</p>\n<p class=\"ex\">I'm thirsty. — I<b>'ll</b> get you some water. I think it <b>will</b> be a difficult match.</p>\n<p><b>be going to</b> — заранее принятое намерение или предсказание по признакам.</p>\n<p class=\"ex\">I<b>'m going to</b> study English every day. Look at those clouds — it<b>'s going to</b> rain.</p>\n<p><b>Present Continuous</b> — договорённости, планы с конкретным временем.</p>\n<p class=\"ex\">I<b>'m refereeing</b> a match on Saturday at 6 pm.</p>","ex":[{"q":"— The phone is ringing. — OK, I ___ it.","o":["'m going to answer","'ll answer","answer"],"a":1,"why":"Решение принято в момент речи → will."},{"q":"I've decided: I ___ take the referee exam next year.","o":["will","am going to","am taking to"],"a":1,"why":"Заранее принятое решение → be going to."},{"q":"I ___ the doctor at 10 tomorrow. I made an appointment.","o":["'m seeing","see","will to see"],"a":0,"why":"Договорённость с временем → Present Continuous."},{"q":"The striker is completely alone in front of the goal. He ___ score!","o":["is going to","will to","goes"],"a":0,"why":"Предсказание по очевидным признакам → going to."},{"q":"Don't worry, I promise I ___ be late.","o":["won't","am not going","don't"],"a":0,"why":"Обещание → will / won't."}]},"reading":{"title":"Law 9 — Ball In and Out of Play","text":["The ball is out of play when it has wholly passed over the touchline or the end line, on the floor or in the air. If only part of the ball is over the line, the ball is still in play. The ball is also out of play when the referees stop play, or when it hits the ceiling.","If the ball hits the ceiling, play restarts with a kick-in for the opponents of the team that last touched it. The kick-in is taken from the touchline, at the point nearest to where the ball hit the ceiling.","The ball stays in play if it rebounds off a goalpost or the crossbar and remains on the pitch. It is also normally in play when it touches a referee. But if it touches a match official and then a team starts a promising attack, the ball goes directly into the goal, or the other team gets possession, play is stopped and restarted with a dropped ball."],"q":[{"q":"Half of the ball is over the touchline. Is it out of play?","o":["Yes","No"],"a":1},{"q":"What happens if the ball hits the ceiling?","o":["A dropped ball","A kick-in for the opponents","A goal clearance"],"a":1},{"q":"The ball hits a referee and goes directly into the goal. What is the restart?","o":["Goal","Dropped ball","Kick-off"],"a":1}]},"listening":{"title":"At the doctor's","theme":"life","lines":[["Doctor","Good morning. What seems to be the problem?"],["Patient","I've been feeling under the weather for three days. I've got a sore throat and a temperature."],["Doctor","Let me have a look. Open your mouth, please... Yes, your throat is quite red."],["Patient","I have a match to referee on Saturday. Will I be OK?"],["Doctor","I'm afraid you should rest this weekend. I'll give you a prescription for some medicine."],["Patient","How long will it take to get over it?"],["Doctor","About a week. Drink lots of warm tea and make another appointment if you don't feel better."]],"q":[{"q":"How long has the patient felt ill?","o":["One day","Three days","A week"],"a":1},{"q":"What does the doctor advise about the weekend?","o":["Referee the match","Rest","Go to the gym"],"a":1},{"q":"When should the patient make another appointment?","o":["Next Monday","If they don't feel better","Never"],"a":1}]}},{"title":"Direct fouls · Чувства","futsal":[{"en":"to trip","ru":"поставить подножку","ex":"The defender tripped the attacker near the halfway line."},{"en":"to push","ru":"толкать","ex":"Pushing an opponent is a direct free kick offence."},{"en":"to charge","ru":"атаковать корпусом (плечом)","ex":"A player may fairly charge an opponent when the ball is within playing distance."},{"en":"to hold","ru":"держать, задерживать (соперника)","ex":"Holding an opponent's shirt is a foul."},{"en":"direct free kick","ru":"штрафной удар","ex":"A goal can be scored directly from a direct free kick."}],"life":[{"en":"to be fed up with","ru":"быть сытым по горло, надоесть","ex":"I'm fed up with this rainy weather."},{"en":"thrilled","ru":"в восторге","ex":"She was thrilled to get the job."},{"en":"to be nervous about","ru":"нервничать из-за","ex":"I'm nervous about my first international match."},{"en":"relieved","ru":"испытывающий облегчение","ex":"I was relieved when the exam was over."},{"en":"frustrated","ru":"раздражённый, разочарованный (от невозможности)","ex":"The players were frustrated after the defeat."}],"grammar":{"title":"Relative clauses: who, which, that, where, whose","explain":"<p>Придаточные определительные помогают описать человека, предмет или место.</p>\n<p><b>who</b> — для людей: <i>A player <b>who</b> is sent off must leave the technical area.</i></p>\n<p><b>which</b> — для предметов: <i>A foul <b>which</b> is penalised with a direct free kick counts as an accumulated foul.</i></p>\n<p><b>that</b> — для людей и предметов (в разговорной речи).</p>\n<p><b>where</b> — для мест: <i>This is the hall <b>where</b> I refereed my first match.</i></p>\n<p><b>whose</b> — чей: <i>The player <b>whose</b> number is 7 was cautioned.</i></p>","ex":[{"q":"The referee ___ controlled the final was from Spain.","o":["which","who","where"],"a":1,"why":"Человек → who."},{"q":"This is the sports hall ___ we train.","o":["which","where","who"],"a":1,"why":"Место, где что-то происходит → where."},{"q":"A kick ___ is taken from the touchline is called a kick-in.","o":["which","who","whose"],"a":0,"why":"Предмет/действие → which (или that)."},{"q":"The player ___ shirt was torn changed it at half-time.","o":["who","whose","which"],"a":1,"why":"Чья футболка → whose."},{"q":"I have a friend ___ speaks four languages.","o":["that","where","which"],"a":0,"why":"Человек → who/that."}]},"reading":{"title":"Law 12 — Direct Free Kick Offences","text":["A direct free kick is given when a player commits certain offences against an opponent in a careless or reckless way, or using excessive force. These offences are: charging, jumping at, kicking, pushing, striking, tackling and tripping an opponent — or trying to kick, strike or trip them.","A direct free kick is also given for a deliberate handball, for holding an opponent, for impeding an opponent with contact, for biting or spitting, and for throwing an object at the ball, an opponent or a match official.","If any of these offences happens inside the offender's own penalty area, a penalty kick is awarded instead.","All these offences are accumulated fouls. The third referee records them for each team in each period, and they become very important from the sixth foul."],"q":[{"q":"A defender pushes an attacker inside his own penalty area. What is the restart?","o":["Direct free kick","Penalty kick","Indirect free kick"],"a":1},{"q":"Which of these is a direct free kick offence?","o":["Holding an opponent","Dissent","Playing in a dangerous manner"],"a":0},{"q":"Who records accumulated fouls?","o":["The timekeeper","The coach","The third referee"],"a":2}]},"listening":{"title":"Explaining a decision","theme":"futsal","lines":[["Captain","Referee, why a free kick? I played the ball!"],["Referee","You touched the ball, yes, but then you tripped number nine."],["Captain","But it was an accident!"],["Referee","I know. That's why it's careless, not reckless, so there's no card. But it's still a foul."],["Captain","OK... And how many fouls do we have now?"],["Referee","That was your fourth accumulated foul. Be careful — from the sixth one it's a free kick without a wall."],["Captain","Got it. I'll tell my players. Thanks."]],"q":[{"q":"What did the captain do?","o":["Pushed number nine","Tripped number nine","Held number nine"],"a":1},{"q":"Why is there no card?","o":["Because the foul was careless","Because it was the first foul","Because the captain apologised"],"a":0},{"q":"How many accumulated fouls does the team have now?","o":["Three","Four","Six"],"a":1}]}},{"title":"Careless, reckless · Мнения","futsal":[{"en":"careless","ru":"неосторожный (без санкции)","ex":"A careless tackle is a foul, but no card is needed."},{"en":"reckless","ru":"безрассудный (жёлтая карточка)","ex":"A reckless challenge must be cautioned."},{"en":"excessive force","ru":"чрезмерная сила (красная карточка)","ex":"Using excessive force is a sending-off offence."},{"en":"to endanger the safety","ru":"угрожать безопасности","ex":"The tackle endangered the safety of the opponent."},{"en":"challenge","ru":"единоборство, попытка отбора мяча","ex":"It was a fair challenge for the ball."}],"life":[{"en":"In my opinion, ...","ru":"По моему мнению, ...","ex":"In my opinion, futsal is more exciting than football."},{"en":"I see your point, but ...","ru":"Я понимаю твою мысль, но ...","ex":"I see your point, but I still think it was a penalty."},{"en":"to agree with","ru":"соглашаться с","ex":"I totally agree with you."},{"en":"It depends","ru":"Зависит от обстоятельств","ex":"— Is it a yellow card? — It depends on the situation."},{"en":"to be against","ru":"быть против","ex":"Many coaches are against this new rule."}],"grammar":{"title":"Comparatives and superlatives","explain":"<p><b>Короткие прилагательные</b>: -er / the -est: <i>fast → faster → the fastest</i>.</p>\n<p><b>Длинные</b>: more / the most: <i>dangerous → more dangerous → the most dangerous</i>.</p>\n<p><b>Исключения</b>: good → better → the best; bad → worse → the worst; far → further → the furthest.</p>\n<p class=\"ex\">A reckless tackle is <b>more serious than</b> a careless one. Excessive force is <b>the most serious</b>.</p>\n<p><b>as ... as</b> — такой же как: <i>Futsal is not <b>as</b> big <b>as</b> football.</i></p>","ex":[{"q":"A futsal pitch is ___ than a football pitch.","o":["smaller","more small","smallest"],"a":0,"why":"small — короткое → smaller."},{"q":"Serious foul play is ___ offence in this list.","o":["the most serious","the seriousest","more serious"],"a":0,"why":"Длинное прилагательное → the most serious."},{"q":"My English is ___ than last year.","o":["more good","better","best"],"a":1,"why":"good → better (исключение)."},{"q":"This match was ___ match of the season.","o":["the worst","the baddest","worse"],"a":0,"why":"bad → worse → the worst."},{"q":"The second half was not as exciting ___ the first.","o":["than","as","like"],"a":1,"why":"Конструкция as ... as."}]},"reading":{"title":"Careless, reckless, excessive force","text":["When a player commits a foul, the referees must decide how serious it is. The Laws use three levels.","Careless means the player didn't pay enough attention or wasn't careful when challenging an opponent. It's a foul, but no disciplinary sanction is needed.","Reckless means the player ignored the danger to the opponent or the possible consequences. A player who commits a reckless foul must be cautioned and shown a yellow card.","Using excessive force means the player used much more force than necessary and endangered the safety of the opponent. This player must be sent off with a red card.","So, the same type of foul — for example, a tackle — can lead to no card, a yellow card or a red card. It depends on how it was done."],"q":[{"q":"What sanction is given for a careless foul?","o":["No card","Yellow card","Red card"],"a":0},{"q":"A player ignores the danger to the opponent. What is this?","o":["Careless","Reckless","Excessive force"],"a":1},{"q":"What is the main idea of the text?","o":["All tackles are red cards","The sanction depends on how the foul was done","Careless fouls are not fouls"],"a":1}]},"listening":{"title":"Talking about a match","theme":"life","lines":[["Leo","Did you watch the final yesterday? In my opinion, the second red card was wrong."],["Mia","Really? I thought it was clear. He went into the tackle with both feet."],["Leo","I see your point, but he touched the ball first."],["Mia","It doesn't matter. If you endanger the safety of an opponent, it's excessive force."],["Leo","Hmm. So you agree with the referee?"],["Mia","Completely. I think she was the best referee of the tournament."],["Leo","Well, it depends on who you support, I guess!"]],"q":[{"q":"What does Leo think about the red card?","o":["It was correct","It was wrong","He didn't see it"],"a":1},{"q":"What is Mia's main argument?","o":["The player touched the ball","The tackle endangered the opponent","The player argued with the referee"],"a":1},{"q":"What does Mia think about the referee?","o":["She made many mistakes","She was the best of the tournament","She was too strict"],"a":1}]}},{"title":"Cards · Телефон и сообщения","futsal":[{"en":"caution","ru":"предупреждение (жёлтая карточка) / предупредить","ex":"The player was cautioned for unsporting behaviour."},{"en":"sending-off","ru":"удаление (красная карточка)","ex":"A second caution in the same match leads to a sending-off."},{"en":"to be sent off","ru":"быть удалённым","ex":"He was sent off for violent conduct."},{"en":"dissent","ru":"несогласие с решением (протест)","ex":"Dissent by word or action is punished with a yellow card."},{"en":"unsporting behaviour","ru":"неспортивное поведение","ex":"Removing the shirt after a goal is unsporting behaviour."}],"life":[{"en":"to text","ru":"написать сообщение","ex":"Text me when you get home."},{"en":"to call back","ru":"перезвонить","ex":"I'm busy now. Can I call you back later?"},{"en":"to hang up","ru":"повесить трубку","ex":"Please don't hang up, I need to tell you something."},{"en":"Can you hear me?","ru":"Ты меня слышишь?","ex":"The connection is bad. Can you hear me?"},{"en":"to drop someone a line","ru":"черкнуть пару строк, написать","ex":"Drop me a line when you arrive in Madrid."}],"grammar":{"title":"Gerund vs infinitive","explain":"<p>После одних глаголов идёт <b>-ing</b>, после других — <b>to + V</b>.</p>\n<p><b>-ing</b>: enjoy, avoid, finish, mind, keep, stop, suggest, practise.</p>\n<p class=\"ex\">Avoid <b>arguing</b> with the referee. I enjoy <b>watching</b> futsal.</p>\n<p><b>to + V</b>: want, decide, plan, hope, try, refuse, agree, need.</p>\n<p class=\"ex\">The player refused <b>to leave</b> the pitch. I want <b>to improve</b> my English.</p>\n<p>⚠️ <b>stop + -ing</b> = перестать: <i>Stop talking!</i> / <b>stop + to</b> = остановиться, чтобы: <i>He stopped <b>to tie</b> his shoes.</i></p>\n<p>После предлогов — всегда -ing: <i>cautioned <b>for delaying</b> the restart</i>.</p>","ex":[{"q":"The defender kept ___ the referee's decision.","o":["to question","questioning","question"],"a":1,"why":"keep + -ing."},{"q":"The coach decided ___ a timeout.","o":["to request","requesting","request"],"a":0,"why":"decide + to + V."},{"q":"He was cautioned for ___ the restart.","o":["to delay","delaying","delay"],"a":1,"why":"После предлога for → -ing."},{"q":"Please stop ___ — I'm trying to concentrate.","o":["to talk","talking","talk"],"a":1,"why":"stop + -ing = перестать что-то делать."},{"q":"I hope ___ an international referee one day.","o":["becoming","to become","become"],"a":1,"why":"hope + to + V."}]},"reading":{"title":"Cautions — the yellow card","text":["A yellow card shows a caution, and a red card shows a sending-off. Only players, substitutes and team officials can receive cards.","A player is cautioned for: delaying the restart of play; dissent by word or action; entering or leaving the pitch without permission or in the wrong way during a substitution; not respecting the required distance at a restart; persistent offences; and unsporting behaviour.","Unsporting behaviour includes many situations. For example, trying to deceive the referees by pretending to be fouled — this is called simulation. A player is also cautioned for a reckless foul, for stopping a promising attack with a foul, or for removing the shirt to celebrate a goal.","Two cautions in the same match mean a sending-off."],"q":[{"q":"What is 'simulation'?","o":["Pretending to be fouled","Delaying a restart","Leaving the pitch without permission"],"a":0},{"q":"Which of these leads to a caution?","o":["Removing the shirt after a goal","A careless trip","A goal clearance"],"a":0},{"q":"What happens after two cautions in one match?","o":["Nothing","A two-minute break","A sending-off"],"a":2}]},"listening":{"title":"A bad phone line","theme":"life","lines":[["Sara","Hi Dan! Can you hear me?"],["Dan","Sorry, you're breaking up. I'm on the train."],["Sara","I just wanted to ask about tonight. Are we still meeting at seven?"],["Dan","Seven? I think so... Listen, the connection is really bad. Can I call you back in ten minutes?"],["Sara","Sure. Or just text me, that's easier."],["Dan","OK, I'll text you when I get off the train. Don't worry, I won't forget."],["Sara","Great. Bye!"]],"q":[{"q":"Where is Dan?","o":["At home","On the train","At work"],"a":1},{"q":"What time are they meeting?","o":["At six","At seven","At ten"],"a":1},{"q":"What will Dan do?","o":["Text Sara","Visit Sara","Cancel the meeting"],"a":0}]}},{"title":"Red cards · Деньги","futsal":[{"en":"serious foul play","ru":"грубая игра (серьёзное нарушение)","ex":"A tackle with excessive force is serious foul play."},{"en":"violent conduct","ru":"агрессивное поведение","ex":"Hitting an opponent off the ball is violent conduct."},{"en":"simulation","ru":"симуляция","ex":"He fell without contact — that's simulation."},{"en":"persistent offences","ru":"систематические нарушения","ex":"The player was cautioned for persistent offences."},{"en":"offensive, insulting or abusive language","ru":"оскорбительные выражения","ex":"Using abusive language is punished with a red card."}],"life":[{"en":"to save up (for)","ru":"копить (на)","ex":"I'm saving up for a new laptop."},{"en":"to afford","ru":"позволить себе (по деньгам)","ex":"I can't afford a holiday this year."},{"en":"budget","ru":"бюджет","ex":"We're on a tight budget this month."},{"en":"to owe","ru":"быть должным","ex":"You owe me ten euros for the tickets."},{"en":"to split the bill","ru":"разделить счёт","ex":"Shall we split the bill?"}],"grammar":{"title":"Second conditional (If I were ...)","explain":"<p><b>Second conditional</b> — нереальная или маловероятная ситуация в настоящем/будущем: <b>If + Past Simple, would + V</b>.</p>\n<p class=\"ex\">If I <b>had</b> more time, I <b>would study</b> English for two hours a day.</p>\n<p class=\"ex\">If I <b>were</b> the referee, I <b>would show</b> a red card.</p>\n<p>С <b>I/he/she/it</b> в этой конструкции правильно <b>were</b> (was — разговорный вариант).</p>\n<p>Сравните: <i>If it <b>rains</b>, I'<b>ll</b> stay home</i> (реально) / <i>If I <b>won</b> the lottery, I'<b>d</b> travel the world</i> (маловероятно).</p>","ex":[{"q":"If I ___ rich, I would buy a house by the sea.","o":["am","were","will be"],"a":1,"why":"Нереальное настоящее → If I were."},{"q":"If you were the referee, what ___ you do?","o":["will","would","do"],"a":1,"why":"Главная часть → would."},{"q":"I ___ more if I didn't have so much work.","o":["would travel","will travel","travelled"],"a":0,"why":"would + V."},{"q":"If he ___ the rules better, he wouldn't argue so much.","o":["knows","knew","would know"],"a":1,"why":"После if — Past Simple."},{"q":"If it rains tomorrow, we ___ the match indoors. (реальная ситуация)","o":["would play","will play","played"],"a":1,"why":"Реальная ситуация → First conditional (will)."}]},"reading":{"title":"Sending-off offences","text":["A player or substitute is sent off for: serious foul play; violent conduct; biting or spitting at someone; using offensive, insulting or abusive language or gestures; receiving a second caution in the same match; and some situations of denying a goal or an obvious goalscoring opportunity.","Serious foul play is a tackle or challenge for the ball that endangers the safety of an opponent or uses excessive force or brutality.","Violent conduct is different: it is not a challenge for the ball. For example, a player strikes an opponent when the ball is far away, or deliberately hits someone on the head or face.","A player who is sent off must leave the area around the pitch and the technical area. In futsal, the team then plays with one player fewer for two minutes."],"q":[{"q":"What is the difference between serious foul play and violent conduct?","o":["Violent conduct is not a challenge for the ball","Serious foul play is only verbal","There is no difference"],"a":0},{"q":"Which of these is a sending-off offence?","o":["Dissent","A second caution","Delaying the restart"],"a":1},{"q":"Where must a sent-off player go?","o":["To the bench","Away from the pitch and technical area","To the timekeeper's table"],"a":1}]},"listening":{"title":"Red card report","theme":"futsal","lines":[["Referee","Let's write the report for the red card in the second half."],["Second referee","OK. It was number eleven from the white team, at minute thirty-four."],["Referee","Right. The ball was on the other side of the pitch, so it wasn't a challenge for the ball."],["Second referee","Exactly. He hit the opponent in the face with his elbow. I saw it clearly."],["Referee","So the offence is violent conduct, not serious foul play."],["Second referee","Yes. And after the card, he used abusive language towards you, didn't he?"],["Referee","He did. We need to mention that too. The disciplinary committee will decide the punishment."]],"q":[{"q":"Why isn't it serious foul play?","o":["Because it wasn't a challenge for the ball","Because nobody was hurt","Because it was in the first half"],"a":0},{"q":"What did the player do?","o":["Pushed the opponent","Hit the opponent with his elbow","Tripped the opponent"],"a":1},{"q":"Who will decide the final punishment?","o":["The referee","The coach","The disciplinary committee"],"a":2}]}},{"title":"Accumulated fouls · Погода","futsal":[{"en":"accumulated foul","ru":"накопленный (командный) фол","ex":"Every direct free kick offence counts as an accumulated foul."},{"en":"DFKSAF","ru":"штрафной за 6-й и последующие фолы (direct free kick from the sixth accumulated foul)","ex":"The DFKSAF can be taken from the 10 m mark."},{"en":"wall","ru":"стенка","ex":"Defenders can't form a wall at a DFKSAF."},{"en":"advantage","ru":"преимущество (продолжение игры после нарушения)","ex":"The referee played advantage because the attack continued."},{"en":"to apply the advantage","ru":"применить преимущество","ex":"The referees can't apply the advantage after the fifth accumulated foul (unless there is a clear goalscoring chance)."}],"life":[{"en":"chilly","ru":"прохладно, зябко","ex":"It's a bit chilly — take a jacket."},{"en":"pouring (rain)","ru":"ливень, льёт как из ведра","ex":"It's pouring outside!"},{"en":"forecast","ru":"прогноз (погоды)","ex":"The forecast says it will be sunny tomorrow."},{"en":"It's freezing","ru":"Очень холодно, мороз","ex":"Close the window, it's freezing!"},{"en":"humid","ru":"влажный (о воздухе)","ex":"It's hot and humid in summer here."}],"grammar":{"title":"Countable & uncountable: much, many, a few, a little","explain":"<p><b>Исчисляемые</b> (можно посчитать): a foul, two fouls; a player, players.</p>\n<p><b>Неисчисляемые</b>: time, information, advice, equipment, money, water, weather.</p>\n<p><b>many / a few / few</b> — с исчисляемыми: <i>How <b>many</b> fouls? <b>A few</b> players.</i></p>\n<p><b>much / a little / little</b> — с неисчисляемыми: <i>How <b>much</b> time is left? <b>A little</b> water.</i></p>\n<p><b>a lot of</b> — с обоими. <b>a few / a little</b> = немного (достаточно), <b>few / little</b> = мало (недостаточно).</p>\n<p>⚠️ <i>information, advice, equipment</i> — неисчисляемые: <s>an advice</s> → <b>a piece of advice</b>.</p>","ex":[{"q":"How ___ accumulated fouls does the blue team have?","o":["much","many","little"],"a":1,"why":"fouls — исчисляемое → many."},{"q":"How ___ time is left in the first period?","o":["much","many","few"],"a":0,"why":"time — неисчисляемое → much."},{"q":"Can I give you ___?","o":["an advice","a piece of advice","advices"],"a":1,"why":"advice неисчисляемое → a piece of advice."},{"q":"I have ___ friends in London, so I'm not alone there.","o":["a few","a little","much"],"a":0,"why":"friends — исчисляемое, «несколько» → a few."},{"q":"Players must check their ___ before the match.","o":["equipments","equipment","an equipment"],"a":1,"why":"equipment — неисчисляемое, без -s."}]},"reading":{"title":"Law 13 — Accumulated Fouls","text":["Accumulated fouls are all offences that are punished with a direct free kick. Each team's fouls are counted separately in each period, starting from zero. If there is extra time, the fouls from the second period continue to count.","For the first five accumulated fouls, the opponents can form a wall at the free kick. But from the sixth foul in a period, every foul is punished with a special direct free kick — a DFKSAF. Defenders cannot form a wall. Only the goalkeeper defends, and the kicker must try to score directly.","The DFKSAF is taken from the 10 m mark. If the foul happened closer to the goal than 10 m (but outside the penalty area), the team can choose to take it from the place of the foul instead. If the sixth foul happens inside the penalty area, it's a penalty kick.","The referees can play advantage for an accumulated foul only if the team has committed fewer than five fouls before — unless there is a clear goalscoring opportunity."],"q":[{"q":"From which foul is there no wall?","o":["The fifth","The sixth","The tenth"],"a":1},{"q":"Where is the DFKSAF normally taken from?","o":["The penalty mark","The 10 m mark","The halfway line"],"a":1},{"q":"The team's sixth foul happens inside its penalty area. What is given?","o":["DFKSAF","Penalty kick","Indirect free kick"],"a":1}]},"listening":{"title":"Weekend weather","theme":"life","lines":[["Jess","Have you seen the forecast for the weekend?"],["Rob","Yes, it's not great. It's going to be chilly on Saturday, and on Sunday it's pouring all day."],["Jess","Oh no. We wanted to go hiking on Sunday."],["Rob","Maybe do it on Saturday? Just take a warm jacket. It'll be about eight degrees."],["Jess","I can't — I'm refereeing a youth tournament on Saturday. Luckily, it's indoors!"],["Rob","Then let's go next weekend. It's supposed to be warmer."],["Jess","Good idea."]],"q":[{"q":"What will the weather be like on Sunday?","o":["Sunny","Very rainy","Freezing"],"a":1},{"q":"Why can't Jess go hiking on Saturday?","o":["She's working at a youth tournament","She's ill","It's too cold"],"a":0},{"q":"What do they decide?","o":["To go on Saturday","To go next weekend","To stay at home"],"a":1}]}},{"title":"Free kicks · Друзья","futsal":[{"en":"indirect free kick","ru":"свободный удар","ex":"A goal can't be scored directly from an indirect free kick."},{"en":"four-second count","ru":"отсчёт четырёх секунд","ex":"The referee shows the four-second count with his fingers."},{"en":"quick free kick","ru":"быстро разыгранный штрафной","ex":"The team took a quick free kick before the defenders were ready."},{"en":"stationary","ru":"неподвижный","ex":"The ball must be stationary when the free kick is taken."},{"en":"to retake","ru":"перебить, повторить удар","ex":"The free kick must be retaken."}],"life":[{"en":"to hang out (with)","ru":"проводить время, тусоваться","ex":"We usually hang out at the park after school."},{"en":"to catch up (with someone)","ru":"пообщаться, узнать новости (после перерыва)","ex":"Let's meet for lunch and catch up!"},{"en":"to make plans","ru":"строить планы","ex":"Have you made any plans for the weekend?"},{"en":"to cancel plans","ru":"отменить планы","ex":"Sorry, I have to cancel our plans — I'm sick."},{"en":"to get along with","ru":"ладить с","ex":"I get along really well with my colleagues."}],"grammar":{"title":"Articles: a / an / the / —","explain":"<p><b>a / an</b> — один из многих, впервые упоминается: <i>The referee awarded <b>a</b> free kick.</i> (an — перед гласным звуком: <b>an</b> indirect free kick, <b>an</b> hour).</p>\n<p><b>the</b> — конкретный, уже известный или единственный: <i><b>The</b> free kick was taken quickly. <b>The</b> referee, <b>the</b> ball, <b>the</b> halfway line.</i></p>\n<p><b>без артикля</b> — общие понятия, неисчисляемые и множественное число в общем смысле, названия видов спорта: <i>I love <b>futsal</b>. <b>Referees</b> must be fit.</i></p>\n<p>Устойчивые: <i>at home, at work, go to bed, in the morning, play futsal</i>.</p>","ex":[{"q":"The referees awarded ___ indirect free kick.","o":["a","an","—"],"a":1,"why":"Перед гласным звуком (indirect) → an."},{"q":"___ ball must be stationary on the centre mark.","o":["A","The","—"],"a":1,"why":"Конкретный мяч матча → the."},{"q":"I play ___ futsal twice a week.","o":["the","a","—"],"a":2,"why":"Виды спорта — без артикля."},{"q":"She's ___ referee. She works in ___ national league.","o":["a / the","the / a","— / the"],"a":0,"why":"Профессия → a; конкретная лига → the."},{"q":"I'll be there in ___ hour.","o":["a","an","the"],"a":1,"why":"hour начинается с гласного звука [aʊ] → an."}]},"reading":{"title":"Law 13 — Free Kicks","text":["There are two types of free kick: direct and indirect. From a direct free kick, a goal can be scored directly against the opponents. From an indirect free kick, a goal counts only if another player touches the ball after the kick. To show an indirect free kick, the referees raise one arm above the head.","At a free kick, the ball must be stationary, and the opponents must be at least 5 metres away until the ball is in play. The ball is in play when it is kicked and clearly moves. The kicker must not touch the ball again until another player has touched it.","The free kick must be taken within four seconds. One of the referees shows the four-second count with their hand. If the kick is not taken in time, an indirect free kick is given to the other team.","An indirect free kick for the attacking team inside the penalty area is taken from the penalty area line, at the point nearest to where the offence happened."],"q":[{"q":"How do the referees show an indirect free kick?","o":["One arm raised above the head","Pointing to the penalty mark","Two whistles"],"a":0},{"q":"How far must the opponents be at a free kick?","o":["3 m","5 m","10 m"],"a":1},{"q":"What happens if the free kick is not taken within four seconds?","o":["It is retaken","An indirect free kick to the other team","A caution"],"a":1}]},"listening":{"title":"Making plans with a friend","theme":"life","lines":[["Nina","Hey Lucy! We haven't hung out for ages. Are you free this weekend?"],["Lucy","Hi! I'd love to catch up. Saturday is busy, but Sunday afternoon is fine."],["Nina","Perfect. How about the new café near the river?"],["Lucy","Sounds great. Can I bring my sister? You two will get along really well."],["Nina","Of course! Let's meet at three."],["Lucy","Deal. And if anything changes, I'll text you — I won't cancel at the last minute this time, I promise!"],["Nina","Ha-ha, I'll believe it when I see it!"]],"q":[{"q":"When will they meet?","o":["Saturday morning","Sunday at three","Sunday morning"],"a":1},{"q":"Who will Lucy bring?","o":["Her sister","Her boyfriend","A colleague"],"a":0},{"q":"What does Nina's last line suggest?","o":["Lucy often cancels plans","Nina doesn't like cafés","Nina is angry"],"a":0}]}},{"title":"Penalty kick · Дом","futsal":[{"en":"penalty kick","ru":"пенальти (6-метровый удар)","ex":"A penalty kick is taken from the penalty mark."},{"en":"to award","ru":"назначить (удар)","ex":"The referee awarded a penalty kick."},{"en":"to back-heel","ru":"ударить пяткой","ex":"Back-heeling is permitted if the ball moves forwards."},{"en":"to face the kicker","ru":"стоять лицом к бьющему","ex":"The goalkeeper must stay on the goal line, facing the kicker."},{"en":"penalty shoot-out","ru":"серия пенальти","ex":"The match was decided by a penalty shoot-out."}],"life":[{"en":"to move in","ru":"въехать, переехать (в квартиру)","ex":"We moved in last month."},{"en":"rent","ru":"арендная плата / снимать","ex":"The rent is 600 euros a month."},{"en":"landlord","ru":"арендодатель, хозяин квартиры","ex":"I called the landlord about the broken heater."},{"en":"to tidy up","ru":"прибраться","ex":"I need to tidy up before my guests arrive."},{"en":"neighbour","ru":"сосед","ex":"Our neighbours are very friendly."}],"grammar":{"title":"Prepositions of time and place: in, on, at","explain":"<p><b>Время</b>:</p>\n<p><b>at</b> — точное время, праздники: <i>at 7 pm, at half-time, at the weekend (BrE)</i>.</p>\n<p><b>on</b> — дни и даты: <i>on Saturday, on 5 May, on my birthday</i>.</p>\n<p><b>in</b> — месяцы, годы, части дня, периоды: <i>in May, in 2026, in the morning, in the second period</i>.</p>\n<p><b>Место</b>:</p>\n<p><b>at</b> — точка: <i>at the table, at the corner arc, at home</i>. <b>on</b> — поверхность/линия: <i>on the touchline, on the pitch, on the goal line</i>. <b>in</b> — внутри: <i>in the penalty area, in the technical area</i>.</p>","ex":[{"q":"The goalkeeper must stay ___ the goal line.","o":["in","on","at"],"a":1,"why":"Линия → on."},{"q":"The offence happened ___ the penalty area.","o":["in","on","at"],"a":0,"why":"Внутри области → in."},{"q":"The match starts ___ 6:30 ___ Friday.","o":["at / on","in / at","on / in"],"a":0,"why":"Время → at; день недели → on."},{"q":"I was born ___ 1998.","o":["on","at","in"],"a":2,"why":"Год → in."},{"q":"The third referee sits ___ the timekeeper's table.","o":["at","in","on"],"a":0,"why":"Точка, место у стола → at."}]},"reading":{"title":"Law 14 — The Penalty Kick","text":["A penalty kick is awarded when a player commits a direct free kick offence inside their own penalty area. The ball is placed on the penalty mark, 6 metres from the goal.","The kicker must be clearly identified. The defending goalkeeper must stay on the goal line, between the posts, facing the kicker, until the ball is kicked. At the moment of the kick, at least part of one of the goalkeeper's feet must be touching, in line with or behind the goal line.","All other players must be on the pitch, at least 5 metres from the penalty mark, behind it and outside the penalty area.","The kicker must kick the ball forwards; back-heeling is allowed if the ball moves forwards. The kicker cannot touch the ball again until another player has touched it. If a penalty is awarded just before the end of a period, the period continues until the kick is completed."],"q":[{"q":"Where must the goalkeeper stand?","o":["On the goal line, facing the kicker","Anywhere in the penalty area","5 m from the ball"],"a":0},{"q":"Can the kicker back-heel the ball?","o":["Never","Yes, if the ball moves forwards","Only in a shoot-out"],"a":1},{"q":"Where must the other players be?","o":["Inside the penalty area","At least 5 m from the mark, behind it, outside the area","On the halfway line"],"a":1}]},"listening":{"title":"Penalty instructions","theme":"futsal","lines":[["Referee","Number seven, are you taking the penalty?"],["Player","Yes, I am."],["Referee","OK. Wait for my whistle. Goalkeeper, stay on the line until the ball is kicked, please."],["Goalkeeper","Can I move along the line?"],["Referee","Yes, you can move sideways, but don't come off the line, and don't touch the posts or the net."],["Referee","Everybody else — outside the penalty area and five metres behind the ball. Number four, move back, please!"],["Player","Ready."],["Referee","Go ahead."]],"q":[{"q":"What can the goalkeeper do?","o":["Move forward","Move sideways along the line","Hold the crossbar"],"a":1},{"q":"Why does the referee talk to number four?","o":["He is too close","He is the kicker","He is injured"],"a":0},{"q":"When can the kicker take the penalty?","o":["Immediately","After the referee's whistle","After the timekeeper's signal"],"a":1}]}},{"title":"Goalkeeper · Вежливые просьбы","futsal":[{"en":"goal clearance","ru":"ввод мяча вратарём (рукой)","ex":"The goal clearance is thrown or released by the goalkeeper."},{"en":"to release the ball","ru":"выпустить мяч из рук, ввести в игру","ex":"The goalkeeper must release the ball within four seconds."},{"en":"to be in control of the ball","ru":"контролировать мяч","ex":"The goalkeeper can't control the ball in his own half for more than four seconds."},{"en":"deliberately played (back pass)","ru":"намеренно отданный (пас назад)","ex":"The goalkeeper touched the ball again after it was deliberately played back by a team-mate."},{"en":"team-mate","ru":"партнёр по команде","ex":"He passed the ball to a team-mate."}],"life":[{"en":"Would you mind ...ing?","ru":"Не могли бы вы...? (очень вежливо)","ex":"Would you mind closing the window?"},{"en":"I was wondering if ...","ru":"Я хотела спросить, не могли бы... (вежливо)","ex":"I was wondering if you could help me."},{"en":"Sorry to bother you","ru":"Извините за беспокойство","ex":"Sorry to bother you, but where is the station?"},{"en":"No worries","ru":"Без проблем, не переживай","ex":"— Sorry I'm late! — No worries."},{"en":"Could you do me a favour?","ru":"Можешь оказать мне услугу?","ex":"Could you do me a favour and feed my cat this weekend?"}],"grammar":{"title":"Reported speech (statements and questions)","explain":"<p>Когда передаём чужие слова, время обычно «сдвигается» на шаг назад:</p>\n<p>Present → Past: <i>\"I <b>am</b> tired.\" → She said (that) she <b>was</b> tired.</i></p>\n<p>Past / Present Perfect → Past Perfect: <i>\"I <b>saw</b> the foul.\" → He said he <b>had seen</b> the foul.</i></p>\n<p>will → would; can → could: <i>\"I <b>will</b> call you.\" → He said he <b>would</b> call me.</i></p>\n<p><b>say</b> (без дополнения) vs <b>tell</b> (+ кому): <i>He <b>said</b> that... / He <b>told me</b> that...</i></p>\n<p>Вопросы — прямой порядок слов: <i>\"Where <b>is</b> the ball?\" → She asked where the ball <b>was</b>.</i></p>","ex":[{"q":"\"I am the captain.\" → He said he ___ the captain.","o":["is","was","were"],"a":1,"why":"am → was."},{"q":"\"I will check the balls.\" → She said she ___ check the balls.","o":["will","would","can"],"a":1,"why":"will → would."},{"q":"The coach ___ me that the team was ready.","o":["said","told","asked"],"a":1,"why":"tell + кому (me)."},{"q":"\"Where is the timekeeper?\" → He asked where the timekeeper ___.","o":["is","was","was is"],"a":1,"why":"Прямой порядок + сдвиг времени."},{"q":"\"I didn't touch the ball.\" → He said he ___ the ball.","o":["hadn't touched","didn't touched","doesn't touch"],"a":0,"why":"Past Simple → Past Perfect."}]},"reading":{"title":"The goalkeeper and the four seconds","text":["In futsal, the goalkeeper has special restrictions. An indirect free kick is given if the goalkeeper controls the ball with the hands, arms or feet in their own half for more than four seconds.","There is also a back-pass rule. After the goalkeeper has played the ball, they cannot touch it again in their own half if a team-mate deliberately plays it back to them, unless an opponent has touched it first. The goalkeeper also cannot touch the ball with the hands inside their penalty area after a team-mate has deliberately kicked it to them.","When the ball goes over the end line after an attacker last touched it, the restart is a goal clearance. In futsal, the goalkeeper throws or releases the ball by hand from anywhere inside the penalty area. The opponents must be outside the penalty area, and the ball must be put into play within four seconds. A goal cannot be scored directly from a goal clearance."],"q":[{"q":"How is a goal clearance taken in futsal?","o":["Kicked from the floor","Thrown or released by hand","Taken by any player"],"a":1},{"q":"What happens if the goalkeeper controls the ball in their own half for more than four seconds?","o":["Penalty kick","Indirect free kick","Corner kick"],"a":1},{"q":"Can a goal be scored directly from a goal clearance?","o":["Yes","No"],"a":1}]},"listening":{"title":"Asking a neighbour for help","theme":"life","lines":[["Anna","Hi, sorry to bother you. I'm Anna, your new neighbour from flat twelve."],["Mr Green","Oh, hello Anna! Nice to meet you. How can I help?"],["Anna","I was wondering if you could do me a favour. I'm going away for a tournament on Friday."],["Mr Green","Of course. What do you need?"],["Anna","Would you mind watering my plants while I'm away? Just twice, on Saturday and Monday."],["Mr Green","No worries, I'm happy to help. Just leave me the key."],["Anna","Thank you so much! I'll bring you something nice from Portugal."]],"q":[{"q":"Why is Anna going away?","o":["For a holiday","For a tournament","For work training"],"a":1},{"q":"What does she ask Mr Green to do?","o":["Feed her cat","Water her plants","Collect her post"],"a":1},{"q":"Where is Anna going?","o":["Spain","Portugal","Italy"],"a":1}]}},{"title":"Corners & kick-ins · Время","futsal":[{"en":"corner kick","ru":"угловой удар","ex":"A corner kick is awarded when a defender last touched the ball before it crossed the end line."},{"en":"corner area","ru":"угловой сектор","ex":"The ball must be placed in the corner area."},{"en":"attacking team","ru":"атакующая команда","ex":"The corner kick is taken by a player of the attacking team."},{"en":"defending team","ru":"обороняющаяся команда","ex":"Players of the defending team must be 5 m from the corner arc."},{"en":"to encroach","ru":"нарушить дистанцию, подойти ближе положенного","ex":"The defender encroached at the kick-in and was cautioned."}],"life":[{"en":"in a while","ru":"через некоторое время","ex":"I'll call you back in a while."},{"en":"from time to time","ru":"время от времени","ex":"I watch English films from time to time."},{"en":"on time / in time","ru":"вовремя (по расписанию) / вовремя (успеть)","ex":"The train left on time. We arrived just in time for the kick-off."},{"en":"so far","ru":"пока что, на данный момент","ex":"So far, everything is going well."},{"en":"sooner or later","ru":"рано или поздно","ex":"Sooner or later you'll understand the offside rule — oh wait, there's no offside in futsal!"}],"grammar":{"title":"Passive with modals and in the past","explain":"<p><b>Модальный + be + V3</b> — очень частая конструкция в правилах:</p>\n<p class=\"ex\">The ball <b>must be placed</b> in the corner area. A goal <b>can be scored</b> directly. The player <b>must be sent off</b>.
