<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Referee English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #f4f3ef);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #1b1d1c);
  --hint: var(--tg-theme-hint-color, #7b807d);
  --accent: #1f7a4d;
  --accent-soft: rgba(31,122,77,.12);
  --yellow: #f2b705;
  --red: #d64541;
  --line: rgba(127,127,127,.18);
  --ok: #1f9d55;
  --bad: #d64541;
  --r: 16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg: var(--tg-theme-bg-color,#121413); --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color,#1d201f)); --text: var(--tg-theme-text-color,#eceeed); --hint: var(--tg-theme-hint-color,#8d938f); --accent:#3fb37a; --accent-soft: rgba(63,179,122,.16); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px;min-height:100vh}
h1{font-size:24px;line-height:1.2;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--hint)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-align:center;margin-top:12px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.life{background:rgba(242,183,5,.18);color:#a37700}
@media (prefers-color-scheme: dark){.pill.life{color:#f2c94c}}
.hero{background:linear-gradient(135deg,#1f7a4d,#145236);color:#fff;border-radius:20px;padding:18px;margin:10px 0;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .btn{background:#fff;color:#145236}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:2px solid rgba(255,255,255,.18);border-radius:50%}
.hero:before{content:"";position:absolute;right:35px;top:-30px;width:2px;height:200px;background:rgba(255,255,255,.18)}
.stepdots{display:flex;gap:6px;margin:12px 0 4px}
.stepdots span{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}
.stepdots span.on{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--hint)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.num.done{background:var(--accent);color:#fff}
.num.lock{background:var(--line);color:var(--hint)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}
.tabs button{padding:8px 12px;border-radius:99px;background:var(--card);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button.done:not(.on){color:var(--accent)}
.word{font-size:30px;font-weight:700;line-height:1.15;margin:10px 0 4px;letter-spacing:-.01em}
.tr{font-size:18px;margin:8px 0}
.exs{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-top:14px}
.say{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.say.sm{width:32px;height:32px}
.say svg{width:20px;height:20px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.12)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,65,.10)}
.opt:disabled{color:var(--text)}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.feedback.ok{background:rgba(31,157,85,.12)}
.feedback.bad{background:rgba(214,69,65,.10)}
.q{font-size:18px;font-weight:600}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.grammar p{margin:8px 0}
.grammar .ex{background:var(--accent-soft);padding:8px 12px;border-radius:10px;font-style:italic;margin:6px 0}
.grammar .ex .t{font-style:normal;color:var(--hint);font-size:14px}
.grammar h4{font-size:16px;margin:20px 0 6px;color:var(--accent)}
.grammar ul{padding-left:20px;margin:6px 0}.grammar li{margin:6px 0}
.grammar table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;display:block;overflow-x:auto}
.grammar th,.grammar td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.grammar th{background:var(--accent-soft)}
.grammar .note{background:rgba(242,183,5,.14);border-left:3px solid var(--yellow);padding:8px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.grammar .mist{background:rgba(214,69,65,.08);border-left:3px solid var(--red);padding:8px 12px;border-radius:8px;margin:10px 0;font-size:15px;line-height:1.7}
.text p{margin:0 0 12px}
.term{border-bottom:2px dotted var(--accent);cursor:pointer}
.player{display:flex;align-items:center;gap:12px}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.bar{flex:1;height:6px;background:var(--line);border-radius:4px;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.speed{font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);min-width:46px}
.tline{padding:8px 10px;border-radius:10px;margin:2px 0;transition:background .2s}
.tline.cur{background:var(--accent-soft)}
.tline b{color:var(--accent);font-weight:600}
.pop{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1d1c;color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;max-width:90vw;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.boxdots{display:inline-flex;gap:3px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--accent)}
input.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.center{text-align:center}
.big{font-size:48px;margin:8px 0}
.dict .item{align-items:flex-start}
.ycard{display:inline-block;width:12px;height:16px;border-radius:2px;background:var(--yellow);vertical-align:-2px;margin-right:6px;transform:rotate(-8deg)}
</style>
</head>

<div id="app"></div>

<script>
const LESSONS = [{"title":"The pitch · Знакомство","futsal":[{"en":"touchline","ru":"боковая линия","ex":"The two longer boundary lines are the touchlines."},{"en":"end line","ru":"линия ворот (лицевая линия)","ex":"The ball went over the end line, so it's a corner kick."},{"en":"halfway line","ru":"средняя линия","ex":"The halfway line divides the pitch into two halves."},{"en":"penalty area","ru":"штрафная площадь","ex":"The goalkeeper can use their hands only inside the penalty area."},{"en":"substitution zone","ru":"зона замены","ex":"Players must leave the pitch through their own substitution zone."},{"en":"goal line","ru":"линия ворот (между стойками)","ex":"The ball must wholly cross the goal line for a goal."},{"en":"goalpost","ru":"стойка ворот","ex":"The shot hit the left goalpost."},{"en":"goal net","ru":"сетка ворот","ex":"The referees check that the goal nets are properly attached."},{"en":"centre circle","ru":"центральный круг","ex":"Opponents must stay outside the centre circle at the kick-off."},{"en":"surface","ru":"покрытие (площадки)","ex":"The surface must be flat, smooth and non-abrasive."}],"life":[{"en":"to strike up a conversation","ru":"завязать разговор","ex":"I struck up a conversation with the timekeeper while we were waiting for the teams."},{"en":"to break the ice","ru":"растопить лёд, разрядить обстановку","ex":"A joke about the weather helped to break the ice."},{"en":"to hit it off (with someone)","ru":"сразу найти общий язык","ex":"We hit it off immediately and talked for hours."},{"en":"What line of work are you in?","ru":"В какой сфере вы работаете?","ex":"So, what line of work are you in? — I'm in logistics."},{"en":"to have a lot in common","ru":"иметь много общего","ex":"It turned out we had a lot in common."},{"en":"to make small talk","ru":"вести светскую беседу, болтать о пустяках","ex":"I'm not very good at making small talk with strangers."},{"en":"to get on like a house on fire","ru":"сразу подружиться, отлично ладить","ex":"Our kids got on like a house on fire."},{"en":"to ring a bell","ru":"звучать знакомо, напоминать что-то","ex":"His name rings a bell — have we met before?"},{"en":"to put a face to a name","ru":"наконец увидеть того, о ком слышал","ex":"It's great to finally put a face to a name!"},{"en":"to catch someone's eye","ru":"привлечь чьё-то внимание","ex":"I tried to catch the waiter's eye."}],"grammar":{"title":"Present Simple vs Present Continuous","explain":"\n<h4>1. Present Simple — образование</h4>\n<table><tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>\n<tr><td>+</td><td>I <b>play</b></td><td>she <b>plays</b></td></tr>\n<tr><td>−</td><td>I <b>don't play</b></td><td>she <b>doesn't play</b></td></tr>\n<tr><td>?</td><td><b>Do</b> you <b>play</b>?</td><td><b>Does</b> she <b>play</b>?</td></tr></table>\n<p><b>Правописание -s у he/she/it:</b></p>\n<ul><li>-s, -ss, -sh, -ch, -x, -o → <b>-es</b>: watch → watch<b>es</b>, go → go<b>es</b>, do → do<b>es</b>, finish → finish<b>es</b></li>\n<li>согласная + y → <b>-ies</b>: try → tr<b>ies</b>, carry → carr<b>ies</b>; но гласная + y → просто -s: play → play<b>s</b></li>\n<li>исключение: have → <b>has</b></li></ul>\n<div class=\"note\">⚠️ После does/doesn't глагол без -s: <i>Does she <b>play</b>?</i> (не <s>Does she plays?</s>)</div>\n\n<h4>2. Когда используем Present Simple</h4>\n<ul><li><b>Правила, инструкции, законы</b> — так написаны все Laws of the Game:\n<p class=\"ex\">The ball <b>is</b> out of play when it <b>hits</b> the ceiling.<br><span class=\"t\">Мяч выходит из игры, когда ударяется о потолок.</span></p></li>\n<li><b>Факты и общие истины:</b>\n<p class=\"ex\">Water <b>boils</b> at 100 degrees. Futsal <b>comes</b> from South America.</p></li>\n<li><b>Привычки и регулярные действия:</b>\n<p class=\"ex\">I <b>referee</b> two matches every weekend.<br><span class=\"t\">Я сужу два матча каждые выходные.</span></p></li>\n<li><b>Расписания</b> (даже о будущем): <p class=\"ex\">The match <b>starts</b> at 7 pm tomorrow.</p></li>\n<li><b>Комментарии и рассказ «в моменте»</b> (спортивный комментарий, пересказ видео): <p class=\"ex\">He <b>passes</b> to number 7, she <b>shoots</b> — goal!</p></li></ul>\n<p>Маркеры: <i>always, usually, often, sometimes, rarely, never, every day/week, on Mondays, twice a week</i>.</p>\n<div class=\"note\">⚠️ Наречия частоты стоят <b>перед</b> смысловым глаголом, но <b>после</b> to be: <i>She <b>always</b> checks the nets. She is <b>always</b> on time.</i></div>\n\n<h4>3. Present Continuous — образование</h4>\n<p><b>am / is / are + глагол-ing</b>: I'<b>m checking</b>, she'<b>s running</b>, they <b>aren't playing</b>, <b>Are</b> you <b>listening</b>?</p>\n<ul><li>немая -e отпадает: make → <b>making</b>, take → taking (но see → seeing, be → being)</li>\n<li>короткий ударный слог «согласная-гласная-согласная» → удвоение: run → ru<b>nn</b>ing, stop → sto<b>pp</b>ing, begin → begi<b>nn</b>ing</li>\n<li>-ie → -ying: lie → <b>lying</b>, die → dying</li></ul>\n\n<h4>4. Когда используем Present Continuous</h4>\n<ul><li><b>Прямо сейчас:</b> <p class=\"ex\">Look! The goalkeeper <b>is playing</b> as a flying goalkeeper.<br><span class=\"t\">Смотри! Вратарь играет как полевой.</span></p></li>\n<li><b>Временная ситуация «в этот период»:</b> <p class=\"ex\">I'<b>m studying</b> English this month. She'<b>s working</b> from home this week.</p></li>\n<li><b>Изменения и тенденции:</b> <p class=\"ex\">Futsal <b>is becoming</b> more popular. My English <b>is getting</b> better.</p></li>\n<li><b>Запланированное будущее</b> (договорённости): <p class=\"ex\">I'<b>m refereeing</b> the cup final on Saturday.</p></li>\n<li><b>always + Continuous = раздражение:</b> <p class=\"ex\">He'<b>s always arguing</b> with the referees!<br><span class=\"t\">Он вечно спорит с судьями! (бесит)</span></p></li></ul>\n<p>Маркеры: <i>now, right now, at the moment, currently, today, this week, Look! Listen!</i></p>\n\n<h4>5. Глаголы состояния (stative verbs) — главное исключение</h4>\n<p>Они описывают состояние, а не действие, поэтому обычно <b>не</b> употребляются в Continuous, даже если речь о «сейчас»:</p>\n<ul><li>мысли: <i>know, believe, understand, remember, forget, think (= считать), mean, agree</i></li>\n<li>чувства: <i>like, love, hate, prefer, want, need, wish</i></li>\n<li>владение: <i>have (= иметь), own, belong</i></li>\n<li>восприятие: <i>see, hear, smell, taste, seem, look (= выглядеть)</i></li></ul>\n<p class=\"ex\">I <b>understand</b> the rule now. (не <s>I'm understanding</s>)<br>This ball <b>belongs</b> to the home team.</p>\n<div class=\"note\">⚠️ Некоторые из них бывают и «действиями» — тогда Continuous возможен, но смысл меняется:<br>\nI <b>think</b> it's a penalty. (считаю) — I'<b>m thinking</b> about the decision. (обдумываю)<br>\nShe <b>has</b> a whistle. (имеет) — She'<b>s having</b> lunch / a shower / a great time. (действие)<br>\nThe soup <b>tastes</b> good. (на вкус) — The chef <b>is tasting</b> the soup. (пробует)<br>\nI <b>see</b> the problem. (понимаю/вижу) — I'<b>m seeing</b> the doctor tomorrow. (встречаюсь)</div>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ She play futsal. → ✅ She <b>plays</b> futsal.<br>\n❌ I am agree. → ✅ I <b>agree</b>. (agree — глагол, без am)<br>\n❌ Where you work? → ✅ Where <b>do</b> you work?<br>\n❌ I'm knowing the answer. → ✅ I <b>know</b> the answer.</div>","ex":[{"q":"A futsal team ___ five players on the pitch.","o":["has","is having","have"],"a":0,"why":"Это правило, факт → Present Simple, he/she/it + -s."},{"q":"Be quiet! The referee ___ to the captain right now.","o":["talks","is talking","talk"],"a":1,"why":"«right now» — действие происходит в момент речи."},{"q":"I ___ the Laws of the Game very well.","o":["am knowing","knows","know"],"a":2,"why":"know — глагол состояния, не бывает в Continuous."},{"q":"This month I ___ English every evening.","o":["am studying","study","studies"],"a":0,"why":"Временная ситуация (this month) → Present Continuous."},{"q":"The timekeeper usually ___ next to the third referee.","o":["is sitting","sits","sit"],"a":1,"why":"usually — привычка/регулярность → Present Simple."},{"q":"The referee always ___ the nets before the match.","o":["checks","is checking","check"],"a":0,"why":"always + привычка → Present Simple, she/he + -s."},{"q":"He's always ___ about the referees! It's so annoying.","o":["complain","complaining","complains"],"a":1,"why":"always + Continuous выражает раздражение."},{"q":"This whistle ___ to the second referee.","o":["is belonging","belongs","belong"],"a":1,"why":"belong — глагол состояния, не бывает в Continuous."},{"q":"— What are you doing? — I ___ about the penalty decision.","o":["think","am thinking","thinks"],"a":1,"why":"think = обдумывать (процесс) → Continuous возможен."},{"q":"Futsal ___ more and more popular in Europe.","o":["becomes","is becoming","become"],"a":1,"why":"Изменение, тенденция → Present Continuous."}]},"reading":{"title":"Law 1 — The Pitch","text":["A futsal pitch is a rectangle. The two longer lines are called touchlines, and the two shorter lines are called end lines. The part of the end line between the goalposts is the goal line. All lines are 8 cm wide, and they belong to the area they surround.","The halfway line divides the pitch into two halves. In the middle of it there is a centre mark with a circle around it. The radius of this circle is 3 metres.","For international matches, the touchline is between 38 and 42 metres long, and the end line is between 20 and 25 metres long. The surface should be flat and smooth, and wood is the preferred material.","In front of each team bench there is a substitution zone. It is 5 metres long, and it is always in the half of the pitch that the team defends. In the second half the teams change ends, so their substitution zones change too."],"q":[{"q":"What are the two shorter lines of the pitch called?","o":["Touchlines","End lines","Halfway lines"],"a":1},{"q":"How long is the touchline in an international match?","o":["25–38 m","38–42 m","20–25 m"],"a":1},{"q":"Where is a team's substitution zone?","o":["In the half the team attacks","In the half the team defends","Next to the timekeeper's table"],"a":1}]},"listening":{"title":"Meeting a new colleague","theme":"life","lines":[["Kate","Hi! I don't think we've met. I'm Kate — I've just joined the marketing team."],["Mark","Hi Kate, I'm Mark. So, what line of work were you in before?"],["Kate","I worked for a sports agency. Honestly, I was nervous about the first day, but you've already broken the ice."],["Mark","Glad to hear it! A sports agency? Then we must have a lot in common. I referee futsal at the weekends."],["Kate","No way! I play in an amateur futsal team."],["Mark","I had a feeling we'd hit it off. Just promise you won't argue with me if I ever referee your match!"],["Kate","I can't promise that, I'm afraid!"]],"q":[{"q":"Where did Kate work before?","o":["At a school","At a sports agency","At a marketing company"],"a":1},{"q":"What does Kate say Mark has already done?","o":["Broken the ice","Shown her the office","Invited her to a match"],"a":0},{"q":"Why does Mark think they will get on well?","o":["They both like futsal","They live near each other","They studied together"],"a":0}]}},{"title":"Marks & goals · Распорядок дня","futsal":[{"en":"penalty mark","ru":"отметка пенальти (6 м)","ex":"The penalty mark is 6 m from the middle of the goal line."},{"en":"10 m mark","ru":"10-метровая отметка (второй пенальти)","ex":"The sixth accumulated foul is often taken from the 10 m mark."},{"en":"corner arc","ru":"угловая дуга","ex":"Defenders must be at least 5 m from the corner arc."},{"en":"technical area","ru":"техническая зона","ex":"The coach must stay inside the technical area."},{"en":"crossbar","ru":"перекладина","ex":"The ball hit the crossbar and stayed on the pitch."},{"en":"team bench","ru":"скамейка запасных","ex":"At half-time, the teams change benches."},{"en":"timekeeper's table","ru":"столик хронометриста","ex":"The coach went to the timekeeper's table to request a timeout."},{"en":"5 m mark","ru":"5-метровая отметка","ex":"The goalkeeper must stay behind the 5 m mark at a DFKSAF."},{"en":"dimensions","ru":"размеры","ex":"The dimensions of the pitch are set in Law 1."},{"en":"to overhang (the mark)","ru":"нависать (над отметкой)","ex":"Part of the ball must touch or overhang the penalty mark."}],"life":[{"en":"to be pressed for time","ru":"быть в цейтноте, торопиться","ex":"I'm a bit pressed for time today — can we talk tomorrow?"},{"en":"to squeeze in","ru":"втиснуть, успеть (между делами)","ex":"I managed to squeeze in a workout before work."},{"en":"to run errands","ru":"бегать по делам","ex":"I spent the whole morning running errands."},{"en":"to stick to a routine","ru":"придерживаться распорядка","ex":"It's hard to stick to a routine when you travel a lot."},{"en":"to procrastinate","ru":"откладывать на потом, тянуть","ex":"Stop procrastinating and start your English lesson!"},{"en":"a night owl","ru":"сова (о человеке)","ex":"I'm a night owl — I do my best work after 10 pm."},{"en":"to wind down","ru":"расслабиться, отдохнуть (после дел)","ex":"I read a book to wind down before bed."},{"en":"to sleep in","ru":"поспать подольше, отоспаться","ex":"On Sundays I like to sleep in."},{"en":"to juggle","ru":"совмещать, жонглировать (делами)","ex":"She juggles a full-time job, refereeing and studying."},{"en":"to be on the go","ru":"быть в постоянном движении, суетиться","ex":"I've been on the go since six this morning."}],"grammar":{"title":"Past Simple vs Present Perfect","explain":"\n<h4>1. Past Simple — образование</h4>\n<ul><li>Правильные глаголы: <b>+ed</b>: play → play<b>ed</b>, award → award<b>ed</b>. Правописание: stop → sto<b>pp</b>ed, try → tr<b>ied</b>, arrive → arriv<b>ed</b>.</li>\n<li>Неправильные — учить: go–<b>went</b>, see–<b>saw</b>, take–<b>took</b>, give–<b>gave</b>, make–<b>made</b>, blow–<b>blew</b>, show–<b>showed</b> (правильный!), send–<b>sent</b>, throw–<b>threw</b>.</li>\n<li>Отрицание и вопрос — через <b>did</b>, глагол в начальной форме: <i>I <b>didn't see</b> it. <b>Did</b> you <b>see</b> the foul?</i></li></ul>\n<div class=\"note\">⚠️ После did — без -ed: <s>Did you saw</s> → Did you <b>see</b>?</div>\n\n<h4>2. Когда Past Simple</h4>\n<ul><li>Действие завершилось в <b>прошлом</b>, время известно или понятно из контекста:\n<p class=\"ex\">The referee <b>showed</b> a red card <b>in the 35th minute</b>.<br><span class=\"t\">Судья показал красную карточку на 35-й минуте.</span></p></li>\n<li>Цепочка событий: <p class=\"ex\">He <b>took</b> the ball, <b>dribbled</b> past two players and <b>scored</b>.</p></li>\n<li>Вопрос <b>When…?</b> → всегда Past Simple: <p class=\"ex\"><b>When did</b> you <b>start</b> refereeing?</p></li></ul>\n<p>Маркеры: <i>yesterday, last week/year, ago, in 2020, when I was young, on Monday</i>.</p>\n\n<h4>3. Present Perfect — образование</h4>\n<p><b>have / has + V3</b> (третья форма): I'<b>ve seen</b>, she'<b>s refereed</b>, we <b>haven't finished</b>, <b>Have</b> you ever <b>been</b>…?</p>\n\n<h4>4. Когда Present Perfect</h4>\n<ul><li><b>Результат важен сейчас</b> (время не важно): <p class=\"ex\">I'<b>ve lost</b> my whistle. (и сейчас его нет)<br><span class=\"t\">Я потеряла свисток.</span></p></li>\n<li><b>Опыт за жизнь</b> (ever/never): <p class=\"ex\">Have you <b>ever refereed</b> an international match? — No, I'<b>ve never done</b> that.</p></li>\n<li><b>Только что / уже / ещё нет:</b> <i>just, already, yet</i>\n<p class=\"ex\">The second half <b>has just started</b>. — Has the timekeeper arrived <b>yet</b>? — No, not <b>yet</b>.</p></li>\n<li><b>Незаконченный период времени:</b> <i>today, this week, this season, so far</i>\n<p class=\"ex\">We'<b>ve had</b> three yellow cards <b>so far</b>. I'<b>ve drunk</b> three coffees <b>today</b>.</p></li>\n<li><b>С прошлого до сейчас</b> (for/since), особенно с глаголами состояния: <p class=\"ex\">I'<b>ve known</b> her <b>for</b> ten years.</p></li></ul>\n\n<h4>5. Главное правило выбора</h4>\n<div class=\"note\">⚠️ Есть конкретное прошедшее время → только Past Simple.<br>\n❌ I <s>have seen</s> him yesterday. → ✅ I <b>saw</b> him yesterday.<br>\n❌ She <s>has finished</s> the course in 2024. → ✅ She <b>finished</b> it in 2024.</div>\n<p>Сравните пары:</p>\n<p class=\"ex\">I'<b>ve broken</b> my leg. (сейчас нога в гипсе)<br>I <b>broke</b> my leg in 2019. (история из прошлого)</p>\n<p class=\"ex\">She'<b>s been</b> to Spain. (была и вернулась — опыт)<br>She'<b>s gone</b> to Spain. (уехала и сейчас там)</p>\n<p class=\"ex\">This season he'<b>s scored</b> 10 goals. (сезон ещё идёт)<br>Last season he <b>scored</b> 20 goals. (сезон закончился)</p>\n<div class=\"note\">⚠️ <b>Американский английский</b> часто использует Past Simple там, где британский — Present Perfect: <i>Did you eat yet?</i> (AmE) = <i>Have you eaten yet?</i> (BrE). В правилах ФИФА — британский вариант.</div>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ I have seen this match last week. → ✅ I <b>saw</b> this match last week.<br>\n❌ When have you arrived? → ✅ When <b>did</b> you <b>arrive</b>?<br>\n❌ I live here since 2020. → ✅ I'<b>ve lived</b> here since 2020.</div>","ex":[{"q":"I ___ this match last Saturday.","o":["have refereed","refereed","referee"],"a":1,"why":"last Saturday — конкретное время → Past Simple."},{"q":"Have you ever ___ a penalty shoot-out?","o":["seen","saw","see"],"a":0,"why":"Present Perfect: have + V3 (see–saw–seen)."},{"q":"The team ___ already ___ five accumulated fouls in this half.","o":["did / commit","has / committed","have / commit"],"a":1,"why":"already + результат сейчас → has committed."},{"q":"She ___ her job two years ago.","o":["has changed","changed","changes"],"a":1,"why":"ago — всегда Past Simple."},{"q":"I can't find my whistle. I think I ___ it.","o":["have lost","lost yesterday","lose"],"a":0,"why":"Результат сейчас (не могу найти) → Present Perfect."},{"q":"When ___ you ___ refereeing?","o":["have / started","did / start","did / started"],"a":1,"why":"When…? → Past Simple, после did — начальная форма."},{"q":"She isn't here. She ___ to the referees' room.","o":["has been","has gone","went yesterday"],"a":1,"why":"has gone — ушла и сейчас там."},{"q":"We ___ three penalties so far in this match.","o":["had","have had","have"],"a":1,"why":"so far, матч идёт → Present Perfect."},{"q":"I ___ in Minsk since 2018.","o":["live","lived","have lived"],"a":2,"why":"since + с прошлого до сейчас → Present Perfect."},{"q":"Last season the team ___ only two matches.","o":["has lost","lost","have lost"],"a":1,"why":"Last season — законченный период → Past Simple."}]},"reading":{"title":"Marks on the pitch","text":["Inside each penalty area there is a penalty mark. It is 6 metres from the midpoint between the goalposts. Penalty kicks are taken from this mark.","There is also a second mark, 10 metres from the goal. In futsal it is called the 10 m mark. A direct free kick for the sixth accumulated foul (and every foul after that) can be taken from here. Two small marks, 5 metres to the left and right of it, show the distance other players must respect.","In each corner of the pitch there is a corner arc with a radius of 25 cm. Outside the pitch, 5 metres from each corner arc, there is a short mark. It helps the referees check that defenders are far enough away at a corner kick.","The goals are placed in the middle of each goal line. They are 3 metres wide and 2 metres high, and they must be fixed safely."],"q":[{"q":"How far is the penalty mark from the goal?","o":["5 m","6 m","10 m"],"a":1},{"q":"What is the 10 m mark used for?","o":["Kick-offs","Free kicks from the sixth accumulated foul","Goal clearances"],"a":1},{"q":"What does the mark outside the pitch near the corner help with?","o":["Checking the distance at corner kicks","Substitutions","Measuring the ball"],"a":0}]},"listening":{"title":"Pre-match check","theme":"futsal","lines":[["Referee","Good evening! Let's do a quick check of the pitch before the match."],["Second referee","Sure. The lines look fine, but the left goal is moving a bit."],["Referee","That's not safe. Can you ask the hall manager to fix it, please?"],["Second referee","Of course. What about the balls?"],["Referee","I've already checked them. Two balls are perfect, one is too soft."],["Second referee","OK. And the substitution zones are marked correctly, five metres from the halfway line."],["Referee","Great. Let's meet the timekeeper at the table in ten minutes."]],"q":[{"q":"What problem does the second referee find?","o":["The lines are wrong","A goal is moving","There is no timekeeper"],"a":1},{"q":"What is wrong with one ball?","o":["It is too soft","It is too heavy","It is the wrong colour"],"a":0},{"q":"Where will they meet in ten minutes?","o":["In the dressing room","At the timekeeper's table","In the technical area"],"a":1}]}},{"title":"The players · Работа","futsal":[{"en":"substitute","ru":"запасной игрок / заменять","ex":"An unlimited number of substitutions may be made."},{"en":"flying goalkeeper","ru":"вратарь-игрок («летающий» вратарь)","ex":"The team is losing, so they are playing with a flying goalkeeper."},{"en":"outfield player","ru":"полевой игрок","ex":"Any outfield player may change places with the goalkeeper during a stoppage."},{"en":"bib","ru":"манишка","ex":"The substitute takes the bib from the player who is leaving the pitch."},{"en":"team list","ru":"заявка команды (протокол)","ex":"Only players named on the team list can take part in the match."},{"en":"team captain","ru":"капитан команды","ex":"The team captain helps the referees to control the players."},{"en":"to replace","ru":"заменить","ex":"A player who has been replaced may return to the pitch later."},{"en":"shinguards","ru":"щитки","ex":"Shinguards must be covered by the socks."},{"en":"compulsory equipment","ru":"обязательная экипировка","ex":"Shirts, shorts, socks, shinguards and footwear are compulsory equipment."},{"en":"shirt number","ru":"номер на футболке","ex":"The flying goalkeeper wears a goalkeeper's shirt with his own shirt number."}],"life":[{"en":"workload","ru":"рабочая нагрузка, объём работы","ex":"My workload has doubled since my colleague left."},{"en":"to meet a deadline","ru":"уложиться в срок","ex":"We worked all weekend to meet the deadline."},{"en":"to fall behind (with)","ru":"отставать (от графика)","ex":"I fell behind with my reports while I was ill."},{"en":"to burn out / burnout","ru":"выгореть / выгорание","ex":"If you never take a break, you'll burn out."},{"en":"to delegate","ru":"делегировать, поручать другим","ex":"A good manager knows how to delegate."},{"en":"to call in sick","ru":"позвонить и сказать, что заболел","ex":"Half the team called in sick on Monday."},{"en":"to work overtime","ru":"работать сверхурочно","ex":"We had to work overtime to finish the project."},{"en":"to be laid off","ru":"быть уволенным (по сокращению)","ex":"Fifty people were laid off last year."},{"en":"to pull your weight","ru":"вносить свой вклад, работать наравне","ex":"Everyone in the team needs to pull their weight."},{"en":"to climb the career ladder","ru":"подниматься по карьерной лестнице","ex":"He climbed the career ladder very quickly."}],"grammar":{"title":"Modal verbs: must, have to, mustn't, don't have to","explain":"\n<h4>1. Общие правила модальных глаголов</h4>\n<ul><li>После модального — глагол <b>без to</b>: <i>must <b>go</b></i> (не <s>must to go</s>)</li>\n<li>Нет -s у he/she/it: <i>She <b>must</b> wear</i> (не <s>musts</s>)</li>\n<li>Вопрос и отрицание — без do: <i><b>Must</b> I…? You <b>mustn't</b>…</i></li></ul>\n<div class=\"note\">⚠️ <b>have to</b> — НЕ настоящий модальный: у него есть -s и do: <i>She <b>has to</b> go. <b>Does</b> she <b>have to</b> go? She <b>doesn't have to</b> go.</i></div>\n\n<h4>2. Обязанность: must vs have to</h4>\n<ul><li><b>must</b> — правило, приказ, личное убеждение говорящего, письменные инструкции:\n<p class=\"ex\">The ball <b>must</b> be stationary. (правило)<br>I <b>must</b> call my mum tonight. (сама так решила)</p></li>\n<li><b>have to</b> — необходимость из-за внешних обстоятельств:\n<p class=\"ex\">I <b>have to</b> get up at 5 — my flight is at 7.<br><span class=\"t\">Мне приходится вставать в 5 — у меня рейс в 7.</span></p></li>\n<li><b>have got to</b> — разговорный британский вариант have to: <i>I'<b>ve got to</b> go now.</i></li>\n<li><b>need to</b> — «нужно»: <i>You <b>need to</b> renew your licence.</i></li></ul>\n\n<h4>3. Запрет vs отсутствие необходимости — главная ловушка</h4>\n<table><tr><th>mustn't</th><th>don't have to / don't need to / needn't</th></tr>\n<tr><td>НЕЛЬЗЯ, запрещено</td><td>НЕ ОБЯЗАТЕЛЬНО, можно не делать</td></tr>\n<tr><td><i>Substitutes <b>mustn't</b> enter the pitch during a timeout.</i></td><td><i>The player <b>doesn't have to</b> ask permission to leave the pitch.</i></td></tr></table>\n<p class=\"ex\">You <b>mustn't</b> use your phone during the exam. (запрещено)<br>You <b>don't have to</b> bring a pen — we have pens. (не нужно, но можно)</p>\n<div class=\"note\">⚠️ В правилах игры запрет часто выражается и так: <i>may not, is not permitted, must not, cannot</i>: <i>A goal <b>cannot</b> be scored directly from a kick-in.</i></div>\n\n<h4>4. Разрешение и возможность: can, may, be allowed to</h4>\n<ul><li><b>can / be allowed to</b> — можно, разрешено: <i>Players <b>can</b> leave the pitch to drink during a timeout.</i></li>\n<li><b>may</b> — формальное «разрешается» (стиль правил): <i>A team <b>may</b> use up to nine substitutes.</i></li>\n<li><b>should</b> — совет, рекомендация (не обязательность!): <i>The surface <b>should</b> preferably be made of wood.</i></li></ul>\n\n<h4>5. Прошедшее и будущее</h4>\n<p>У must нет прошедшего и будущего — используем have to:</p>\n<p class=\"ex\">Yesterday I <b>had to</b> stay late. (прошлое)<br>Tomorrow I'<b>ll have to</b> wake up early. (будущее)<br>I <b>didn't have to</b> pay — it was free. (не пришлось)</p>\n<div class=\"note\">⚠️ <b>must have done</b> — это уже не обязанность, а уверенное предположение о прошлом: <i>He <b>must have missed</b> the bus.</i> — Он, должно быть, опоздал на автобус.</div>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ You must to wear shinguards. → ✅ You must <b>wear</b> shinguards.<br>\n❌ She musts come. → ✅ She <b>must</b> come.<br>\n❌ Yesterday I must work. → ✅ Yesterday I <b>had to</b> work.<br>\n❌ You mustn't come tomorrow, it's optional. → ✅ You <b>don't have to</b> come tomorrow.</div>","ex":[{"q":"A substitution: the player leaving the pitch ___ ask the referees for permission.","o":["mustn't","doesn't have to","must"],"a":1,"why":"По правилам разрешение не нужно → не обязательно = doesn't have to."},{"q":"Players ___ make marks on the pitch with their feet. It's unsporting behaviour.","o":["mustn't","don't have to","have to"],"a":0,"why":"Это запрещено → mustn't."},{"q":"A team ___ have at least three players to start the match.","o":["mustn't","must","doesn't have to"],"a":1,"why":"Обязательное правило → must."},{"q":"It's Sunday, so I ___ go to work. Great!","o":["mustn't","don't have to","must"],"a":1,"why":"Нет необходимости → don't have to."},{"q":"Yesterday I ___ stay late at work. (прошедшее время)","o":["must","had to","musted"],"a":1,"why":"У must нет прошедшего времени → had to."},{"q":"___ she have to wear a goalkeeper's shirt?","o":["Must","Does","Has"],"a":1,"why":"have to — вопрос через does."},{"q":"Tomorrow we ___ leave at 6 am.","o":["must to","will have to","will must"],"a":1,"why":"У must нет будущего → will have to."},{"q":"You ___ bring water — the organisers will provide it.","o":["mustn't","needn't","must"],"a":1,"why":"needn't = не нужно, нет необходимости."},{"q":"A team ___ use up to nine substitutes in official competitions. (стиль правил)","o":["may","must","mustn't"],"a":0,"why":"Формальное разрешение → may."},{"q":"The surface ___ preferably be made of wood. (рекомендация)","o":["must","should","has to"],"a":1,"why":"preferably → рекомендация → should."}]},"reading":{"title":"Law 3 — The Players","text":["A futsal match is played by two teams. Each team has a maximum of five players on the pitch, and one of them must be the goalkeeper. A match cannot start or continue if a team has fewer than three players.","In futsal, substitutions are unlimited, and a player who has been replaced can come back later. In official competitions, a team may use up to nine substitutes.","Substitutions can be made at any time, even when the ball is in play, but not during a timeout. The player leaves the pitch through the team's own substitution zone and does not need permission from the referees. The substitute hands over the bib and enters the pitch only after the other player has left.","Any substitute can change places with the goalkeeper without telling the referees. However, if an outfield player wants to become the goalkeeper, this must happen during a stoppage, and the referees must be informed first."],"q":[{"q":"What is the minimum number of players a team needs to continue a match?","o":["Two","Three","Four"],"a":1},{"q":"When can't substitutions be made?","o":["When the ball is in play","During a timeout","In the second half"],"a":1},{"q":"What must happen if an outfield player becomes the goalkeeper?","o":["The referees must be informed during a stoppage","The coach must ask the timekeeper","Nothing special"],"a":0}]},"listening":{"title":"Too much on my plate","theme":"life","lines":[["Anna","Tom, you look exhausted. Is everything OK?"],["Tom","Not really. My workload has doubled since Sarah left, and I'm falling behind with everything."],["Anna","That sounds stressful. Will you be able to meet the deadline on Friday?"],["Tom","Only if I work all weekend. To be honest, I think I'm burning out."],["Anna","Have you thought about delegating some of the tasks? The new assistant could check the figures."],["Tom","That's a good idea. I always try to do everything myself."],["Anna","Exactly — and that's how people end up with burnout. Talk to the manager today."]],"q":[{"q":"Why has Tom's workload doubled?","o":["A colleague left","He was promoted","He has a new client"],"a":0},{"q":"What is Tom afraid of?","o":["Losing his job","Burning out","Moving to another office"],"a":1},{"q":"What does Anna suggest?","o":["Taking a holiday","Delegating some tasks","Working at the weekend"],"a":1}]}},{"title":"Match officials · Покупки","futsal":[{"en":"second referee","ru":"второй судья","ex":"The second referee works on the opposite touchline."},{"en":"third referee","ru":"третий судья","ex":"The third referee records the accumulated fouls."},{"en":"timekeeper","ru":"хронометрист","ex":"The timekeeper stops the clock when the ball is out of play."},{"en":"chronometer","ru":"хронометр (табло времени)","ex":"The chronometer shows the playing time."},{"en":"final decision","ru":"окончательное решение","ex":"The referee always makes the final decision."},{"en":"match official","ru":"официальное лицо матча (судья)","ex":"All match officials must wear appropriate clothing."},{"en":"fourth referee","ru":"четвёртый судья (резервный)","ex":"The fourth referee replaces the third referee if necessary."},{"en":"match report","ru":"рапорт о матче","ex":"All cards must be included in the match report."},{"en":"to appoint","ru":"назначить (на матч)","ex":"She was appointed to referee the cup final."},{"en":"pre-match inspection","ru":"предматчевый осмотр","ex":"The referees' authority starts with the pre-match inspection."}],"life":[{"en":"to shop around","ru":"присматриваться, сравнивать цены","ex":"Shop around before you buy a new phone."},{"en":"a rip-off","ru":"обдираловка, грабёж (о цене)","ex":"Twelve euros for a coffee? What a rip-off!"},{"en":"to splash out (on)","ru":"раскошелиться (на)","ex":"I splashed out on a really good pair of referee boots."},{"en":"an impulse buy","ru":"спонтанная покупка","ex":"This jacket was an impulse buy, but I love it."},{"en":"to be out of stock","ru":"нет в наличии","ex":"Sorry, this size is out of stock at the moment."},{"en":"to haggle","ru":"торговаться","ex":"At the market you're expected to haggle."},{"en":"value for money","ru":"соотношение цены и качества","ex":"These boots are great value for money."},{"en":"to window-shop","ru":"разглядывать витрины (не покупая)","ex":"We didn't buy anything — we just window-shopped."},{"en":"to break the bank","ru":"разорить, стоить очень дорого","ex":"A nice dinner doesn't have to break the bank."},{"en":"second-hand","ru":"подержанный, б/у","ex":"I bought a second-hand bike."}],"grammar":{"title":"Passive voice (Present Simple)","explain":"\n<h4>1. Что такое пассив</h4>\n<p>В <b>активе</b> подлежащее делает действие: <i>The referee <b>awards</b> a penalty.</i><br>В <b>пассиве</b> подлежащее испытывает действие: <i>A penalty <b>is awarded</b>.</i> — Назначается пенальти.</p>\n<p><b>Формула:</b> be (в нужном времени) + <b>V3</b> (третья форма / -ed)</p>\n<table><tr><th>Время</th><th>Пассив</th></tr>\n<tr><td>Present Simple</td><td>The ball <b>is kicked</b>. Fouls <b>are recorded</b>.</td></tr>\n<tr><td>Present Continuous</td><td>The pitch <b>is being cleaned</b>. (сейчас)</td></tr>\n<tr><td>Отрицание</td><td>Offside <b>is not used</b> in futsal.</td></tr>\n<tr><td>Вопрос</td><td><b>Is</b> the time <b>stopped</b> after a goal?</td></tr></table>\n\n<h4>2. Когда используем пассив</h4>\n<ul><li>Неважно / неизвестно / очевидно, <b>кто</b> делает: <p class=\"ex\">The match <b>is played</b> on a wooden floor.<br>My phone <b>was stolen</b>. (не знаю кем)</p></li>\n<li><b>Правила, инструкции, процедуры</b> — официальный стиль: <p class=\"ex\">The player <b>is cautioned</b>. Play <b>is restarted</b> with a dropped ball.<br><span class=\"t\">Игроку выносится предупреждение. Игра возобновляется спорным мячом.</span></p></li>\n<li>Важнее <b>объект</b>, чем исполнитель: <p class=\"ex\">Futsal <b>is played</b> in more than 100 countries.</p></li></ul>\n\n<h4>3. Исполнитель: by</h4>\n<p>Если важно, кто делает, — <b>by</b>: <i>The time is controlled <b>by</b> the timekeeper.</i><br>Инструмент — <b>with</b>: <i>The time is controlled <b>with</b> a chronometer.</i></p>\n<div class=\"note\">⚠️ В большинстве пассивных предложений by не нужен. Не пишите «by somebody / by people».</div>\n\n<h4>4. Неправильные глаголы — нужна 3-я форма!</h4>\n<p class=\"ex\">show → shown: A yellow card <b>is shown</b>.<br>throw → thrown: The ball <b>is thrown</b> by the goalkeeper.<br>take → taken: The kick <b>is taken</b> from the touchline.<br>send off → sent off: He <b>is sent off</b>.<br>give → given; hold → held; put → put; make → made</p>\n\n<h4>5. Особые случаи</h4>\n<ul><li>Глаголы с двумя дополнениями: <i>They give the captain a warning.</i> → <i>The captain <b>is given</b> a warning.</i> (чаще пассив с человеком)</li>\n<li>Фразовые глаголы — частица остаётся: <i>The match <b>is called off</b>.</i> (отменяется)</li>\n<li>Непереходные глаголы (happen, arrive, die, come) <b>не</b> бывают в пассиве: <s>The accident was happened</s> → The accident <b>happened</b>.</li>\n<li>Безличные конструкции: <i>It <b>is said</b> that… / He <b>is considered</b> the best referee.</i> — Говорят, что… / Его считают лучшим судьёй.</li></ul>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ A penalty is award. → ✅ A penalty is <b>awarded</b>.<br>\n❌ The ball kicked by the player. → ✅ The ball <b>is</b> kicked by the player. (забыли be)<br>\n❌ The accident was happened. → ✅ The accident <b>happened</b>.</div>","ex":[{"q":"A direct free kick ___ if a player trips an opponent.","o":["awards","is awarded","is award"],"a":1,"why":"is + V3 (awarded)."},{"q":"Accumulated fouls ___ by the third referee.","o":["are recorded","is recorded","records"],"a":0,"why":"fouls — множественное число → are + V3."},{"q":"The match ___ by two referees on the pitch.","o":["controls","is controlling","is controlled"],"a":2,"why":"Пассив: is controlled by."},{"q":"These shoes ___ in Italy.","o":["are made","make","are make"],"a":0,"why":"are + V3 (make–made–made)."},{"q":"A player who commits a reckless foul ___.","o":["cautions","is cautioned","is caution"],"a":1,"why":"Игрока предупреждают → is cautioned."},{"q":"A yellow card ___ for dissent.","o":["is shown","is showed","shows"],"a":0,"why":"show → shown (V3)."},{"q":"The pitch ___ right now, so we can't train.","o":["is cleaned","is being cleaned","cleans"],"a":1,"why":"right now → Present Continuous Passive: is being + V3."},{"q":"Offside ___ in futsal.","o":["isn't used","doesn't use","isn't use"],"a":0,"why":"Пассив: is not + V3."},{"q":"What ___?","o":["was happened","happened","is happened"],"a":1,"why":"happen — непереходный глагол, пассива нет."},{"q":"The time is controlled ___ the timekeeper ___ a chronometer.","o":["by / with","with / by","by / by"],"a":0,"why":"Исполнитель — by, инструмент — with."}]},"reading":{"title":"Laws 5 & 6 — The Match Officials","text":["A futsal match is controlled by two referees on the pitch: the referee and the second referee. They usually move along opposite touchlines, so the play is always between them.","The referee has the final decision. If the two referees signal different decisions at the same time, the referee's decision is the one that counts.","Competitions can also appoint other match officials: a third referee, a timekeeper and sometimes a fourth referee. They sit at a table next to the pitch, near the substitution zones.","The timekeeper controls the playing time. The chronometer is stopped every time the ball goes out of play and started again at the restart. The third referee helps with substitutions, records accumulated fouls and watches the behaviour of the team officials in the technical areas."],"q":[{"q":"Who makes the final decision?","o":["The second referee","The referee","The timekeeper"],"a":1},{"q":"When is the chronometer stopped?","o":["Only at half-time","When the ball goes out of play","Only after goals"],"a":1},{"q":"Which of these is a job of the third referee?","o":["Recording accumulated fouls","Taking kick-ins","Choosing the ball"],"a":0}]},"listening":{"title":"Buying new boots","theme":"life","lines":[["Assistant","Hi there! Are you looking for anything in particular?"],["Customer","Yes, indoor shoes for refereeing. I've been shopping around, and your prices seem the most reasonable."],["Assistant","These are our best ones. They're not cheap, but they'll last for years."],["Customer","Hmm, a hundred and forty euros. Normally I'd say that's a rip-off, but my old ones are falling apart."],["Assistant","Then it might be worth splashing out. Unfortunately, size thirty-eight is out of stock until Monday."],["Customer","Could you order them for me? I'd rather wait than make another impulse buy I'll regret."],["Assistant","Of course. I'll call you as soon as they arrive."]],"q":[{"q":"What has the customer been doing?","o":["Comparing prices in different shops","Reading reviews","Waiting for a sale"],"a":0},{"q":"What is the problem with size 38?","o":["It's too expensive","It's out of stock","It's the wrong colour"],"a":1},{"q":"Why does the customer prefer to wait?","o":["She doesn't want another impulse buy","She has no money today","She wants a discount"],"a":0}]}},{"title":"Time & timeouts · В кафе","futsal":[{"en":"period","ru":"тайм (период игры)","ex":"The match lasts for two equal periods of 20 minutes."},{"en":"timeout","ru":"тайм-аут","ex":"Each team is entitled to a one-minute timeout in each period."},{"en":"half-time interval","ru":"перерыв между таймами","ex":"The half-time interval must not exceed 15 minutes."},{"en":"extra time","ru":"дополнительное время","ex":"Extra time consists of two periods of five minutes."},{"en":"acoustic signal","ru":"звуковой сигнал (сирена)","ex":"The period ends when the acoustic signal sounds."},{"en":"playing time","ru":"чистое игровое время","ex":"A period lasts 20 minutes of playing time."},{"en":"to stop the clock","ru":"остановить время (хронометр)","ex":"The timekeeper stops the clock when the ball goes out of play."},{"en":"to request (a timeout)","ru":"запросить (тайм-аут)","ex":"The coach requested a timeout from the third referee."},{"en":"to abandon (a match)","ru":"прекратить матч (окончательно)","ex":"The match was abandoned because of a power cut."},{"en":"to suspend (a match)","ru":"временно остановить матч","ex":"The referees suspended the match because of a leak in the roof."}],"life":[{"en":"to be peckish","ru":"слегка проголодаться","ex":"I'm a bit peckish — shall we get a snack?"},{"en":"It's on me","ru":"Я угощаю","ex":"Put your wallet away — dinner's on me tonight."},{"en":"to go Dutch","ru":"платить каждый за себя","ex":"On our first date we went Dutch."},{"en":"an acquired taste","ru":"вкус, к которому надо привыкнуть","ex":"Blue cheese is an acquired taste."},{"en":"to grab a bite (to eat)","ru":"перекусить на скорую руку","ex":"Let's grab a bite to eat after the match."},{"en":"to have a sweet tooth","ru":"быть сладкоежкой","ex":"I have a terrible sweet tooth."},{"en":"to eat out","ru":"есть вне дома (в кафе, ресторане)","ex":"We eat out once a week."},{"en":"to whip up (a meal)","ru":"быстро приготовить","ex":"She whipped up a delicious pasta in ten minutes."},{"en":"bland","ru":"пресный, безвкусный","ex":"The soup was a bit bland, so I added some salt."},{"en":"a doggy bag","ru":"пакет/контейнер для остатков еды из ресторана","ex":"Could we have a doggy bag for the rest of the pizza?"}],"grammar":{"title":"Conditionals 0 & 1 (If ...)","explain":"\n<h4>1. Zero conditional — всегда так</h4>\n<p><b>If / When + Present Simple, Present Simple</b></p>\n<p>Правила, законы природы, то, что происходит <b>каждый раз</b>. If здесь ≈ when.</p>\n<p class=\"ex\">If the ball <b>hits</b> the ceiling, play <b>restarts</b> with a kick-in.<br><span class=\"t\">Если мяч ударяется о потолок, игра возобновляется ударом с боковой.</span></p>\n<p class=\"ex\">If you <b>heat</b> ice, it <b>melts</b>. When I'<b>m</b> tired, I <b>make</b> mistakes.</p>\n\n<h4>2. First conditional — реальное будущее</h4>\n<p><b>If + Present Simple, will + глагол</b></p>\n<p>Конкретная ситуация в будущем, которая вполне может произойти.</p>\n<p class=\"ex\">If you <b>argue</b> with the referee again, he <b>will show</b> you a yellow card.<br><span class=\"t\">Если ты снова будешь спорить с судьёй, он покажет тебе жёлтую.</span></p>\n<p class=\"ex\">If it <b>rains</b> tomorrow, we'<b>ll train</b> indoors.</p>\n<p>Вместо will можно: <b>can, may, might, should</b>, повелительное наклонение:</p>\n<p class=\"ex\">If you finish early, you <b>can</b> go home.<br>If you see a dog on the pitch, <b>stop</b> the game!</p>\n\n<h4>3. Главное правило: после if — НЕ will</h4>\n<div class=\"note\">⚠️ В русском «если <b>пойдёт</b> дождь» — будущее, а в английском — Present:<br>\n❌ If it <s>will rain</s>, … → ✅ If it <b>rains</b>, …<br>\nТо же после <b>when, as soon as, before, after, until, unless, as long as, in case</b>:<br>\nI'll call you <b>when</b> I <b>arrive</b>. (не <s>when I will arrive</s>)<br>\nDon't start <b>until</b> the referee <b>blows</b> the whistle.</div>\n\n<h4>4. Unless = if … not</h4>\n<p class=\"ex\"><b>Unless</b> you hurry, you'll miss the bus. = <b>If</b> you <b>don't</b> hurry, …<br><span class=\"t\">Если не поторопишься, опоздаешь на автобус.</span></p>\n<p class=\"ex\">The advantage is not applied <b>unless</b> there is a clear goalscoring opportunity.</p>\n<div class=\"note\">⚠️ После unless глагол утвердительный: <s>Unless you don't hurry</s> — двойное отрицание, ошибка.</div>\n\n<h4>5. Порядок частей и запятая</h4>\n<p>If-часть может стоять в начале (тогда запятая) или в конце (без запятой):</p>\n<p class=\"ex\"><b>If</b> the team scores, the kick-off is taken by the opponents.<br>The kick-off is taken by the opponents <b>if</b> the team scores.</p>\n\n<h4>6. if vs when</h4>\n<p class=\"ex\">I'll call you <b>if</b> I get the job. (может, не получу)<br>I'll call you <b>when</b> I get home. (точно приду домой)</p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ If I will see him, I tell him. → ✅ If I <b>see</b> him, I'<b>ll tell</b> him.<br>\n❌ When the match will finish, we'll go. → ✅ When the match <b>finishes</b>, …<br>\n❌ Unless you don't study, you'll fail. → ✅ <b>Unless</b> you <b>study</b>, you'll fail.</div>","ex":[{"q":"If a team ___ a goal, the other team takes the kick-off.","o":["scores","will score","scored"],"a":0,"why":"Правило → zero conditional, Present в обеих частях."},{"q":"If I finish work early, I ___ you at the café.","o":["meet","will meet","met"],"a":1,"why":"Реальное будущее → will в главной части."},{"q":"If it ___ tomorrow, the match will be indoors anyway.","o":["will rain","rains","rained"],"a":1,"why":"После if — Present Simple, не will."},{"q":"___ the kick-in is taken within four seconds, the ball goes to the opponents.","o":["If","Unless","When"],"a":1,"why":"Unless = if not: если НЕ выполнен за 4 секунды."},{"q":"The period ends when the acoustic signal ___.","o":["sounds","will sound","sounded"],"a":0,"why":"После when (во временных придаточных) — Present."},{"q":"I'll send you the report as soon as I ___ it.","o":["will finish","finish","finished"],"a":1,"why":"После as soon as — Present, не will."},{"q":"If you see an outside agent on the pitch, ___ the game.","o":["stop","you stop","will stop"],"a":0,"why":"Повелительное наклонение в главной части."},{"q":"We'll miss the kick-off ___ we leave now.","o":["if","unless","when"],"a":1,"why":"unless = if not: если НЕ выйдем сейчас."},{"q":"If you heat ice, it ___.","o":["will melt","melts","melted"],"a":1,"why":"Закон природы → zero conditional."},{"q":"Take an umbrella in case it ___.","o":["will rain","rains","rained"],"a":1,"why":"После in case — Present Simple."}]},"reading":{"title":"Law 7 — Duration of the Match","text":["A futsal match has two equal periods of 20 minutes. This is playing time, not real time: the timekeeper stops the chronometer whenever the ball is out of play. That's why a futsal match usually takes much longer than 40 minutes.","Each period ends when the timekeeper's acoustic signal sounds, even if the referees do not blow their whistle. There is one exception: if a penalty kick or a free kick for the sixth accumulated foul is awarded just before the end, the period continues until the kick is completed.","Each team can ask for a one-minute timeout in each period. A team official asks the third referee or the timekeeper, and the timeout is given when that team has the ball and the ball is out of play. A team that doesn't use its timeout in the first period still has only one in the second. There are no timeouts in extra time.","The half-time interval must not be longer than 15 minutes."],"q":[{"q":"Why is a futsal match longer than 40 minutes in real time?","o":["Because of extra time","Because the clock stops when the ball is out of play","Because of long timeouts"],"a":1},{"q":"If a team doesn't use its timeout in the first period, how many can it have in the second?","o":["Two","One","None"],"a":1},{"q":"When is a timeout given?","o":["At any moment","When the requesting team has the ball and it's out of play","Only after a goal"],"a":1}]},"listening":{"title":"Timeout request","theme":"futsal","lines":[["Coach","Excuse me! We'd like a timeout, please."],["Third referee","OK, but I can only give it when your team has the ball and the ball is out of play."],["Coach","Yes, I know. Our goalkeeper has the ball now — he's going to take a goal clearance."],["Third referee","Right. Timekeeper, timeout for the blue team!"],["Timekeeper","Signal given. One minute starts now."],["Third referee","Coach, remember: you can't give instructions on the pitch, and no substitutions until the timeout ends."],["Coach","Understood. Thanks."]],"q":[{"q":"Why can the timeout be given now?","o":["The blue team has scored","The blue team's goalkeeper is taking a goal clearance","The half is over"],"a":1},{"q":"How long is the timeout?","o":["30 seconds","One minute","Two minutes"],"a":1},{"q":"What is the coach NOT allowed to do?","o":["Talk to players off the pitch","Give instructions on the pitch","Sit on the bench"],"a":1}]}},{"title":"Start & restart · Путешествия","futsal":[{"en":"kick-off","ru":"начальный удар (с центра)","ex":"After a goal, the kick-off is taken by the other team."},{"en":"centre mark","ru":"центральная отметка","ex":"The ball must be stationary on the centre mark."},{"en":"toss a coin","ru":"подбросить монету (жеребьёвка)","ex":"The referee tosses a coin before the match."},{"en":"dropped ball","ru":"спорный мяч","ex":"Play restarts with a dropped ball after an injury."},{"en":"restart (of play)","ru":"возобновление игры","ex":"A kick-in is one of the restarts of play."},{"en":"to win the toss","ru":"выиграть жребий","ex":"The team that wins the toss chooses the kick-off."},{"en":"to change ends","ru":"поменяться воротами (сторонами)","ex":"The teams change ends for the second period."},{"en":"in possession (of the ball)","ru":"владеющий мячом","ex":"The ball is dropped for the team that was in possession."},{"en":"to resume (play)","ru":"возобновить (игру)","ex":"Play resumed with a dropped ball."},{"en":"own half","ru":"своя половина поля","ex":"At the kick-off, all players must be in their own half."}],"life":[{"en":"to get around","ru":"передвигаться (по городу, стране)","ex":"The easiest way to get around Lisbon is by tram."},{"en":"off the beaten track","ru":"вдали от туристических маршрутов","ex":"We found a lovely village off the beaten track."},{"en":"a layover","ru":"пересадка, стыковка (в аэропорту)","ex":"I have a three-hour layover in Frankfurt."},{"en":"jet lag","ru":"джетлаг, смена часовых поясов","ex":"I still have jet lag after the flight to Brazil."},{"en":"to set off","ru":"отправиться в путь","ex":"We set off early to avoid the traffic."},{"en":"to travel light","ru":"путешествовать налегке","ex":"I always travel light — just hand luggage."},{"en":"to see someone off","ru":"проводить кого-то (на вокзал, в аэропорт)","ex":"My parents came to the airport to see me off."},{"en":"a tourist trap","ru":"место для «выкачивания денег» из туристов","ex":"That restaurant is a tourist trap — avoid it."},{"en":"itinerary","ru":"маршрут, план поездки","ex":"The tournament organisers sent us the itinerary."},{"en":"to backpack","ru":"путешествовать с рюкзаком (бюджетно)","ex":"After university, she backpacked around Asia."}],"grammar":{"title":"Past Continuous vs Past Simple","explain":"\n<h4>1. Образование Past Continuous</h4>\n<p><b>was / were + глагол-ing</b></p>\n<p class=\"ex\">I / he / she / it <b>was running</b>. You / we / they <b>were running</b>.<br>\nHe <b>wasn't listening</b>. <b>Were</b> they <b>playing</b>?</p>\n\n<h4>2. Когда Past Continuous</h4>\n<ul><li><b>Процесс в определённый момент прошлого:</b>\n<p class=\"ex\">At 8 pm yesterday I <b>was refereeing</b> a match.<br><span class=\"t\">Вчера в 8 вечера я судила матч.</span></p></li>\n<li><b>Фон для события</b> (длительное + короткое):\n<p class=\"ex\">The striker <b>was running</b> towards the goal <b>when</b> the defender <b>tripped</b> him.</p></li>\n<li><b>Два параллельных процесса</b> (while):\n<p class=\"ex\"><b>While</b> the referee <b>was talking</b> to the captain, the coach <b>was shouting</b> at the timekeeper.</p></li>\n<li><b>Описание обстановки</b> в рассказе:\n<p class=\"ex\">It <b>was raining</b>, fans <b>were singing</b>, and both teams <b>were waiting</b> for the whistle.</p></li></ul>\n\n<h4>3. Past Simple — последовательность событий</h4>\n<p class=\"ex\">When the referee <b>blew</b> the whistle, the players <b>stopped</b>.<br><span class=\"t\">Когда судья свистнул, игроки остановились. (сначала свисток, потом остановились)</span></p>\n<div class=\"note\">⚠️ Сравните:<br>\nWhen I arrived, they <b>were having</b> dinner. — Когда я пришла, они ужинали (уже начали).<br>\nWhen I arrived, they <b>had</b> dinner. — Когда я пришла, они (начали) ужинать (после моего прихода).</div>\n\n<h4>4. when vs while</h4>\n<ul><li><b>while</b> + длительный процесс (обычно Continuous): <i>While I <b>was waiting</b>, …</i></li>\n<li><b>when</b> + короткое событие (обычно Simple): <i>…<b>when</b> the phone <b>rang</b>.</i>, но when может стоять и с Continuous.</li>\n<li><b>as</b> — «в то время как» (книжно): <i><b>As</b> I was leaving, it started to rain.</i></li></ul>\n\n<h4>5. Исключения</h4>\n<ul><li>Глаголы состояния (know, want, like, believe…) — не в Continuous и в прошлом: <i>I <b>knew</b> he was lying.</i> (не <s>was knowing</s>)</li>\n<li>Повторяющиеся законченные действия — Past Simple: <i>He <b>shot</b> five times.</i></li>\n<li>Past Continuous для вежливости: <i>I <b>was wondering</b> if you could help me.</i></li></ul>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ While I walked home, I was seeing an accident. → ✅ While I <b>was walking</b> home, I <b>saw</b> an accident.<br>\n❌ What did you do at 9 pm yesterday? (если про процесс) → ✅ What <b>were</b> you <b>doing</b> at 9 pm?<br>\n❌ They was playing. → ✅ They <b>were</b> playing.</div>","ex":[{"q":"The goalkeeper ___ the ball when the opponent kicked it.","o":["was releasing","released","releases"],"a":0,"why":"Процесс прерван другим действием → Past Continuous."},{"q":"While we ___ for the bus, it started to rain.","o":["waited","were waiting","are waiting"],"a":1,"why":"while + длительный процесс → were waiting."},{"q":"I ___ my phone while I was running to the gate.","o":["was dropping","dropped","drop"],"a":1,"why":"Короткое событие → Past Simple."},{"q":"What ___ you doing at 8 pm yesterday?","o":["were","did","was"],"a":0,"why":"Процесс в конкретный момент → were you doing."},{"q":"The players ___ when the referee blew the whistle.","o":["were arguing","argue","have argued"],"a":0,"why":"Фон в прошлом → Past Continuous."},{"q":"___ the fans were singing, the referee checked the goals.","o":["When","While","During"],"a":1,"why":"while + процесс."},{"q":"I ___ he was telling the truth.","o":["was knowing","knew","was know"],"a":1,"why":"know — глагол состояния."},{"q":"When the timekeeper sounded the signal, the players ___ off the pitch.","o":["were walking","walked","walk"],"a":1,"why":"Последовательность: сигнал → ушли с поля."},{"q":"It ___ and the fans were waiting outside the hall.","o":["rained","was raining","rains"],"a":1,"why":"Описание обстановки → Past Continuous."},{"q":"They ___ training when the lights went out.","o":["was","were","did"],"a":1,"why":"they → were + -ing."}]},"reading":{"title":"Law 8 — Start and Restart of Play","text":["Before the match, the referee tosses a coin. The team that wins the toss decides whether to take the kick-off in the first or the second period. In the second period the teams change ends.","At the kick-off, the ball must be stationary on the centre mark, and all players must be in their own half. The opponents must be at least 3 metres from the ball. The ball is in play when it is kicked and clearly moves. A goal can be scored directly from the kick-off against the opponents.","Sometimes the referees stop play without any offence — for example, because a player is injured. Then play restarts with a dropped ball. The ball is dropped for one player of the team that had the ball, or would have got it. All other players must be at least 2 metres away. The ball is in play when it touches the floor."],"q":[{"q":"How far must the opponents be at the kick-off?","o":["2 m","3 m","5 m"],"a":1},{"q":"When is a dropped ball used?","o":["After a foul","When play is stopped without an offence","After a goal"],"a":1},{"q":"When is a dropped ball in play?","o":["When it touches the floor","When a player kicks it","When the referee whistles"],"a":0}]},"listening":{"title":"Planning a trip","theme":"life","lines":[["Agent","So, you're flying to Lisbon for the tournament. There's no direct flight, I'm afraid — you'll have a layover in Madrid."],["Passenger","How long is the layover?"],["Agent","About two hours. Your flight sets off at six fifteen in the morning."],["Passenger","That's early! Still, at least there's no time difference, so no jet lag."],["Agent","True. Have you thought about how you'll get around in Lisbon?"],["Passenger","Mostly by tram, I think. And after the tournament I'd love to see something off the beaten track."],["Agent","Then visit the fishing villages on the coast. Very few tourists go there."]],"q":[{"q":"Where is the layover?","o":["Lisbon","Madrid","Porto"],"a":1},{"q":"Why won't the passenger have jet lag?","o":["The flight is short","There's no time difference","She will sleep on the plane"],"a":1},{"q":"What does the agent recommend?","o":["Fishing villages on the coast","The city centre","A boat trip"],"a":0}]}},{"title":"Ball in & out · Здоровье","futsal":[{"en":"out of play","ru":"мяч вне игры (не в игре)","ex":"The ball is out of play when it hits the ceiling."},{"en":"wholly passed over","ru":"полностью пересёк (линию)","ex":"The ball is out only when it has wholly passed over the touchline."},{"en":"kick-in","ru":"удар с боковой линии (ввод мяча ногой)","ex":"A kick-in is awarded to the opponents of the player who last touched the ball."},{"en":"ceiling","ru":"потолок","ex":"If the ball hits the ceiling, the opponents take a kick-in."},{"en":"rebound","ru":"отскок / отскакивать","ex":"The ball rebounded off the goalpost and stayed in play."},{"en":"outside agent","ru":"посторонний (человек, животное, предмет)","ex":"A dog ran onto the pitch — an outside agent interfered with play."},{"en":"to bounce","ru":"отскакивать (от пола)","ex":"The ball must not bounce lower than 50 cm when dropped from 2 m."},{"en":"to deflect","ru":"отразить, изменить траекторию (мяча)","ex":"The shot was deflected by a defender."},{"en":"in the air","ru":"по воздуху","ex":"The ball is out whether it crosses the line on the floor or in the air."},{"en":"ball in play","ru":"мяч в игре","ex":"The ball is in play when it rebounds off the crossbar and stays on the pitch."}],"life":[{"en":"to come down with","ru":"заболеть (чем-то), слечь с","ex":"I think I'm coming down with a cold."},{"en":"to be run-down","ru":"быть измотанным, ослабленным","ex":"You look run-down — you need some rest."},{"en":"to be on the mend","ru":"идти на поправку","ex":"She was ill last week, but she's on the mend now."},{"en":"to pull a muscle","ru":"потянуть мышцу","ex":"He pulled a muscle during the sprint test."},{"en":"to shake off (an illness)","ru":"избавиться от (болезни), побороть","ex":"I can't shake off this cough."},{"en":"a check-up","ru":"медосмотр, обследование","ex":"Referees need a medical check-up every season."},{"en":"side effects","ru":"побочные эффекты","ex":"This medicine can have side effects like drowsiness."},{"en":"to sprain (an ankle)","ru":"подвернуть (лодыжку), растянуть связки","ex":"She sprained her ankle during the warm-up."},{"en":"to put your feet up","ru":"отдохнуть, расслабиться","ex":"After the tournament, I just want to put my feet up."},{"en":"as fit as a fiddle","ru":"здоров как бык, в отличной форме","ex":"My grandad is ninety and as fit as a fiddle."}],"grammar":{"title":"Future: will, be going to, Present Continuous","explain":"\n<h4>1. will</h4>\n<ul><li><b>Решение в момент речи:</b> <p class=\"ex\">— The ball is too soft. — OK, I'<b>ll get</b> another one.</p></li>\n<li><b>Обещание, предложение, просьба:</b> <p class=\"ex\">I'<b>ll help</b> you. <b>Will</b> you <b>close</b> the door, please? I <b>won't be</b> late, I promise.</p></li>\n<li><b>Предсказание-мнение</b> (часто с I think, probably, I'm sure): <p class=\"ex\">I think it <b>will be</b> a difficult match.</p></li>\n<li><b>Факт о будущем:</b> <p class=\"ex\">I'<b>ll be</b> 30 next year.</p></li></ul>\n<div class=\"note\">⚠️ <b>shall</b> — в вопросах-предложениях с I/we: <i><b>Shall</b> I open the window? <b>Shall</b> we start?</i> — Мне открыть окно? Начнём?</div>\n\n<h4>2. be going to</h4>\n<ul><li><b>Намерение, решение принято заранее:</b> <p class=\"ex\">I'<b>m going to</b> take the referee exam next year.<br><span class=\"t\">Я собираюсь сдавать экзамен на судью в следующем году.</span></p></li>\n<li><b>Предсказание по очевидным признакам «сейчас»:</b> <p class=\"ex\">Look at those clouds — it'<b>s going to</b> rain.<br>He's alone in front of the goal — he'<b>s going to</b> score!</p></li></ul>\n\n<h4>3. Present Continuous для будущего</h4>\n<p><b>Договорённости</b> с конкретным временем/местом (записано в календаре):</p>\n<p class=\"ex\">I'<b>m refereeing</b> a match on Saturday at 6. We'<b>re meeting</b> the coaches tomorrow.</p>\n\n<h4>4. Present Simple для будущего</h4>\n<p><b>Расписания, программы:</b> <i>The tournament <b>starts</b> on 5 May. The train <b>leaves</b> at 7:40.</i></p>\n\n<h4>5. Как выбрать</h4>\n<table><tr><th>Ситуация</th><th>Форма</th></tr>\n<tr><td>Решила только что</td><td>I'll …</td></tr>\n<tr><td>Решила раньше (план в голове)</td><td>I'm going to …</td></tr>\n<tr><td>Договорилась (план в календаре)</td><td>I'm …ing</td></tr>\n<tr><td>Расписание</td><td>It starts at …</td></tr></table>\n\n<h4>6. Другие способы</h4>\n<ul><li><b>Future Continuous</b> (will be + -ing) — процесс в момент будущего: <i>This time tomorrow I'<b>ll be flying</b> to Lisbon.</i></li>\n<li><b>be about to</b> — вот-вот: <i>The match <b>is about to</b> start.</i></li>\n<li><b>be due to</b> — по плану: <i>The referees <b>are due to</b> arrive at 5.</i></li></ul>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ I will to call you. → ✅ I will <b>call</b> you.<br>\n❌ I'm going to meet her tomorrow at 5, we agreed. (возможно, но лучше) → ✅ I'<b>m meeting</b> her tomorrow at 5.<br>\n❌ When I will arrive, I'll call. → ✅ When I <b>arrive</b>, I'll call.</div>","ex":[{"q":"— The phone is ringing. — OK, I ___ it.","o":["'m going to answer","'ll answer","answer"],"a":1,"why":"Решение принято в момент речи → will."},{"q":"I've decided: I ___ take the referee exam next year.","o":["will","am going to","am taking to"],"a":1,"why":"Заранее принятое решение → be going to."},{"q":"I ___ the doctor at 10 tomorrow. I made an appointment.","o":["'m seeing","see","will to see"],"a":0,"why":"Договорённость с временем → Present Continuous."},{"q":"The striker is completely alone in front of the goal. He ___ score!","o":["is going to","will to","goes"],"a":0,"why":"Предсказание по очевидным признакам → going to."},{"q":"Don't worry, I promise I ___ be late.","o":["won't","am not going","don't"],"a":0,"why":"Обещание → will / won't."},{"q":"___ I bring you some water?","o":["Will","Shall","Am"],"a":1,"why":"Предложение помощи с I → Shall I…?"},{"q":"This time tomorrow I ___ on the beach.","o":["will lie","will be lying","lie"],"a":1,"why":"Процесс в момент будущего → Future Continuous."},{"q":"Hurry up! The match is ___ start.","o":["about to","going","due"],"a":0,"why":"be about to = вот-вот."},{"q":"The tournament ___ on 5 May. (расписание)","o":["starts","is going to start","will starting"],"a":0,"why":"Расписание → Present Simple."},{"q":"I'm sure you ___ the exam.","o":["are passing","will pass","pass"],"a":1,"why":"Предсказание-мнение (I'm sure) → will."}]},"reading":{"title":"Law 9 — Ball In and Out of Play","text":["The ball is out of play when it has wholly passed over the touchline or the end line, on the floor or in the air. If only part of the ball is over the line, the ball is still in play. The ball is also out of play when the referees stop play, or when it hits the ceiling.","If the ball hits the ceiling, play restarts with a kick-in for the opponents of the team that last touched it. The kick-in is taken from the touchline, at the point nearest to where the ball hit the ceiling.","The ball stays in play if it rebounds off a goalpost or the crossbar and remains on the pitch. It is also normally in play when it touches a referee. But if it touches a match official and then a team starts a promising attack, the ball goes directly into the goal, or the other team gets possession, play is stopped and restarted with a dropped ball."],"q":[{"q":"Half of the ball is over the touchline. Is it out of play?","o":["Yes","No"],"a":1},{"q":"What happens if the ball hits the ceiling?","o":["A dropped ball","A kick-in for the opponents","A goal clearance"],"a":1},{"q":"The ball hits a referee and goes directly into the goal. What is the restart?","o":["Goal","Dropped ball","Kick-off"],"a":1}]},"listening":{"title":"At the doctor's","theme":"life","lines":[["Doctor","Good morning. What seems to be the problem?"],["Patient","I think I'm coming down with something. I've felt run-down all week, and now I have a sore throat."],["Doctor","Let me have a look... It's a viral infection. Have you been under a lot of stress recently?"],["Patient","Yes, three tournaments in a row. And I pulled a muscle in my leg last weekend."],["Doctor","That explains it. Your body needs time to recover. No refereeing for at least a week."],["Patient","A week? But I've got a match on Saturday."],["Doctor","If you rest now, you'll shake it off quickly. If not, you'll be ill for a month. Come back on Friday — I'm sure you'll be on the mend by then."]],"q":[{"q":"How has the patient felt all week?","o":["Run-down","Over the moon","Hungry"],"a":0},{"q":"What happened last weekend?","o":["She caught a cold","She pulled a muscle","She missed a match"],"a":1},{"q":"What does the doctor advise?","o":["Referee on Saturday","Rest for at least a week","Go to hospital"],"a":1}]}},{"title":"Direct fouls · Чувства","futsal":[{"en":"to trip","ru":"поставить подножку","ex":"The defender tripped the attacker near the halfway line."},{"en":"to push","ru":"толкать","ex":"Pushing an opponent is a direct free kick offence."},{"en":"to charge","ru":"атаковать корпусом (плечом)","ex":"A player may fairly charge an opponent when the ball is within playing distance."},{"en":"to hold","ru":"держать, задерживать (соперника)","ex":"Holding an opponent's shirt is a foul."},{"en":"direct free kick","ru":"штрафной удар","ex":"A goal can be scored directly from a direct free kick."},{"en":"to strike","ru":"ударить (рукой, головой)","ex":"Striking an opponent is a direct free kick offence."},{"en":"to jump at","ru":"прыгнуть на (соперника)","ex":"He jumped at the opponent instead of playing the ball."},{"en":"to kick (an opponent)","ru":"ударить ногой (соперника)","ex":"Kicking or attempting to kick an opponent is a foul."},{"en":"to impede (with contact)","ru":"препятствовать (с контактом)","ex":"Impeding an opponent with contact is a direct free kick offence."},{"en":"to spit (at)","ru":"плюнуть (в)","ex":"Spitting at someone is a sending-off offence."}],"life":[{"en":"to be over the moon","ru":"быть на седьмом небе от счастья","ex":"She was over the moon when she got the final."},{"en":"to be at your wits' end","ru":"быть в полном отчаянии, не знать, что делать","ex":"I'm at my wits' end with this noisy neighbour."},{"en":"overwhelmed","ru":"переполненный (эмоциями), перегруженный","ex":"I felt overwhelmed by all the new information."},{"en":"to get on someone's nerves","ru":"действовать на нервы","ex":"His constant complaining gets on my nerves."},{"en":"to keep your cool","ru":"сохранять хладнокровие","ex":"A good referee keeps her cool when players shout."},{"en":"to be on edge","ru":"быть на взводе, нервничать","ex":"I was on edge before my first international match."},{"en":"to lose your temper","ru":"выйти из себя","ex":"The coach lost his temper and was sent off."},{"en":"gutted","ru":"страшно расстроенный (разг.)","ex":"The players were gutted after losing in the final minute."},{"en":"to be taken aback","ru":"быть ошеломлённым, застигнутым врасплох","ex":"I was taken aback by his rude reply."},{"en":"thrilled to bits","ru":"безумно рад(а)","ex":"She was thrilled to bits with her birthday present."}],"grammar":{"title":"Relative clauses: who, which, that, where, whose","explain":"\n<h4>1. Относительные местоимения</h4>\n<table><tr><th>Слово</th><th>Для чего</th><th>Пример</th></tr>\n<tr><td>who</td><td>люди</td><td>the player <b>who</b> scored</td></tr>\n<tr><td>which</td><td>предметы, животные, действия</td><td>the ball <b>which</b> hit the post</td></tr>\n<tr><td>that</td><td>люди и предметы (разговорно, только в определяющих)</td><td>the rule <b>that</b> changed</td></tr>\n<tr><td>whose</td><td>чей (люди и предметы)</td><td>the player <b>whose</b> shirt was torn</td></tr>\n<tr><td>where</td><td>место</td><td>the hall <b>where</b> we train</td></tr>\n<tr><td>when</td><td>время</td><td>the day <b>when</b> I passed the exam</td></tr>\n<tr><td>whom</td><td>кого/кому (формально, после предлогов)</td><td>the official <b>to whom</b> I spoke</td></tr></table>\n\n<h4>2. Определяющие (defining) придаточные</h4>\n<p>Без них непонятно, о ком/чём речь. <b>Без запятых</b>.</p>\n<p class=\"ex\">A player <b>who</b> is sent off must leave the technical area.<br><span class=\"t\">Игрок, который удалён, должен покинуть техническую зону. (какой игрок? — удалённый)</span></p>\n<p class=\"ex\">The foul <b>that</b> he committed was reckless.</p>\n\n<h4>3. Можно опустить who/which/that</h4>\n<p>Если местоимение — <b>дополнение</b> (после него идёт новое подлежащее):</p>\n<p class=\"ex\">The referee (<s>who</s>) I met yesterday was from Italy. — <i>I</i> = подлежащее, значит who можно убрать.<br>\nThe book (<s>that</s>) you gave me is great.</p>\n<p>Нельзя опустить, если оно — <b>подлежащее</b>: <i>The referee <b>who</b> met me…</i></p>\n\n<h4>4. Неопределяющие (non-defining) придаточные</h4>\n<p>Дополнительная информация, можно убрать без потери смысла. <b>С запятыми</b>. <b>that нельзя!</b></p>\n<p class=\"ex\">Pierluigi, <b>who</b> is 45, refereed the final.<br>Futsal, <b>which</b> is played indoors, is very fast.</p>\n<div class=\"note\">⚠️ ❌ Futsal, <s>that</s> is played indoors, … → ✅ Futsal, <b>which</b> is pla
