<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Referee English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color, #f4f3ef);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #1b1d1c);
  --hint: var(--tg-theme-hint-color, #7b807d);
  --accent: #1f7a4d;
  --accent-soft: rgba(31,122,77,.12);
  --yellow: #f2b705;
  --red: #d64541;
  --line: rgba(127,127,127,.18);
  --ok: #1f9d55;
  --bad: #d64541;
  --r: 16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg: var(--tg-theme-bg-color,#121413); --card: var(--tg-theme-section-bg-color, var(--tg-theme-secondary-bg-color,#1d201f)); --text: var(--tg-theme-text-color,#eceeed); --hint: var(--tg-theme-hint-color,#8d938f); --accent:#3fb37a; --accent-soft: rgba(63,179,122,.16); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px;min-height:100vh}
h1{font-size:24px;line-height:1.2;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--hint)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-align:center;margin-top:12px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.life{background:rgba(242,183,5,.18);color:#a37700}
@media (prefers-color-scheme: dark){.pill.life{color:#f2c94c}}
.hero{background:linear-gradient(135deg,#1f7a4d,#145236);color:#fff;border-radius:20px;padding:18px;margin:10px 0;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.75)}
.hero .btn{background:#fff;color:#145236}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border:2px solid rgba(255,255,255,.18);border-radius:50%}
.hero:before{content:"";position:absolute;right:35px;top:-30px;width:2px;height:200px;background:rgba(255,255,255,.18)}
.stepdots{display:flex;gap:6px;margin:12px 0 4px}
.stepdots span{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}
.stepdots span.on{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--hint)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.num.done{background:var(--accent);color:#fff}
.num.lock{background:var(--line);color:var(--hint)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{width:36px;height:36px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}
.tabs button{padding:8px 12px;border-radius:99px;background:var(--card);font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button.done:not(.on){color:var(--accent)}
.word{font-size:30px;font-weight:700;line-height:1.15;margin:10px 0 4px;letter-spacing:-.01em}
.tr{font-size:18px;margin:8px 0}
.exs{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin-top:14px}
.say{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.say.sm{width:32px;height:32px}
.say svg{width:20px;height:20px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:rgba(31,157,85,.12)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,65,.10)}
.opt:disabled{color:var(--text)}
.feedback{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.feedback.ok{background:rgba(31,157,85,.12)}
.feedback.bad{background:rgba(214,69,65,.10)}
.q{font-size:18px;font-weight:600}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.grammar p{margin:8px 0}
.grammar .ex{background:var(--accent-soft);padding:8px 12px;border-radius:10px;font-style:italic}
.text p{margin:0 0 12px}
.term{border-bottom:2px dotted var(--accent);cursor:pointer}
.player{display:flex;align-items:center;gap:12px}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.bar{flex:1;height:6px;background:var(--line);border-radius:4px;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.speed{font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);min-width:46px}
.tline{padding:8px 10px;border-radius:10px;margin:2px 0;transition:background .2s}
.tline.cur{background:var(--accent-soft)}
.tline b{color:var(--accent);font-weight:600}
.pop{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1d1c;color:#fff;padding:10px 14px;border-radius:12px;font-size:15px;max-width:90vw;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.flip{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.boxdots{display:inline-flex;gap:3px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.boxdots i.on{background:var(--accent)}
input.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.center{text-align:center}
.big{font-size:48px;margin:8px 0}
.dict .item{align-items:flex-start}
.ycard{display:inline-block;width:12px;height:16px;border-radius:2px;background:var(--yellow);vertical-align:-2px;margin-right:6px;transform:rotate(-8deg)}
</style>
</head>

<div id="app"></div>
<nav id="nav"></nav>
<script>
const LESSONS = [{"title":"The pitch · Знакомство","futsal":[{"en":"touchline","ru":"боковая линия","ex":"The two longer boundary lines are the touchlines."},{"en":"end line","ru":"линия ворот (лицевая линия)","ex":"The ball went over the end line, so it's a corner kick."},{"en":"halfway line","ru":"средняя линия","ex":"The halfway line divides the pitch into two halves."},{"en":"penalty area","ru":"штрафная площадь","ex":"The goalkeeper can use their hands only inside the penalty area."},{"en":"substitution zone","ru":"зона замены","ex":"Players must leave the pitch through their own substitution zone."}],"life":[{"en":"to strike up a conversation","ru":"завязать разговор","ex":"I struck up a conversation with the timekeeper while we were waiting for the teams."},{"en":"to break the ice","ru":"растопить лёд, разрядить обстановку","ex":"A joke about the weather helped to break the ice."},{"en":"to hit it off (with someone)","ru":"сразу найти общий язык","ex":"We hit it off immediately and talked for hours."},{"en":"What line of work are you in?","ru":"В какой сфере вы работаете?","ex":"So, what line of work are you in? — I'm in logistics."},{"en":"to have a lot in common","ru":"иметь много общего","ex":"It turned out we had a lot in common."}],"grammar":{"title":"Present Simple vs Present Continuous","explain":"<p><b>Present Simple</b> — факты, правила, привычки. Именно в нём написаны правила игры.</p>\n<p class=\"ex\">The match <b>lasts</b> 40 minutes. The referee <b>blows</b> the whistle.</p>\n<p><b>Present Continuous</b> (am/is/are + -ing) — то, что происходит прямо сейчас или временно.</p>\n<p class=\"ex\">Look! The goalkeeper <b>is playing</b> as a flying goalkeeper.</p>\n<p>Маркеры: <i>always, usually, every day</i> → Simple; <i>now, at the moment, look!</i> → Continuous.</p>\n<p>⚠️ Глаголы состояния (<i>know, like, want, need, believe</i>) обычно не используются в Continuous: <i>I <b>know</b> the rules</i>, а не <s>I am knowing</s>.</p>","ex":[{"q":"A futsal team ___ five players on the pitch.","o":["has","is having","have"],"a":0,"why":"Это правило, факт → Present Simple, he/she/it + -s."},{"q":"Be quiet! The referee ___ to the captain right now.","o":["talks","is talking","talk"],"a":1,"why":"«right now» — действие происходит в момент речи."},{"q":"I ___ the Laws of the Game very well.","o":["am knowing","knows","know"],"a":2,"why":"know — глагол состояния, не бывает в Continuous."},{"q":"This month I ___ English every evening.","o":["am studying","study","studies"],"a":0,"why":"Временная ситуация (this month) → Present Continuous."},{"q":"The timekeeper usually ___ next to the third referee.","o":["is sitting","sits","sit"],"a":1,"why":"usually — привычка/регулярность → Present Simple."}]},"reading":{"title":"Law 1 — The Pitch","text":["A futsal pitch is a rectangle. The two longer lines are called touchlines, and the two shorter lines are called end lines. The part of the end line between the goalposts is the goal line. All lines are 8 cm wide, and they belong to the area they surround.","The halfway line divides the pitch into two halves. In the middle of it there is a centre mark with a circle around it. The radius of this circle is 3 metres.","For international matches, the touchline is between 38 and 42 metres long, and the end line is between 20 and 25 metres long. The surface should be flat and smooth, and wood is the preferred material.","In front of each team bench there is a substitution zone. It is 5 metres long, and it is always in the half of the pitch that the team defends. In the second half the teams change ends, so their substitution zones change too."],"q":[{"q":"What are the two shorter lines of the pitch called?","o":["Touchlines","End lines","Halfway lines"],"a":1},{"q":"How long is the touchline in an international match?","o":["25–38 m","38–42 m","20–25 m"],"a":1},{"q":"Where is a team's substitution zone?","o":["In the half the team attacks","In the half the team defends","Next to the timekeeper's table"],"a":1}]},"listening":{"title":"Meeting a new colleague","theme":"life","lines":[["Kate","Hi! I don't think we've met. I'm Kate — I've just joined the marketing team."],["Mark","Hi Kate, I'm Mark. So, what line of work were you in before?"],["Kate","I worked for a sports agency. Honestly, I was nervous about the first day, but you've already broken the ice."],["Mark","Glad to hear it! A sports agency? Then we must have a lot in common. I referee futsal at the weekends."],["Kate","No way! I play in an amateur futsal team."],["Mark","I had a feeling we'd hit it off. Just promise you won't argue with me if I ever referee your match!"],["Kate","I can't promise that, I'm afraid!"]],"q":[{"q":"Where did Kate work before?","o":["At a school","At a sports agency","At a marketing company"],"a":1},{"q":"What does Kate say Mark has already done?","o":["Broken the ice","Shown her the office","Invited her to a match"],"a":0},{"q":"Why does Mark think they will get on well?","o":["They both like futsal","They live near each other","They studied together"],"a":0}]}},{"title":"Marks & goals · Распорядок дня","futsal":[{"en":"penalty mark","ru":"отметка пенальти (6 м)","ex":"The penalty mark is 6 m from the middle of the goal line."},{"en":"10 m mark","ru":"10-метровая отметка (второй пенальти)","ex":"The sixth accumulated foul is often taken from the 10 m mark."},{"en":"corner arc","ru":"угловая дуга","ex":"Defenders must be at least 5 m from the corner arc."},{"en":"technical area","ru":"техническая зона","ex":"The coach must stay inside the technical area."},{"en":"crossbar","ru":"перекладина","ex":"The ball hit the crossbar and stayed on the pitch."}],"life":[{"en":"to be pressed for time","ru":"быть в цейтноте, торопиться","ex":"I'm a bit pressed for time today — can we talk tomorrow?"},{"en":"to squeeze in","ru":"втиснуть, успеть (между делами)","ex":"I managed to squeeze in a workout before work."},{"en":"to run errands","ru":"бегать по делам","ex":"I spent the whole morning running errands."},{"en":"to stick to a routine","ru":"придерживаться распорядка","ex":"It's hard to stick to a routine when you travel a lot."},{"en":"to procrastinate","ru":"откладывать на потом, тянуть","ex":"Stop procrastinating and start your English lesson!"}],"grammar":{"title":"Past Simple vs Present Perfect","explain":"<p><b>Past Simple</b> — законченное действие в известный момент прошлого (yesterday, last week, in 2023, ago).</p>\n<p class=\"ex\">The referee <b>showed</b> a red card <b>in the second half</b>.</p>\n<p><b>Present Perfect</b> (have/has + V3) — результат важен сейчас, время не указано; опыт; <i>already, yet, just, ever, never</i>.</p>\n<p class=\"ex\">I <b>have</b> never <b>refereed</b> an international match. She <b>has just scored</b>!</p>\n<p>Если есть конкретное время в прошлом — только Past Simple: <s>I have seen him yesterday</s> → I <b>saw</b> him yesterday.</p>","ex":[{"q":"I ___ this match last Saturday.","o":["have refereed","refereed","referee"],"a":1,"why":"last Saturday — конкретное время → Past Simple."},{"q":"Have you ever ___ a penalty shoot-out?","o":["seen","saw","see"],"a":0,"why":"Present Perfect: have + V3 (see–saw–seen)."},{"q":"The team ___ already ___ five accumulated fouls in this half.","o":["did / commit","has / committed","have / commit"],"a":1,"why":"already + результат сейчас → has committed."},{"q":"She ___ her job two years ago.","o":["has changed","changed","changes"],"a":1,"why":"ago — всегда Past Simple."},{"q":"I can't find my whistle. I think I ___ it.","o":["have lost","lost yesterday","lose"],"a":0,"why":"Результат сейчас (не могу найти) → Present Perfect."}]},"reading":{"title":"Marks on the pitch","text":["Inside each penalty area there is a penalty mark. It is 6 metres from the midpoint between the goalposts. Penalty kicks are taken from this mark.","There is also a second mark, 10 metres from the goal. In futsal it is called the 10 m mark. A direct free kick for the sixth accumulated foul (and every foul after that) can be taken from here. Two small marks, 5 metres to the left and right of it, show the distance other players must respect.","In each corner of the pitch there is a corner arc with a radius of 25 cm. Outside the pitch, 5 metres from each corner arc, there is a short mark. It helps the referees check that defenders are far enough away at a corner kick.","The goals are placed in the middle of each goal line. They are 3 metres wide and 2 metres high, and they must be fixed safely."],"q":[{"q":"How far is the penalty mark from the goal?","o":["5 m","6 m","10 m"],"a":1},{"q":"What is the 10 m mark used for?","o":["Kick-offs","Free kicks from the sixth accumulated foul","Goal clearances"],"a":1},{"q":"What does the mark outside the pitch near the corner help with?","o":["Checking the distance at corner kicks","Substitutions","Measuring the ball"],"a":0}]},"listening":{"title":"Pre-match check","theme":"futsal","lines":[["Referee","Good evening! Let's do a quick check of the pitch before the match."],["Second referee","Sure. The lines look fine, but the left goal is moving a bit."],["Referee","That's not safe. Can you ask the hall manager to fix it, please?"],["Second referee","Of course. What about the balls?"],["Referee","I've already checked them. Two balls are perfect, one is too soft."],["Second referee","OK. And the substitution zones are marked correctly, five metres from the halfway line."],["Referee","Great. Let's meet the timekeeper at the table in ten minutes."]],"q":[{"q":"What problem does the second referee find?","o":["The lines are wrong","A goal is moving","There is no timekeeper"],"a":1},{"q":"What is wrong with one ball?","o":["It is too soft","It is too heavy","It is the wrong colour"],"a":0},{"q":"Where will they meet in ten minutes?","o":["In the dressing room","At the timekeeper's table","In the technical area"],"a":1}]}},{"title":"The players · Работа","futsal":[{"en":"substitute","ru":"запасной игрок / заменять","ex":"An unlimited number of substitutions may be made."},{"en":"flying goalkeeper","ru":"вратарь-игрок («летающий» вратарь)","ex":"The team is losing, so they are playing with a flying goalkeeper."},{"en":"outfield player","ru":"полевой игрок","ex":"Any outfield player may change places with the goalkeeper during a stoppage."},{"en":"bib","ru":"манишка","ex":"The substitute takes the bib from the player who is leaving the pitch."},{"en":"team list","ru":"заявка команды (протокол)","ex":"Only players named on the team list can take part in the match."}],"life":[{"en":"workload","ru":"рабочая нагрузка, объём работы","ex":"My workload has doubled since my colleague left."},{"en":"to meet a deadline","ru":"уложиться в срок","ex":"We worked all weekend to meet the deadline."},{"en":"to fall behind (with)","ru":"отставать (от графика)","ex":"I fell behind with my reports while I was ill."},{"en":"to burn out / burnout","ru":"выгореть / выгорание","ex":"If you never take a break, you'll burn out."},{"en":"to delegate","ru":"делегировать, поручать другим","ex":"A good manager knows how to delegate."}],"grammar":{"title":"Modal verbs: must, have to, mustn't, don't have to","explain":"<p>В правилах футзала модальные глаголы встречаются постоянно!</p>\n<p><b>must / have to</b> — обязанность. <i>must</i> часто — правило или решение говорящего; <i>have to</i> — внешняя необходимость.</p>\n<p class=\"ex\">The ball <b>must</b> be stationary. I <b>have to</b> get up early tomorrow.</p>\n<p><b>mustn't</b> — запрет («нельзя»).</p>\n<p class=\"ex\">Substitutes <b>mustn't</b> enter the pitch during a timeout.</p>\n<p><b>don't have to</b> — нет необходимости («не обязательно»).</p>\n<p class=\"ex\">The player <b>doesn't have to</b> ask the referees' permission to leave the pitch.</p>\n<p>⚠️ <b>mustn't ≠ don't have to</b>! Это главная ловушка.</p>","ex":[{"q":"A substitution: the player leaving the pitch ___ ask the referees for permission.","o":["mustn't","doesn't have to","must"],"a":1,"why":"По правилам разрешение не нужно → не обязательно = doesn't have to."},{"q":"Players ___ make marks on the pitch with their feet. It's unsporting behaviour.","o":["mustn't","don't have to","have to"],"a":0,"why":"Это запрещено → mustn't."},{"q":"A team ___ have at least three players to start the match.","o":["mustn't","must","doesn't have to"],"a":1,"why":"Обязательное правило → must."},{"q":"It's Sunday, so I ___ go to work. Great!","o":["mustn't","don't have to","must"],"a":1,"why":"Нет необходимости → don't have to."},{"q":"Yesterday I ___ stay late at work. (прошедшее время)","o":["must","had to","musted"],"a":1,"why":"У must нет прошедшего времени → had to."}]},"reading":{"title":"Law 3 — The Players","text":["A futsal match is played by two teams. Each team has a maximum of five players on the pitch, and one of them must be the goalkeeper. A match cannot start or continue if a team has fewer than three players.","In futsal, substitutions are unlimited, and a player who has been replaced can come back later. In official competitions, a team may use up to nine substitutes.","Substitutions can be made at any time, even when the ball is in play, but not during a timeout. The player leaves the pitch through the team's own substitution zone and does not need permission from the referees. The substitute hands over the bib and enters the pitch only after the other player has left.","Any substitute can change places with the goalkeeper without telling the referees. However, if an outfield player wants to become the goalkeeper, this must happen during a stoppage, and the referees must be informed first."],"q":[{"q":"What is the minimum number of players a team needs to continue a match?","o":["Two","Three","Four"],"a":1},{"q":"When can't substitutions be made?","o":["When the ball is in play","During a timeout","In the second half"],"a":1},{"q":"What must happen if an outfield player becomes the goalkeeper?","o":["The referees must be informed during a stoppage","The coach must ask the timekeeper","Nothing special"],"a":0}]},"listening":{"title":"Too much on my plate","theme":"life","lines":[["Anna","Tom, you look exhausted. Is everything OK?"],["Tom","Not really. My workload has doubled since Sarah left, and I'm falling behind with everything."],["Anna","That sounds stressful. Will you be able to meet the deadline on Friday?"],["Tom","Only if I work all weekend. To be honest, I think I'm burning out."],["Anna","Have you thought about delegating some of the tasks? The new assistant could check the figures."],["Tom","That's a good idea. I always try to do everything myself."],["Anna","Exactly — and that's how people end up with burnout. Talk to the manager today."]],"q":[{"q":"Why has Tom's workload doubled?","o":["A colleague left","He was promoted","He has a new client"],"a":0},{"q":"What is Tom afraid of?","o":["Losing his job","Burning out","Moving to another office"],"a":1},{"q":"What does Anna suggest?","o":["Taking a holiday","Delegating some tasks","Working at the weekend"],"a":1}]}},{"title":"Match officials · Покупки","futsal":[{"en":"second referee","ru":"второй судья","ex":"The second referee works on the opposite touchline."},{"en":"third referee","ru":"третий судья","ex":"The third referee records the accumulated fouls."},{"en":"timekeeper","ru":"хронометрист","ex":"The timekeeper stops the clock when the ball is out of play."},{"en":"chronometer","ru":"хронометр (табло времени)","ex":"The chronometer shows the playing time."},{"en":"final decision","ru":"окончательное решение","ex":"The referee always makes the final decision."}],"life":[{"en":"to shop around","ru":"присматриваться, сравнивать цены","ex":"Shop around before you buy a new phone."},{"en":"a rip-off","ru":"обдираловка, грабёж (о цене)","ex":"Twelve euros for a coffee? What a rip-off!"},{"en":"to splash out (on)","ru":"раскошелиться (на)","ex":"I splashed out on a really good pair of referee boots."},{"en":"an impulse buy","ru":"спонтанная покупка","ex":"This jacket was an impulse buy, but I love it."},{"en":"to be out of stock","ru":"нет в наличии","ex":"Sorry, this size is out of stock at the moment."}],"grammar":{"title":"Passive voice (Present Simple)","explain":"<p><b>Пассив</b> = <b>am/is/are + V3</b>. Используется, когда важно действие, а не кто его выполняет. В правилах игры пассив — повсюду!</p>\n<p class=\"ex\">A penalty kick <b>is awarded</b>. The player <b>is cautioned</b>. The ball <b>is dropped</b>.</p>\n<p>Сравните: <i>The referees <b>caution</b> the player</i> (актив) → <i>The player <b>is cautioned</b></i> (пассив).</p>\n<p>Если нужно назвать исполнителя — <b>by</b>: <i>The time is controlled <b>by</b> the timekeeper.</i></p>","ex":[{"q":"A direct free kick ___ if a player trips an opponent.","o":["awards","is awarded","is award"],"a":1,"why":"is + V3 (awarded)."},{"q":"Accumulated fouls ___ by the third referee.","o":["are recorded","is recorded","records"],"a":0,"why":"fouls — множественное число → are + V3."},{"q":"The match ___ by two referees on the pitch.","o":["controls","is controlling","is controlled"],"a":2,"why":"Пассив: is controlled by."},{"q":"These shoes ___ in Italy.","o":["are made","make","are make"],"a":0,"why":"are + V3 (make–made–made)."},{"q":"A player who commits a reckless foul ___.","o":["cautions","is cautioned","is caution"],"a":1,"why":"Игрока предупреждают → is cautioned."}]},"reading":{"title":"Laws 5 & 6 — The Match Officials","text":["A futsal match is controlled by two referees on the pitch: the referee and the second referee. They usually move along opposite touchlines, so the play is always between them.","The referee has the final decision. If the two referees signal different decisions at the same time, the referee's decision is the one that counts.","Competitions can also appoint other match officials: a third referee, a timekeeper and sometimes a fourth referee. They sit at a table next to the pitch, near the substitution zones.","The timekeeper controls the playing time. The chronometer is stopped every time the ball goes out of play and started again at the restart. The third referee helps with substitutions, records accumulated fouls and watches the behaviour of the team officials in the technical areas."],"q":[{"q":"Who makes the final decision?","o":["The second referee","The referee","The timekeeper"],"a":1},{"q":"When is the chronometer stopped?","o":["Only at half-time","When the ball goes out of play","Only after goals"],"a":1},{"q":"Which of these is a job of the third referee?","o":["Recording accumulated fouls","Taking kick-ins","Choosing the ball"],"a":0}]},"listening":{"title":"Buying new boots","theme":"life","lines":[["Assistant","Hi there! Are you looking for anything in particular?"],["Customer","Yes, indoor shoes for refereeing. I've been shopping around, and your prices seem the most reasonable."],["Assistant","These are our best ones. They're not cheap, but they'll last for years."],["Customer","Hmm, a hundred and forty euros. Normally I'd say that's a rip-off, but my old ones are falling apart."],["Assistant","Then it might be worth splashing out. Unfortunately, size thirty-eight is out of stock until Monday."],["Customer","Could you order them for me? I'd rather wait than make another impulse buy I'll regret."],["Assistant","Of course. I'll call you as soon as they arrive."]],"q":[{"q":"What has the customer been doing?","o":["Comparing prices in different shops","Reading reviews","Waiting for a sale"],"a":0},{"q":"What is the problem with size 38?","o":["It's too expensive","It's out of stock","It's the wrong colour"],"a":1},{"q":"Why does the customer prefer to wait?","o":["She doesn't want another impulse buy","She has no money today","She wants a discount"],"a":0}]}},{"title":"Time & timeouts · В кафе","futsal":[{"en":"period","ru":"тайм (период игры)","ex":"The match lasts for two equal periods of 20 minutes."},{"en":"timeout","ru":"тайм-аут","ex":"Each team is entitled to a one-minute timeout in each period."},{"en":"half-time interval","ru":"перерыв между таймами","ex":"The half-time interval must not exceed 15 minutes."},{"en":"extra time","ru":"дополнительное время","ex":"Extra time consists of two periods of five minutes."},{"en":"acoustic signal","ru":"звуковой сигнал (сирена)","ex":"The period ends when the acoustic signal sounds."}],"life":[{"en":"to be peckish","ru":"слегка проголодаться","ex":"I'm a bit peckish — shall we get a snack?"},{"en":"It's on me","ru":"Я угощаю","ex":"Put your wallet away — dinner's on me tonight."},{"en":"to go Dutch","ru":"платить каждый за себя","ex":"On our first date we went Dutch."},{"en":"an acquired taste","ru":"вкус, к которому надо привыкнуть","ex":"Blue cheese is an acquired taste."},{"en":"to grab a bite (to eat)","ru":"перекусить на скорую руку","ex":"Let's grab a bite to eat after the match."}],"grammar":{"title":"Conditionals 0 & 1 (If ...)","explain":"<p><b>Zero conditional</b> — всегда верно, правила, законы: <b>If + Present, Present</b>.</p>\n<p class=\"ex\">If the ball <b>hits</b> the ceiling, play <b>restarts</b> with a kick-in.</p>\n<p><b>First conditional</b> — реальная ситуация в будущем: <b>If + Present, will + V</b>.</p>\n<p class=\"ex\">If you <b>argue</b> with the referee, he <b>will show</b> you a yellow card.</p>\n<p>⚠️ После <b>if</b> не ставим will: <s>If it will rain</s> → If it <b>rains</b>, we <b>will</b> stay at home.</p>\n<p><b>unless</b> = if ... not: <i>Unless you hurry, you'll miss the bus.</i></p>","ex":[{"q":"If a team ___ a goal, the other team takes the kick-off.","o":["scores","will score","scored"],"a":0,"why":"Правило → zero conditional, Present в обеих частях."},{"q":"If I finish work early, I ___ you at the café.","o":["meet","will meet","met"],"a":1,"why":"Реальное будущее → will в главной части."},{"q":"If it ___ tomorrow, the match will be indoors anyway.","o":["will rain","rains","rained"],"a":1,"why":"После if — Present Simple, не will."},{"q":"___ the kick-in is taken within four seconds, the ball goes to the opponents.","o":["If","Unless","When"],"a":1,"why":"Unless = if not: если НЕ выполнен за 4 секунды."},{"q":"The period ends when the acoustic signal ___.","o":["sounds","will sound","sounded"],"a":0,"why":"После when (во временных придаточных) — Present."}]},"reading":{"title":"Law 7 — Duration of the Match","text":["A futsal match has two equal periods of 20 minutes. This is playing time, not real time: the timekeeper stops the chronometer whenever the ball is out of play. That's why a futsal match usually takes much longer than 40 minutes.","Each period ends when the timekeeper's acoustic signal sounds, even if the referees do not blow their whistle. There is one exception: if a penalty kick or a free kick for the sixth accumulated foul is awarded just before the end, the period continues until the kick is completed.","Each team can ask for a one-minute timeout in each period. A team official asks the third referee or the timekeeper, and the timeout is given when that team has the ball and the ball is out of play. A team that doesn't use its timeout in the first period still has only one in the second. There are no timeouts in extra time.","The half-time interval must not be longer than 15 minutes."],"q":[{"q":"Why is a futsal match longer than 40 minutes in real time?","o":["Because of extra time","Because the clock stops when the ball is out of play","Because of long timeouts"],"a":1},{"q":"If a team doesn't use its timeout in the first period, how many can it have in the second?","o":["Two","One","None"],"a":1},{"q":"When is a timeout given?","o":["At any moment","When the requesting team has the ball and it's out of play","Only after a goal"],"a":1}]},"listening":{"title":"Timeout request","theme":"futsal","lines":[["Coach","Excuse me! We'd like a timeout, please."],["Third referee","OK, but I can only give it when your team has the ball and the ball is out of play."],["Coach","Yes, I know. Our goalkeeper has the ball now — he's going to take a goal clearance."],["Third referee","Right. Timekeeper, timeout for the blue team!"],["Timekeeper","Signal given. One minute starts now."],["Third referee","Coach, remember: you can't give instructions on the pitch, and no substitutions until the timeout ends."],["Coach","Understood. Thanks."]],"q":[{"q":"Why can the timeout be given now?","o":["The blue team has scored","The blue team's goalkeeper is taking a goal clearance","The half is over"],"a":1},{"q":"How long is the timeout?","o":["30 seconds","One minute","Two minutes"],"a":1},{"q":"What is the coach NOT allowed to do?","o":["Talk to players off the pitch","Give instructions on the pitch","Sit on the bench"],"a":1}]}},{"title":"Start & restart · Путешествия","futsal":[{"en":"kick-off","ru":"начальный удар (с центра)","ex":"After a goal, the kick-off is taken by the other team."},{"en":"centre mark","ru":"центральная отметка","ex":"The ball must be stationary on the centre mark."},{"en":"toss a coin","ru":"подбросить монету (жеребьёвка)","ex":"The referee tosses a coin before the match."},{"en":"dropped ball","ru":"спорный мяч","ex":"Play restarts with a dropped ball after an injury."},{"en":"restart (of play)","ru":"возобновление игры","ex":"A kick-in is one of the restarts of play."}],"life":[{"en":"to get around","ru":"передвигаться (по городу, стране)","ex":"The easiest way to get around Lisbon is by tram."},{"en":"off the beaten track","ru":"вдали от туристических маршрутов","ex":"We found a lovely village off the beaten track."},{"en":"a layover","ru":"пересадка, стыковка (в аэропорту)","ex":"I have a three-hour layover in Frankfurt."},{"en":"jet lag","ru":"джетлаг, смена часовых поясов","ex":"I still have jet lag after the flight to Brazil."},{"en":"to set off","ru":"отправиться в путь","ex":"We set off early to avoid the traffic."}],"grammar":{"title":"Past Continuous vs Past Simple","explain":"<p><b>Past Continuous</b> (was/were + -ing) — процесс в прошлом, «фон».</p>\n<p><b>Past Simple</b> — короткое событие, которое произошло на фоне или прервало процесс.</p>\n<p class=\"ex\">The striker <b>was running</b> towards the goal <b>when</b> the defender <b>tripped</b> him.</p>\n<p class=\"ex\"><b>While</b> I <b>was waiting</b> at the airport, I <b>met</b> an old friend.</p>\n<p><b>when</b> + короткое действие; <b>while</b> + длительный процесс.</p>","ex":[{"q":"The goalkeeper ___ the ball when the opponent kicked it.","o":["was releasing","released","releases"],"a":0,"why":"Процесс прерван другим действием → Past Continuous."},{"q":"While we ___ for the bus, it started to rain.","o":["waited","were waiting","are waiting"],"a":1,"why":"while + длительный процесс → were waiting."},{"q":"I ___ my phone while I was running to the gate.","o":["was dropping","dropped","drop"],"a":1,"why":"Короткое событие → Past Simple."},{"q":"What ___ you doing at 8 pm yesterday?","o":["were","did","was"],"a":0,"why":"Процесс в конкретный момент → were you doing."},{"q":"The players ___ when the referee blew the whistle.","o":["were arguing","argue","have argued"],"a":0,"why":"Фон в прошлом → Past Continuous."}]},"reading":{"title":"Law 8 — Start and Restart of Play","text":["Before the match, the referee tosses a coin. The team that wins the toss decides whether to take the kick-off in the first or the second period. In the second period the teams change ends.","At the kick-off, the ball must be stationary on the centre mark, and all players must be in their own half. The opponents must be at least 3 metres from the ball. The ball is in play when it is kicked and clearly moves. A goal can be scored directly from the kick-off against the opponents.","Sometimes the referees stop play without any offence — for example, because a player is injured. Then play restarts with a dropped ball. The ball is dropped for one player of the team that had the ball, or would have got it. All other players must be at least 2 metres away. The ball is in play when it touches the floor."],"q":[{"q":"How far must the opponents be at the kick-off?","o":["2 m","3 m","5 m"],"a":1},{"q":"When is a dropped ball used?","o":["After a foul","When play is stopped without an offence","After a goal"],"a":1},{"q":"When is a dropped ball in play?","o":["When it touches the floor","When a player kicks it","When the referee whistles"],"a":0}]},"listening":{"title":"Planning a trip","theme":"life","lines":[["Agent","So, you're flying to Lisbon for the tournament. There's no direct flight, I'm afraid — you'll have a layover in Madrid."],["Passenger","How long is the layover?"],["Agent","About two hours. Your flight sets off at six fifteen in the morning."],["Passenger","That's early! Still, at least there's no time difference, so no jet lag."],["Agent","True. Have you thought about how you'll get around in Lisbon?"],["Passenger","Mostly by tram, I think. And after the tournament I'd love to see something off the beaten track."],["Agent","Then visit the fishing villages on the coast. Very few tourists go there."]],"q":[{"q":"Where is the layover?","o":["Lisbon","Madrid","Porto"],"a":1},{"q":"Why won't the passenger have jet lag?","o":["The flight is short","There's no time difference","She will sleep on the plane"],"a":1},{"q":"What does the agent recommend?","o":["Fishing villages on the coast","The city centre","A boat trip"],"a":0}]}},{"title":"Ball in & out · Здоровье","futsal":[{"en":"out of play","ru":"мяч вне игры (не в игре)","ex":"The ball is out of play when it hits the ceiling."},{"en":"wholly passed over","ru":"полностью пересёк (линию)","ex":"The ball is out only when it has wholly passed over the touchline."},{"en":"kick-in","ru":"удар с боковой линии (ввод мяча ногой)","ex":"A kick-in is awarded to the opponents of the player who last touched the ball."},{"en":"ceiling","ru":"потолок","ex":"If the ball hits the ceiling, the opponents take a kick-in."},{"en":"rebound","ru":"отскок / отскакивать","ex":"The ball rebounded off the goalpost and stayed in play."}],"life":[{"en":"to come down with","ru":"заболеть (чем-то), слечь с","ex":"I think I'm coming down with a cold."},{"en":"to be run-down","ru":"быть измотанным, ослабленным","ex":"You look run-down — you need some rest."},{"en":"to be on the mend","ru":"идти на поправку","ex":"She was ill last week, but she's on the mend now."},{"en":"to pull a muscle","ru":"потянуть мышцу","ex":"He pulled a muscle during the sprint test."},{"en":"to shake off (an illness)","ru":"избавиться от (болезни), побороть","ex":"I can't shake off this cough."}],"grammar":{"title":"Future: will, be going to, Present Continuous","explain":"<p><b>will</b> — спонтанное решение, обещание, предсказание-мнение.</p>\n<p class=\"ex\">I'm thirsty. — I<b>'ll</b> get you some water. I think it <b>will</b> be a difficult match.</p>\n<p><b>be going to</b> — заранее принятое намерение или предсказание по признакам.</p>\n<p class=\"ex\">I<b>'m going to</b> study English every day. Look at those clouds — it<b>'s going to</b> rain.</p>\n<p><b>Present Continuous</b> — договорённости, планы с конкретным временем.</p>\n<p class=\"ex\">I<b>'m refereeing</b> a match on Saturday at 6 pm.</p>","ex":[{"q":"— The phone is ringing. — OK, I ___ it.","o":["'m going to answer","'ll answer","answer"],"a":1,"why":"Решение принято в момент речи → will."},{"q":"I've decided: I ___ take the referee exam next year.","o":["will","am going to","am taking to"],"a":1,"why":"Заранее принятое решение → be going to."},{"q":"I ___ the doctor at 10 tomorrow. I made an appointment.","o":["'m seeing","see","will to see"],"a":0,"why":"Договорённость с временем → Present Continuous."},{"q":"The striker is completely alone in front of the goal. He ___ score!","o":["is going to","will to","goes"],"a":0,"why":"Предсказание по очевидным признакам → going to."},{"q":"Don't worry, I promise I ___ be late.","o":["won't","am not going","don't"],"a":0,"why":"Обещание → will / won't."}]},"reading":{"title":"Law 9 — Ball In and Out of Play","text":["The ball is out of play when it has wholly passed over the touchline or the end line, on the floor or in the air. If only part of the ball is over the line, the ball is still in play. The ball is also out of play when the referees stop play, or when it hits the ceiling.","If the ball hits the ceiling, play restarts with a kick-in for the opponents of the team that last touched it. The kick-in is taken from the touchline, at the point nearest to where the ball hit the ceiling.","The ball stays in play if it rebounds off a goalpost or the crossbar and remains on the pitch. It is also normally in play when it touches a referee. But if it touches a match official and then a team starts a promising attack, the ball goes directly into the goal, or the other team gets possession, play is stopped and restarted with a dropped ball."],"q":[{"q":"Half of the ball is over the touchline. Is it out of play?","o":["Yes","No"],"a":1},{"q":"What happens if the ball hits the ceiling?","o":["A dropped ball","A kick-in for the opponents","A goal clearance"],"a":1},{"q":"The ball hits a referee and goes directly into the goal. What is the restart?","o":["Goal","Dropped ball","Kick-off"],"a":1}]},"listening":{"title":"At the doctor's","theme":"life","lines":[["Doctor","Good morning. What seems to be the problem?"],["Patient","I think I'm coming down with something. I've felt run-down all week, and now I have a sore throat."],["Doctor","Let me have a look... It's a viral infection. Have you been under a lot of stress recently?"],["Patient","Yes, three tournaments in a row. And I pulled a muscle in my leg last weekend."],["Doctor","That explains it. Your body needs time to recover. No refereeing for at least a week."],["Patient","A week? But I've got a match on Saturday."],["Doctor","If you rest now, you'll shake it off quickly. If not, you'll be ill for a month. Come back on Friday — I'm sure you'll be on the mend by then."]],"q":[{"q":"How has the patient felt all week?","o":["Run-down","Over the moon","Hungry"],"a":0},{"q":"What happened last weekend?","o":["She caught a cold","She pulled a muscle","She missed a match"],"a":1},{"q":"What does the doctor advise?","o":["Referee on Saturday","Rest for at least a week","Go to hospital"],"a":1}]}},{"title":"Direct fouls · Чувства","futsal":[{"en":"to trip","ru":"поставить подножку","ex":"The defender tripped the attacker near the halfway line."},{"en":"to push","ru":"толкать","ex":"Pushing an opponent is a direct free kick offence."},{"en":"to charge","ru":"атаковать корпусом (плечом)","ex":"A player may fairly charge an opponent when the ball is within playing distance."},{"en":"to hold","ru":"держать, задерживать (соперника)","ex":"Holding an opponent's shirt is a foul."},{"en":"direct free kick","ru":"штрафной удар","ex":"A goal can be scored directly from a direct free kick."}],"life":[{"en":"to be over the moon","ru":"быть на седьмом небе от счастья","ex":"She was over the moon when she got the final."},{"en":"to be at your wits' end","ru":"быть в полном отчаянии, не знать, что делать","ex":"I'm at my wits' end with this noisy neighbour."},{"en":"overwhelmed","ru":"переполненный (эмоциями), перегруженный","ex":"I felt overwhelmed by all the new information."},{"en":"to get on someone's nerves","ru":"действовать на нервы","ex":"His constant complaining gets on my nerves."},{"en":"to keep your cool","ru":"сохранять хладнокровие","ex":"A good referee keeps her cool when players shout."}],"grammar":{"title":"Relative clauses: who, which, that, where, whose","explain":"<p>Придаточные определительные помогают описать человека, предмет или место.</p>\n<p><b>who</b> — для людей: <i>A player <b>who</b> is sent off must leave the technical area.</i></p>\n<p><b>which</b> — для предметов: <i>A foul <b>which</b> is penalised with a direct free kick counts as an accumulated foul.</i></p>\n<p><b>that</b> — для людей и предметов (в разговорной речи).</p>\n<p><b>where</b> — для мест: <i>This is the hall <b>where</b> I refereed my first match.</i></p>\n<p><b>whose</b> — чей: <i>The player <b>whose</b> number is 7 was cautioned.</i></p>","ex":[{"q":"The referee ___ controlled the final was from Spain.","o":["which","who","where"],"a":1,"why":"Человек → who."},{"q":"This is the sports hall ___ we train.","o":["which","where","who"],"a":1,"why":"Место, где что-то происходит → where."},{"q":"A kick ___ is taken from the touchline is called a kick-in.","o":["which","who","whose"],"a":0,"why":"Предмет/действие → which (или that)."},{"q":"The player ___ shirt was torn changed it at half-time.","o":["who","whose","which"],"a":1,"why":"Чья футболка → whose."},{"q":"I have a friend ___ speaks four languages.","o":["that","where","which"],"a":0,"why":"Человек → who/that."}]},"reading":{"title":"Law 12 — Direct Free Kick Offences","text":["A direct free kick is given when a player commits certain offences against an opponent in a careless or reckless way, or using excessive force. These offences are: charging, jumping at, kicking, pushing, striking, tackling and tripping an opponent — or trying to kick, strike or trip them.","A direct free kick is also given for a deliberate handball, for holding an opponent, for impeding an opponent with contact, for biting or spitting, and for throwing an object at the ball, an opponent or a match official.","If any of these offences happens inside the offender's own penalty area, a penalty kick is awarded instead.","All these offences are accumulated fouls. The third referee records them for each team in each period, and they become very important from the sixth foul."],"q":[{"q":"A defender pushes an attacker inside his own penalty area. What is the restart?","o":["Direct free kick","Penalty kick","Indirect free kick"],"a":1},{"q":"Which of these is a direct free kick offence?","o":["Holding an opponent","Dissent","Playing in a dangerous manner"],"a":0},{"q":"Who records accumulated fouls?","o":["The timekeeper","The coach","The third referee"],"a":2}]},"listening":{"title":"Explaining a decision","theme":"futsal","lines":[["Captain","Referee, why a free kick? I played the ball!"],["Referee","You touched the ball, yes, but then you tripped number nine."],["Captain","But it was an accident!"],["Referee","I know. That's why it's careless, not reckless, so there's no card. But it's still a foul."],["Captain","OK... And how many fouls do we have now?"],["Referee","That was your fourth accumulated foul. Be careful — from the sixth one it's a free kick without a wall."],["Captain","Got it. I'll tell my players. Thanks."]],"q":[{"q":"What did the captain do?","o":["Pushed number nine","Tripped number nine","Held number nine"],"a":1},{"q":"Why is there no card?","o":["Because the foul was careless","Because it was the first foul","Because the captain apologised"],"a":0},{"q":"How many accumulated fouls does the team have now?","o":["Three","Four","Six"],"a":1}]}},{"title":"Careless, reckless · Мнения","futsal":[{"en":"careless","ru":"неосторожный (без санкции)","ex":"A careless tackle is a foul, but no card is needed."},{"en":"reckless","ru":"безрассудный (жёлтая карточка)","ex":"A reckless challenge must be cautioned."},{"en":"excessive force","ru":"чрезмерная сила (красная карточка)","ex":"Using excessive force is a sending-off offence."},{"en":"to endanger the safety","ru":"угрожать безопасности","ex":"The tackle endangered the safety of the opponent."},{"en":"challenge","ru":"единоборство, попытка отбора мяча","ex":"It was a fair challenge for the ball."}],"life":[{"en":"to see eye to eye (with)","ru":"сходиться во мнениях","ex":"The coaches don't always see eye to eye."},{"en":"As far as I'm concerned, ...","ru":"Что касается меня, ... / По-моему, ...","ex":"As far as I'm concerned, it was a clear penalty."},{"en":"That's a fair point","ru":"Справедливое замечание","ex":"That's a fair point, but there was no contact."},{"en":"to play devil's advocate","ru":"играть роль «адвоката дьявола»","ex":"Let me play devil's advocate: what if he didn't see the ball?"},{"en":"I beg to differ","ru":"Позволю себе не согласиться","ex":"You think it was a yellow card? I beg to differ."}],"grammar":{"title":"Comparatives and superlatives","explain":"<p><b>Короткие прилагательные</b>: -er / the -est: <i>fast → faster → the fastest</i>.</p>\n<p><b>Длинные</b>: more / the most: <i>dangerous → more dangerous → the most dangerous</i>.</p>\n<p><b>Исключения</b>: good → better → the best; bad → worse → the worst; far → further → the furthest.</p>\n<p class=\"ex\">A reckless tackle is <b>more serious than</b> a careless one. Excessive force is <b>the most serious</b>.</p>\n<p><b>as ... as</b> — такой же как: <i>Futsal is not <b>as</b> big <b>as</b> football.</i></p>","ex":[{"q":"A futsal pitch is ___ than a football pitch.","o":["smaller","more small","smallest"],"a":0,"why":"small — короткое → smaller."},{"q":"Serious foul play is ___ offence in this list.","o":["the most serious","the seriousest","more serious"],"a":0,"why":"Длинное прилагательное → the most serious."},{"q":"My English is ___ than last year.","o":["more good","better","best"],"a":1,"why":"good → better (исключение)."},{"q":"This match was ___ match of the season.","o":["the worst","the baddest","worse"],"a":0,"why":"bad → worse → the worst."},{"q":"The second half was not as exciting ___ the first.","o":["than","as","like"],"a":1,"why":"Конструкция as ... as."}]},"reading":{"title":"Careless, reckless, excessive force","text":["When a player commits a foul, the referees must decide how serious it is. The Laws use three levels.","Careless means the player didn't pay enough attention or wasn't careful when challenging an opponent. It's a foul, but no disciplinary sanction is needed.","Reckless means the player ignored the danger to the opponent or the possible consequences. A player who commits a reckless foul must be cautioned and shown a yellow card.","Using excessive force means the player used much more force than necessary and endangered the safety of the opponent. This player must be sent off with a red card.","So, the same type of foul — for example, a tackle — can lead to no card, a yellow card or a red card. It depends on how it was done."],"q":[{"q":"What sanction is given for a careless foul?","o":["No card","Yellow card","Red card"],"a":0},{"q":"A player ignores the danger to the opponent. What is this?","o":["Careless","Reckless","Excessive force"],"a":1},{"q":"What is the main idea of the text?","o":["All tackles are red cards","The sanction depends on how the foul was done","Careless fouls are not fouls"],"a":1}]},"listening":{"title":"Arguing about a decision","theme":"life","lines":[["Leo","Did you watch the final? As far as I'm concerned, that red card was a terrible decision."],["Mia","I beg to differ. He went into the tackle with both feet. That's excessive force."],["Leo","That's a fair point, but he did touch the ball first."],["Mia","It doesn't matter if you endanger the safety of an opponent."],["Leo","OK, let me play devil's advocate. What if the other player had jumped into the tackle?"],["Mia","Then it would be different. But I watched the replay three times."],["Leo","Well, I suppose we'll never see eye to eye on this one!"]],"q":[{"q":"What does Mia think of the red card?","o":["It was correct","It was wrong","She didn't see it"],"a":0},{"q":"Which point does Leo accept as fair?","o":["The tackle was dangerous","The player touched the ball first","The referee was far away"],"a":1},{"q":"How does the conversation end?","o":["Leo agrees with Mia","They still disagree","Mia changes her mind"],"a":1}]}},{"title":"Cards · Телефон и сообщения","futsal":[{"en":"caution","ru":"предупреждение (жёлтая карточка) / предупредить","ex":"The player was cautioned for unsporting behaviour."},{"en":"sending-off","ru":"удаление (красная карточка)","ex":"A second caution in the same match leads to a sending-off."},{"en":"to be sent off","ru":"быть удалённым","ex":"He was sent off for violent conduct."},{"en":"dissent","ru":"несогласие с решением (протест)","ex":"Dissent by word or action is punished with a yellow card."},{"en":"unsporting behaviour","ru":"неспортивное поведение","ex":"Removing the shirt after a goal is unsporting behaviour."}],"life":[{"en":"to get through (to)","ru":"дозвониться (до)","ex":"I tried calling the office, but I couldn't get through."},{"en":"to keep someone posted","ru":"держать в курсе","ex":"Keep me posted about the match schedule."},{"en":"to get the wrong end of the stick","ru":"неправильно понять","ex":"I think you got the wrong end of the stick — I wasn't criticising you."},{"en":"to follow up (on)","ru":"вернуться к вопросу, проконтролировать","ex":"I'll follow up on your request tomorrow."},{"en":"to touch base (with)","ru":"связаться, свериться (кратко)","ex":"Let's touch base after the meeting."}],"grammar":{"title":"Gerund vs infinitive","explain":"<p>После одних глаголов идёт <b>-ing</b>, после других — <b>to + V</b>.</p>\n<p><b>-ing</b>: enjoy, avoid, finish, mind, keep, stop, suggest, practise.</p>\n<p class=\"ex\">Avoid <b>arguing</b> with the referee. I enjoy <b>watching</b> futsal.</p>\n<p><b>to + V</b>: want, decide, plan, hope, try, refuse, agree, need.</p>\n<p class=\"ex\">The player refused <b>to leave</b> the pitch. I want <b>to improve</b> my English.</p>\n<p>⚠️ <b>stop + -ing</b> = перестать: <i>Stop talking!</i> / <b>stop + to</b> = остановиться, чтобы: <i>He stopped <b>to tie</b> his shoes.</i></p>\n<p>После предлогов — всегда -ing: <i>cautioned <b>for delaying</b> the restart</i>.</p>","ex":[{"q":"The defender kept ___ the referee's decision.","o":["to question","questioning","question"],"a":1,"why":"keep + -ing."},{"q":"The coach decided ___ a timeout.","o":["to request","requesting","request"],"a":0,"why":"decide + to + V."},{"q":"He was cautioned for ___ the restart.","o":["to delay","delaying","delay"],"a":1,"why":"После предлога for → -ing."},{"q":"Please stop ___ — I'm trying to concentrate.","o":["to talk","talking","talk"],"a":1,"why":"stop + -ing = перестать что-то делать."},{"q":"I hope ___ an international referee one day.","o":["becoming","to become","become"],"a":1,"why":"hope + to + V."}]},"reading":{"title":"Cautions — the yellow card","text":["A yellow card shows a caution, and a red card shows a sending-off. Only players, substitutes and team officials can receive cards.","A player is cautioned for: delaying the restart of play; dissent by word or action; entering or leaving the pitch without permission or in the wrong way during a substitution; not respecting the required distance at a restart; persistent offences; and unsporting behaviour.","Unsporting behaviour includes many situations. For example, trying to deceive the referees by pretending to be fouled — this is called simulation. A player is also cautioned for a reckless foul, for stopping a promising attack with a foul, or for removing the shirt to celebrate a goal.","Two cautions in the same match mean a sending-off."],"q":[{"q":"What is 'simulation'?","o":["Pretending to be fouled","Delaying a restart","Leaving the pitch without permission"],"a":0},{"q":"Which of these leads to a caution?","o":["Removing the shirt after a goal","A careless trip","A goal clearance"],"a":0},{"q":"What happens after two cautions in one match?","o":["Nothing","A two-minute break","A sending-off"],"a":2}]},"listening":{"title":"A misunderstanding","theme":"life","lines":[["Sara","Hi Dan, finally! I've been trying to get through to you all morning."],["Dan","Sorry, I was in meetings. Look, about your email — I think you got the wrong end of the stick."],["Sara","Really? It sounded like you were unhappy with my report."],["Dan","Not at all! I just wanted to follow up on a couple of figures. The report is great."],["Sara","Oh, what a relief. I'll check the figures today."],["Dan","Thanks. And keep me posted about the client meeting, OK?"],["Sara","Sure. Let's touch base again on Thursday."]],"q":[{"q":"Why couldn't Sara get through to Dan?","o":["His phone was off","He was in meetings","He was on holiday"],"a":1},{"q":"What did Sara misunderstand?","o":["She thought Dan was unhappy with her report","She thought the meeting was cancelled","She thought she had a new client"],"a":0},{"q":"When will they talk again?","o":["Tomorrow","On Thursday","Next week"],"a":1}]}},{"title":"Red cards · Деньги","futsal":[{"en":"serious foul play","ru":"грубая игра (серьёзное нарушение)","ex":"A tackle with excessive force is serious foul play."},{"en":"violent conduct","ru":"агрессивное поведение","ex":"Hitting an opponent off the ball is violent conduct."},{"en":"simulation","ru":"симуляция","ex":"He fell without contact — that's simulation."},{"en":"persistent offences","ru":"систематические нарушения","ex":"The player was cautioned for persistent offences."},{"en":"offensive, insulting or abusive language","ru":"оскорбительные выражения","ex":"Using abusive language is punished with a red card."}],"life":[{"en":"to make ends meet","ru":"сводить концы с концами","ex":"Many students work two jobs to make ends meet."},{"en":"to be broke","ru":"быть на мели, без денег","ex":"I can't come out tonight — I'm broke until payday."},{"en":"to cut back on","ru":"сокращать (расходы, потребление)","ex":"We need to cut back on eating out."},{"en":"to cost an arm and a leg","ru":"стоить целое состояние","ex":"Tickets for the final cost an arm and a leg."},{"en":"to pay off (a loan)","ru":"выплатить (кредит, долг)","ex":"It took them ten years to pay off the mortgage."}],"grammar":{"title":"Second conditional (If I were ...)","explain":"<p><b>Second conditional</b> — нереальная или маловероятная ситуация в настоящем/будущем: <b>If + Past Simple, would + V</b>.</p>\n<p class=\"ex\">If I <b>had</b> more time, I <b>would study</b> English for two hours a day.</p>\n<p class=\"ex\">If I <b>were</b> the referee, I <b>would show</b> a red card.</p>\n<p>С <b>I/he/she/it</b> в этой конструкции правильно <b>were</b> (was — разговорный вариант).</p>\n<p>Сравните: <i>If it <b>rains</b>, I'<b>ll</b> stay home</i> (реально) / <i>If I <b>won</b> the lottery, I'<b>d</b> travel the world</i> (маловероятно).</p>","ex":[{"q":"If I ___ rich, I would buy a house by the sea.","o":["am","were","will be"],"a":1,"why":"Нереальное настоящее → If I were."},{"q":"If you were the referee, what ___ you do?","o":["will","would","do"],"a":1,"why":"Главная часть → would."},{"q":"I ___ more if I didn't have so much work.","o":["would travel","will travel","travelled"],"a":0,"why":"would + V."},{"q":"If he ___ the rules better, he wouldn't argue so much.","o":["knows","knew","would know"],"a":1,"why":"После if — Past Simple."},{"q":"If it rains tomorrow, we ___ the match indoors. (реальная ситуация)","o":["would play","will play","played"],"a":1,"why":"Реальная ситуация → First conditional (will)."}]},"reading":{"title":"Sending-off offences","text":["A player or substitute is sent off for: serious foul play; violent conduct; biting or spitting at someone; using offensive, insulting or abusive language or gestures; receiving a second caution in the same match; and some situations of denying a goal or an obvious goalscoring opportunity.","Serious foul play is a tackle or challenge for the ball that endangers the safety of an opponent or uses excessive force or brutality.","Violent conduct is different: it is not a challenge for the ball. For example, a player strikes an opponent when the ball is far away, or deliberately hits someone on the head or face.","A player who is sent off must leave the area around the pitch and the technical area. In futsal, the team then plays with one player fewer for two minutes."],"q":[{"q":"What is the difference between serious foul play and violent conduct?","o":["Violent conduct is not a challenge for the ball","Serious foul play is only verbal","There is no difference"],"a":0},{"q":"Which of these is a sending-off offence?","o":["Dissent","A second caution","Delaying the restart"],"a":1},{"q":"Where must a sent-off player go?","o":["To the bench","Away from the pitch and technical area","To the timekeeper's table"],"a":1}]},"listening":{"title":"Red card report","theme":"futsal","lines":[["Referee","Let's write the report for the red card in the second half."],["Second referee","OK. It was number eleven from the white team, at minute thirty-four."],["Referee","Right. The ball was on the other side of the pitch, so it wasn't a challenge for the ball."],["Second referee","Exactly. He hit the opponent in the face with his elbow. I saw it clearly."],["Referee","So the offence is violent conduct, not serious foul play."],["Second referee","Yes. And after the card, he used abusive language towards you, didn't he?"],["Referee","He did. We need to mention that too. The disciplinary committee will decide the punishment."]],"q":[{"q":"Why isn't it serious foul play?","o":["Because it wasn't a challenge for the ball","Because nobody was hurt","Because it was in the first half"],"a":0},{"q":"What did the player do?","o":["Pushed the opponent","Hit the opponent with his elbow","Tripped the opponent"],"a":1},{"q":"Who will decide the final punishment?","o":["The referee","The coach","The disciplinary committee"],"a":2}]}},{"title":"Accumulated fouls · Погода","futsal":[{"en":"accumulated foul","ru":"накопленный (командный) фол","ex":"Every direct free kick offence counts as an accumulated foul."},{"en":"DFKSAF","ru":"штрафной за 6-й и последующие фолы (direct free kick from the sixth accumulated foul)","ex":"The DFKSAF can be taken from the 10 m mark."},{"en":"wall","ru":"стенка","ex":"Defenders can't form a wall at a DFKSAF."},{"en":"advantage","ru":"преимущество (продолжение игры после нарушения)","ex":"The referee played advantage because the attack continued."},{"en":"to apply the advantage","ru":"применить преимущество","ex":"The referees can't apply the advantage after the fifth accumulated foul (unless there is a clear goalscoring chance)."}],"life":[{"en":"to be soaked to the skin","ru":"промокнуть до нитки","ex":"I forgot my umbrella and got soaked to the skin."},{"en":"a heatwave","ru":"аномальная жара","ex":"The tournament was played during a heatwave."},{"en":"to clear up","ru":"проясниться (о погоде)","ex":"It's cloudy now, but it should clear up by the afternoon."},{"en":"to drizzle","ru":"моросить","ex":"It's only drizzling — we don't need a taxi."},{"en":"to be snowed under (with)","ru":"быть заваленным (работой)","ex":"I'm snowed under with paperwork this week."}],"grammar":{"title":"Countable & uncountable: much, many, a few, a little","explain":"<p><b>Исчисляемые</b> (можно посчитать): a foul, two fouls; a player, players.</p>\n<p><b>Неисчисляемые</b>: time, information, advice, equipment, money, water, weather.</p>\n<p><b>many / a few / few</b> — с исчисляемыми: <i>How <b>many</b> fouls? <b>A few</b> players.</i></p>\n<p><b>much / a little / little</b> — с неисчисляемыми: <i>How <b>much</b> time is left? <b>A little</b> water.</i></p>\n<p><b>a lot of</b> — с обоими. <b>a few / a little</b> = немного (достаточно), <b>few / little</b> = мало (недостаточно).</p>\n<p>⚠️ <i>information, advice, equipment</i> — неисчисляемые: <s>an advice</s> → <b>a piece of advice</b>.</p>","ex":[{"q":"How ___ accumulated fouls does the blue team have?","o":["much","many","little"],"a":1,"why":"fouls — исчисляемое → many."},{"q":"How ___ time is left in the first period?","o":["much","many","few"],"a":0,"why":"time — неисчисляемое → much."},{"q":"Can I give you ___?","o":["an advice","a piece of advice","advices"],"a":1,"why":"advice неисчисляемое → a piece of advice."},{"q":"I have ___ friends in London, so I'm not alone there.","o":["a few","a little","much"],"a":0,"why":"friends — исчисляемое, «несколько» → a few."},{"q":"Players must check their ___ before the match.","o":["equipments","equipment","an equipment"],"a":1,"why":"equipment — неисчисляемое, без -s."}]},"reading":{"title":"Law 13 — Accumulated Fouls","text":["Accumulated fouls are all offences that are punished with a direct free kick. Each team's fouls are counted separately in each period, starting from zero. If there is extra time, the fouls from the second period continue to count.","For the first five accumulated fouls, the opponents can form a wall at the free kick. But from the sixth foul in a period, every foul is punished with a special direct free kick — a DFKSAF. Defenders cannot form a wall. Only the goalkeeper defends, and the kicker must try to score directly.","The DFKSAF is taken from the 10 m mark. If the foul happened closer to the goal than 10 m (but outside the penalty area), the team can choose to take it from the place of the foul instead. If the sixth foul happens inside the penalty area, it's a penalty kick.","The referees can play advantage for an accumulated foul only if the team has committed fewer than five fouls before — unless there is a clear goalscoring opportunity."],"q":[{"q":"From which foul is there no wall?","o":["The fifth","The sixth","The tenth"],"a":1},{"q":"Where is the DFKSAF normally taken from?","o":["The penalty mark","The 10 m mark","The halfway line"],"a":1},{"q":"The team's sixth foul happens inside its penalty area. What is given?","o":["DFKSAF","Penalty kick","Indirect free kick"],"a":1}]},"listening":{"title":"Weekend weather","theme":"life","lines":[["Jess","Have you seen the forecast? After last week's heatwave, it's going to pour all weekend."],["Rob","I know. I got soaked to the skin on my way home yesterday."],["Jess","We wanted to go hiking on Saturday, but I think we'll have to cancel."],["Rob","Not necessarily. The forecast says it'll only drizzle in the morning and clear up by noon."],["Jess","Even so, I'm snowed under with work. I need to prepare for a referee course on Monday."],["Rob","Then let's go next weekend. It's supposed to be sunny."],["Jess","Deal."]],"q":[{"q":"What happened to Rob yesterday?","o":["He got very wet","He got sunburnt","He missed his bus"],"a":0},{"q":"What will the weather be like on Saturday afternoon?","o":["Heavy rain","It should clear up","Snow"],"a":1},{"q":"Why can't Jess go hiking this weekend?","o":["She's ill","She's snowed under with work","She's working at a tournament"],"a":1}]}},{"title":"Free kicks · Друзья","futsal":[{"en":"indirect free kick","ru":"свободный удар","ex":"A goal can't be scored directly from an indirect free kick."},{"en":"four-second count","ru":"отсчёт четырёх секунд","ex":"The referee shows the four-second count with his fingers."},{"en":"quick free kick","ru":"быстро разыгранный штрафной","ex":"The team took a quick free kick before the defenders were ready."},{"en":"stationary","ru":"неподвижный","ex":"The ball must be stationary when the free kick is taken."},{"en":"to retake","ru":"перебить, повторить удар","ex":"The free kick must be retaken."}],"life":[{"en":"to fall out (with)","ru":"поссориться (с)","ex":"They fell out over money."},{"en":"to make up","ru":"помириться","ex":"They argued, but they made up the next day."},{"en":"to keep in touch","ru":"поддерживать связь","ex":"We've kept in touch since the tournament in Spain."},{"en":"to drift apart","ru":"отдалиться друг от друга","ex":"We drifted apart after school."},{"en":"to have someone's back","ru":"прикрывать, поддерживать кого-то","ex":"Don't worry, your second referee has your back."}],"grammar":{"title":"Articles: a / an / the / —","explain":"<p><b>a / an</b> — один из многих, впервые упоминается: <i>The referee awarded <b>a</b> free kick.</i> (an — перед гласным звуком: <b>an</b> indirect free kick, <b>an</b> hour).</p>\n<p><b>the</b> — конкретный, уже известный или единственный: <i><b>The</b> free kick was taken quickly. <b>The</b> referee, <b>the</b> ball, <b>the</b> halfway line.</i></p>\n<p><b>без артикля</b> — общие понятия, неисчисляемые и множественное число в общем смысле, названия видов спорта: <i>I love <b>futsal</b>. <b>Referees</b> must be fit.</i></p>\n<p>Устойчивые: <i>at home, at work, go to bed, in the morning, play futsal</i>.</p>","ex":[{"q":"The referees awarded ___ indirect free kick.","o":["a","an","—"],"a":1,"why":"Перед гласным звуком (indirect) → an."},{"q":"___ ball must be stationary on the centre mark.","o":["A","The","—"],"a":1,"why":"Конкретный мяч матча → the."},{"q":"I play ___ futsal twice a week.","o":["the","a","—"],"a":2,"why":"Виды спорта — без артикля."},{"q":"She's ___ referee. She works in ___ national league.","o":["a / the","the / a","— / the"],"a":0,"why":"Профессия → a; конкретная лига → the."},{"q":"I'll be there in ___ hour.","o":["a","an","the"],"a":1,"why":"hour начинается с гласного звука [aʊ] → an."}]},"reading":{"title":"Law 13 — Free Kicks","text":["There are two types of free kick: direct and indirect. From a direct free kick, a goal can be scored directly against the opponents. From an indirect free kick, a goal counts only if another player touches the ball after the kick. To show an indirect free kick, the referees raise one arm above the head.","At a free kick, the ball must be stationary, and the opponents must be at least 5 metres away until the ball is in play. The ball is in play when it is kicked and clearly moves. The kicker must not touch the ball again until another player has touched it.","The free kick must be taken within four seconds. One of the referees shows the four-second count with their hand. If the kick is not taken in time, an indirect free kick is given to the other team.","An indirect free kick for the attacking team inside the penalty area is taken from the penalty area line, at the point nearest to where the offence happened."],"q":[{"q":"How do the referees show an indirect free kick?","o":["One arm raised above the head","Pointing to the penalty mark","Two whistles"],"a":0},{"q":"How far must the opponents be at a free kick?","o":["3 m","5 m","10 m"],"a":1},{"q":"What happens if the free kick is not taken within four seconds?","o":["It is retaken","An indirect free kick to the other team","A caution"],"a":1}]},"listening":{"title":"Old friends","theme":"life","lines":[["Nina","Do you still keep in touch with Lucy?"],["Ben","Not really. We fell out last year over something silly, and then we just drifted apart."],["Nina","That's a shame. You two used to be inseparable."],["Ben","I know. Honestly, I miss her. She always had my back, especially when things were hard at work."],["Nina","Then why don't you call her? Life's too short."],["Ben","You're right. Maybe it's time to make up."],["Nina","She'll be happy to hear from you, I'm sure."]],"q":[{"q":"What happened between Ben and Lucy?","o":["They fell out and drifted apart","They moved to different cities","They started working together"],"a":0},{"q":"What does Ben miss about Lucy?","o":["Her jokes","She always supported him","Her cooking"],"a":1},{"q":"What does Ben decide?","o":["To forget about Lucy","To call her and make up","To write her a letter"],"a":1}]}},{"title":"Penalty kick · Дом","futsal":[{"en":"penalty kick","ru":"пенальти (6-метровый удар)","ex":"A penalty kick is taken from the penalty mark."},{"en":"to award","ru":"назначить (удар)","ex":"The referee awarded a penalty kick."},{"en":"to back-heel","ru":"ударить пяткой","ex":"Back-heeling is permitted if the ball moves forwards."},{"en":"to face the kicker","ru":"стоять лицом к бьющему","ex":"The goalkeeper must stay on the goal line, facing the kicker."},{"en":"penalty shoot-out","ru":"серия пенальти","ex":"The match was decided by a penalty shoot-out."}],"life":[{"en":"to settle in","ru":"обустроиться, освоиться","ex":"Have you settled in to your new flat yet?"},{"en":"to do up (a flat)","ru":"сделать ремонт","ex":"We're doing up the kitchen this summer."},{"en":"to put up with","ru":"терпеть, мириться с","ex":"I can't put up with the noise any longer."},{"en":"a deposit","ru":"залог, депозит","ex":"The landlord asked for a two-month deposit."},{"en":"to declutter","ru":"расхламить, избавиться от лишнего","ex":"I decluttered my wardrobe and gave away ten bags of clothes."}],"grammar":{"title":"Prepositions of time and place: in, on, at","explain":"<p><b>Время</b>:</p>\n<p><b>at</b> — точное время, праздники: <i>at 7 pm, at half-time, at the weekend (BrE)</i>.</p>\n<p><b>on</b> — дни и даты: <i>on Saturday, on 5 May, on my birthday</i>.</p>\n<p><b>in</b> — месяцы, годы, части дня, периоды: <i>in May, in 2026, in the morning, in the second period</i>.</p>\n<p><b>Место</b>:</p>\n<p><b>at</b> — точка: <i>at the table, at the corner arc, at home</i>. <b>on</b> — поверхность/линия: <i>on the touchline, on the pitch, on the goal line</i>. <b>in</b> — внутри: <i>in the penalty area, in the technical area</i>.</p>","ex":[{"q":"The goalkeeper must stay ___ the goal line.","o":["in","on","at"],"a":1,"why":"Линия → on."},{"q":"The offence happened ___ the penalty area.","o":["in","on","at"],"a":0,"why":"Внутри области → in."},{"q":"The match starts ___ 6:30 ___ Friday.","o":["at / on","in / at","on / in"],"a":0,"why":"Время → at; день недели → on."},{"q":"I was born ___ 1998.","o":["on","at","in"],"a":2,"why":"Год → in."},{"q":"The third referee sits ___ the timekeeper's table.","o":["at","in","on"],"a":0,"why":"Точка, место у стола → at."}]},"reading":{"title":"Law 14 — The Penalty Kick","text":["A penalty kick is awarded when a player commits a direct free kick offence inside their own penalty area. The ball is placed on the penalty mark, 6 metres from the goal.","The kicker must be clearly identified. The defending goalkeeper must stay on the goal line, between the posts, facing the kicker, until the ball is kicked. At the moment of the kick, at least part of one of the goalkeeper's feet must be touching, in line with or behind the goal line.","All other players must be on the pitch, at least 5 metres from the penalty mark, behind it and outside the penalty area.","The kicker must kick the ball forwards; back-heeling is allowed if the ball moves forwards. The kicker cannot touch the ball again until another player has touched it. If a penalty is awarded just before the end of a period, the period continues until the kick is completed."],"q":[{"q":"Where must the goalkeeper stand?","o":["On the goal line, facing the kicker","Anywhere in the penalty area","5 m from the ball"],"a":0},{"q":"Can the kicker back-heel the ball?","o":["Never","Yes, if the ball moves forwards","Only in a shoot-out"],"a":1},{"q":"Where must the other players be?","o":["Inside the penalty area","At least 5 m from the mark, behind it, outside the area","On the halfway line"],"a":1}]},"listening":{"title":"Penalty instructions","theme":"futsal","lines":[["Referee","Number seven, are you taking the penalty?"],["Player","Yes, I am."],["Referee","OK. Wait for my whistle. Goalkeeper, stay on the line until the ball is kicked, please."],["Goalkeeper","Can I move along the line?"],["Referee","Yes, you can move sideways, but don't come off the line, and don't touch the posts or the net."],["Referee","Everybody else — outside the penalty area and five metres behind the ball. Number four, move back, please!"],["Player","Ready."],["Referee","Go ahead."]],"q":[{"q":"What can the goalkeeper do?","o":["Move forward","Move sideways along the line","Hold the crossbar"],"a":1},{"q":"Why does the referee talk to number four?","o":["He is too close","He is the kicker","He is injured"],"a":0},{"q":"When can the kicker take the penalty?","o":["Immediately","After the referee's whistle","After the timekeeper's signal"],"a":1}]}},{"title":"Goalkeeper · Вежливые просьбы","futsal":[{"en":"goal clearance","ru":"ввод мяча вратарём (рукой)","ex":"The goal clearance is thrown or released by the goalkeeper."},{"en":"to release the ball","ru":"выпустить мяч из рук, ввести в игру","ex":"The goalkeeper must release the ball within four seconds."},{"en":"to be in control of the ball","ru":"контролировать мяч","ex":"The goalkeeper can't control the ball in his own half for more than four seconds."},{"en":"deliberately played (back pass)","ru":"намеренно отданный (пас назад)","ex":"The goalkeeper touched the ball again after it was deliberately played back by a team-mate."},{"en":"team-mate","ru":"партнёр по команде","ex":"He passed the ball to a team-mate."}],"life":[{"en":"Would it be possible to ...?","ru":"Можно ли было бы ...? (вежливо)","ex":"Would it be possible to change my seat?"},{"en":"I'd appreciate it if ...","ru":"Я была бы признательна, если ...","ex":"I'd appreciate it if you could reply by Friday."},{"en":"to turn down","ru":"отклонить, отказаться (от предложения)","ex":"She turned down the job offer."},{"en":"to put someone on the spot","ru":"поставить в неловкое положение","ex":"Sorry to put you on the spot, but what's your decision?"},{"en":"No hard feelings","ru":"Без обид","ex":"I voted for the other plan, but no hard feelings!"}],"grammar":{"title":"Reported speech (statements and questions)","explain":"<p>Когда передаём чужие слова, время обычно «сдвигается» на шаг назад:</p>\n<p>Present → Past: <i>\"I <b>am</b> tired.\" → She said (that) she <b>was</b> tired.</i></p>\n<p>Past / Present Perfect → Past Perfect: <i>\"I <b>saw</b> the foul.\" → He said he <b>had seen</b> the foul.</i></p>\n<p>will → would; can → could: <i>\"I <b>will</b> call you.\" → He said he <b>would</b> call me.</i></p>\n<p><b>say</b> (без дополнения) vs <b>tell</b> (+ кому): <i>He <b>said</b> that... / He <b>told me</b> that...</i></p>\n<p>Вопросы — прямой порядок слов: <i>\"Where <b>is</b> the ball?\" → She asked where the ball <b>was</b>.</i></p>","ex":[{"q":"\"I am the captain.\" → He said he ___ the captain.","o":["is","was","were"],"a":1,"why":"am → was."},{"q":"\"I will check the balls.\" → She said she ___ check the balls.","o":["will","would","can"],"a":1,"why":"will → would."},{"q":"The coach ___ me that the team was ready.","o":["said","told","asked"],"a":1,"why":"tell + кому (me)."},{"q":"\"Where is the timekeeper?\" → He asked where the timekeeper ___.","o":["is","was","was is"],"a":1,"why":"Прямой порядок + сдвиг времени."},{"q":"\"I didn't touch the ball.\" → He said he ___ the ball.","o":["hadn't touched","didn't touched","doesn't touch"],"a":0,"why":"Past Simple → Past Perfect."}]},"reading":{"title":"The goalkeeper and the four seconds","text":["In futsal, the goalkeeper has special restrictions. An indirect free kick is given if the goalkeeper controls the ball with the hands, arms or feet in their own half for more than four seconds.","There is also a back-pass rule. After the goalkeeper has played the ball, they cannot touch it again in their own half if a team-mate deliberately plays it back to them, unless an opponent has touched it first. The goalkeeper also cannot touch the ball with the hands inside their penalty area after a team-mate has deliberately kicked it to them.","When the ball goes over the end line after an attacker last touched it, the restart is a goal clearance. In futsal, the goalkeeper throws or releases the ball by hand from anywhere inside the penalty area. The opponents must be outside the penalty area, and the ball must be put into play within four seconds. A goal cannot be scored directly from a goal clearance."],"q":[{"q":"How is a goal clearance taken in futsal?","o":["Kicked from the floor","Thrown or released by hand","Taken by any player"],"a":1},{"q":"What happens if the goalkeeper controls the ball in their own half for more than four seconds?","o":["Penalty kick","Indirect free kick","Corner kick"],"a":1},{"q":"Can a goal be scored directly from a goal clearance?","o":["Yes","No"],"a":1}]},"listening":{"title":"A delicate request","theme":"life","lines":[["Anna","Mr Green, sorry to put you on the spot, but could I ask you a favour?"],["Mr Green","Of course, Anna. What is it?"],["Anna","I've been appointed to a tournament at short notice. Would it be possible for you to water my plants while I'm away?"],["Mr Green","I'd love to h
