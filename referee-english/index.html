elp, but I'm going to my daughter's next week. I'm afraid I'll have to turn you down this time."],["Anna","No problem at all — no hard feelings! I'll ask the neighbours downstairs."],["Mr Green","Actually, my son is staying here. I'd appreciate it if you left the key with him."],["Anna","Perfect. Thank you so much!"]],"q":[{"q":"Why is Anna going away?","o":["A holiday","A tournament at short notice","A family visit"],"a":1},{"q":"Why does Mr Green turn her down?","o":["He doesn't like plants","He's going to his daughter's","He's ill"],"a":1},{"q":"Who will help in the end?","o":["The neighbours downstairs","Mr Green's son","Anna's friend"],"a":1}]}},{"title":"Corners & kick-ins · Время","futsal":[{"en":"corner kick","ru":"угловой удар","ex":"A corner kick is awarded when a defender last touched the ball before it crossed the end line."},{"en":"corner area","ru":"угловой сектор","ex":"The ball must be placed in the corner area."},{"en":"attacking team","ru":"атакующая команда","ex":"The corner kick is taken by a player of the attacking team."},{"en":"defending team","ru":"обороняющаяся команда","ex":"Players of the defending team must be 5 m from the corner arc."},{"en":"to encroach","ru":"нарушить дистанцию, подойти ближе положенного","ex":"The defender encroached at the kick-in and was cautioned."}],"life":[{"en":"in the long run","ru":"в долгосрочной перспективе","ex":"Daily practice pays off in the long run."},{"en":"for the time being","ru":"пока что, на данный момент","ex":"For the time being, I'm staying with my parents."},{"en":"at short notice","ru":"в последний момент, без предупреждения","ex":"I was appointed to the match at short notice."},{"en":"in the nick of time","ru":"в самый последний момент","ex":"We arrived in the nick of time — the doors were closing."},{"en":"to make up for lost time","ru":"наверстать упущенное","ex":"After the injury, she trained hard to make up for lost time."}],"grammar":{"title":"Passive with modals and in the past","explain":"<p><b>Модальный + be + V3</b> — очень частая конструкция в правилах:</p>\n<p class=\"ex\">The ball <b>must be placed</b> in the corner area. A goal <b>can be scored</b> directly. The player <b>must be sent off</b>.</p>\n<p><b>Past Simple Passive</b> = was/were + V3:</p>\n<p class=\"ex\">The player <b>was cautioned</b> in the first half. Two penalties <b>were awarded</b>.</p>\n<p><b>Present Perfect Passive</b> = has/have been + V3:</p>\n<p class=\"ex\">The match <b>has been suspended</b>.</p>","ex":[{"q":"A goal can ___ directly from a corner kick.","o":["score","be scored","been scored"],"a":1,"why":"can + be + V3."},{"q":"The player ___ off for violent conduct yesterday.","o":["was sent","is sent","sent"],"a":0,"why":"yesterday → was + V3."},{"q":"The kick-in must ___ within four seconds.","o":["take","be taken","taken"],"a":1,"why":"must + be + V3."},{"q":"Three yellow cards ___ so far.","o":["have been shown","were show","have shown"],"a":0,"why":"so far → Present Perfect Passive."},{"q":"The match ___ because of a leak in the roof.","o":["was suspended","suspended","was suspend"],"a":0,"why":"Матч приостановили → was + V3."}]},"reading":{"title":"Laws 15 & 17 — Kick-In and Corner Kick","text":["When the whole ball passes over the touchline, or hits the ceiling, the opponents of the player who last touched it get a kick-in. The ball must be stationary on the touchline, and the opponents must stand at least 5 metres away. The ball must be put into play within four seconds; if not, the kick-in goes to the other team. A goal cannot be scored directly from a kick-in.","When the whole ball passes over the end line and a defender touched it last, the attacking team gets a corner kick. The ball is placed in the corner area nearest to where it went out. Opponents must stay at least 5 metres from the corner arc.","A corner kick must also be taken within four seconds. If it isn't, or if any other offence happens, a goal clearance is awarded to the defending team. A goal can be scored directly from a corner kick, but only against the opponents."],"q":[{"q":"Can a goal be scored directly from a kick-in?","o":["Yes","No"],"a":1},{"q":"What happens if a corner kick is not taken within four seconds?","o":["Kick-in","Goal clearance to the defending team","Retake"],"a":1},{"q":"How far must the opponents be at a kick-in?","o":["3 m","5 m","6 m"],"a":1}]},"listening":{"title":"Running late","theme":"life","lines":[["Ben","Hi, it's me. The bus broke down, so I'm walking. I'll be there in about fifteen minutes."],["Ella","Don't worry, the film doesn't start until eight. You'll make it."],["Ben","I hope so. For the time being, I'm just trying not to get lost!"],["Ella","Ha-ha. Last time we arrived in the nick of time, remember?"],["Ben","How could I forget? Listen, I'm sorry I've been so busy lately. I'll make up for lost time, I promise."],["Ella","I know. In the long run, the new job will be worth it."],["Ben","Thanks for being so patient. See you soon!"]],"q":[{"q":"Why is Ben walking?","o":["The bus broke down","He likes walking","He missed the train"],"a":0},{"q":"What happened last time?","o":["They missed the film","They arrived at the last moment","They went to the wrong cinema"],"a":1},{"q":"What does Ella say about Ben's new job?","o":["It's a mistake","It will be worth it in the long run","It's too far away"],"a":1}]}},{"title":"DOGSO & handball · Спорт и фитнес","futsal":[{"en":"obvious goalscoring opportunity","ru":"явная возможность забить гол","ex":"He denied an obvious goalscoring opportunity and was sent off."},{"en":"to deny","ru":"лишить, помешать","ex":"Denying a goal with a deliberate handball is a red card."},{"en":"promising attack","ru":"перспективная атака","ex":"Stopping a promising attack with a foul is a yellow card."},{"en":"handball offence","ru":"игра рукой (нарушение)","ex":"Not every touch of the hand is a handball offence."},{"en":"unguarded goal","ru":"пустые (незащищённые) ворота","ex":"The goal was unguarded because the goalkeeper was outside the area."}],"life":[{"en":"to get back in shape","ru":"вернуться в форму","ex":"I'm trying to get back in shape after the holidays."},{"en":"stamina","ru":"выносливость","ex":"Futsal referees need a lot of stamina."},{"en":"to push yourself","ru":"выкладываться, заставлять себя","ex":"Don't push yourself too hard on the first day."},{"en":"to be sore","ru":"болеть, ныть (о мышцах)","ex":"My legs are sore after yesterday's training."},{"en":"to take it easy","ru":"не перенапрягаться, расслабиться","ex":"Take it easy for a few days after the test."}],"grammar":{"title":"Linking words: although, however, unless, until, as long as","explain":"<p>Эти слова постоянно встречаются в правилах — без них не понять смысл!</p>\n<p><b>although</b> — хотя: <i><b>Although</b> he touched the ball, it was a foul.</i></p>\n<p><b>however</b> — однако (начинает новое предложение): <i>Substitutions are unlimited. <b>However</b>, they are not allowed during a timeout.</i></p>\n<p><b>unless</b> — если не, кроме случая: <i>No advantage after five fouls, <b>unless</b> there is a clear chance to score.</i></p>\n<p><b>until</b> — до тех пор пока (не): <i>Opponents stay 5 m away <b>until</b> the ball is in play.</i></p>\n<p><b>as long as / provided that</b> — при условии что: <i>Back-heeling is permitted <b>provided that</b> the ball moves forwards.</i></p>","ex":[{"q":"The goalkeeper must stay on the line ___ the ball is kicked.","o":["until","although","however"],"a":0,"why":"До момента удара → until."},{"q":"___ it was raining, the match started on time.","o":["However","Although","Unless"],"a":1,"why":"Хотя → although (с придаточным)."},{"q":"A goal counts ___ the ball wholly passes over the goal line.","o":["provided that","although","until"],"a":0,"why":"При условии что → provided that."},{"q":"You won't improve ___ you practise every day.","o":["until","unless","however"],"a":1,"why":"Если не будешь → unless."},{"q":"Blocking is allowed. ___, the player must be stationary.","o":["Although","However","Unless"],"a":1,"why":"Однако (новое предложение, запятая) → However."}]},"reading":{"title":"DOGSO — Denying an obvious goalscoring opportunity","text":["If a player denies the opponents a goal or an obvious goalscoring opportunity with a deliberate handball, the player is sent off, wherever this happens.","If a defender commits a foul inside their own penalty area and denies an obvious goalscoring opportunity, the referees award a penalty kick. If the foul was an attempt to play the ball, the player is only cautioned. But if it wasn't — for example, holding, pulling or pushing — the player is sent off.","To decide if it is DOGSO, the referees think about: the distance to the goal, the direction of play, the chance of controlling the ball, and the number and position of defenders and attackers. They also check whether the goal is guarded — that is, whether the goalkeeper is in their penalty area, inside the triangle between the posts and the ball.","DOGSO is more likely when the goal is unguarded, which often happens when a team plays with a flying goalkeeper."],"q":[{"q":"A defender denies a goal with a deliberate handball outside the penalty area. What is the sanction?","o":["Yellow card","Red card","No card"],"a":1},{"q":"A defender holds an attacker in the penalty area and denies an obvious chance. What happens?","o":["Penalty + red card","Penalty + yellow card","Indirect free kick"],"a":0},{"q":"When is the goal 'guarded'?","o":["When there are two defenders","When the goalkeeper is between the posts and the ball in the penalty area","When the goal is fixed"],"a":1}]},"listening":{"title":"Referee fitness test","theme":"futsal","lines":[["Instructor","Good morning, everyone. Today is the fitness test. First, warm up for ten minutes."],["Referee","Is it the same test as last year?"],["Instructor","Almost. There are sprints first, and then the interval run. You must pass both."],["Referee","I've been working out all summer, so I hope I'll be fine."],["Instructor","Good. Remember: in futsal you have short, fast sprints along the touchline. Keeping fit is part of the job."],["Referee","Of course. And after the test?"],["Instructor","Stretch, drink some water, and then we have a video session about handball and DOGSO."]],"q":[{"q":"What should the referees do first?","o":["Sprints","Warm up","Watch a video"],"a":1},{"q":"What has the referee been doing all summer?","o":["Working out","Refereeing","Resting"],"a":0},{"q":"What is the topic of the video session?","o":["Positioning","Handball and DOGSO","Timeouts"],"a":1}]}},{"title":"Sent-off & 2 minutes · Проблемы и решения","futsal":[{"en":"two-minute numerical reduction","ru":"двухминутное численное меньшинство","ex":"After a sending-off, the team serves a two-minute numerical reduction."},{"en":"to elapse","ru":"пройти, истечь (о времени)","ex":"The substitute can enter after two minutes have elapsed."},{"en":"team official","ru":"официальное лицо команды","ex":"Team officials can also receive yellow and red cards."},{"en":"to serve (a suspension)","ru":"отбывать (наказание)","ex":"The team served its two minutes with three outfield players."},{"en":"to be entitled to","ru":"иметь право на","ex":"Each team is entitled to one timeout per period."}],"life":[{"en":"to get to the bottom of","ru":"докопаться до сути","ex":"We need to get to the bottom of this problem."},{"en":"to weigh up the pros and cons","ru":"взвесить все за и против","ex":"I weighed up the pros and cons before accepting."},{"en":"a setback","ru":"неудача, препятствие","ex":"The injury was a big setback for her career."},{"en":"to iron out","ru":"уладить, сгладить (мелкие проблемы)","ex":"We still have a few details to iron out."},{"en":"to think outside the box","ru":"мыслить нестандартно","ex":"To solve this, we need to think outside the box."}],"grammar":{"title":"Phrasal verbs","explain":"<p>Фразовый глагол = глагол + частица. Смысл часто меняется полностью!</p>\n<p class=\"ex\"><b>send off</b> — удалить; <b>take off</b> — снять (одежду), взлететь; <b>give up</b> — бросить, сдаться; <b>run out of</b> — закончиться (о запасе); <b>look forward to</b> — ждать с нетерпением (+ -ing); <b>turn up</b> — появиться; <b>carry on</b> — продолжать; <b>put on</b> — надеть.</p>\n<p>Если дополнение — местоимение, оно стоит между глаголом и частицей: <i>The referee sent <b>him</b> off</i> (не <s>sent off him</s>).</p>","ex":[{"q":"The referee sent ___ for a second caution.","o":["off him","him off","him out"],"a":1,"why":"Местоимение между глаголом и частицей."},{"q":"We've run ___ of water — can someone buy some?","o":["out","off","up"],"a":0,"why":"run out of — закончиться."},{"q":"I'm looking forward ___ you next week.","o":["to see","to seeing","seeing"],"a":1,"why":"look forward to + -ing."},{"q":"Don't give ___! You're making progress.","o":["off","up","on"],"a":1,"why":"give up — сдаваться."},{"q":"The player had to take ___ his jewellery before the match.","o":["off","on","out"],"a":0,"why":"take off — снять."}]},"reading":{"title":"Law 3 — Playing with fewer players","text":["In futsal, when a player is sent off after the kick-off, the team doesn't play with fewer players for the rest of the match. Instead, the team serves a two-minute numerical reduction.","A substitute may replace the sent-off player after two minutes of playing time have elapsed, with the permission of the timekeeper or the third referee. However, if a goal is scored before the two minutes are over, special rules apply.","If it's five players against four (or four against three) and the team with more players scores, the team with fewer players can be completed with one player. If the team with fewer players scores, nothing changes — they must wait until the two minutes are over. If both teams are playing with fewer players and someone scores, neither team gets a player back until its two minutes have elapsed."],"q":[{"q":"How long is the numerical reduction after a sending-off?","o":["One minute","Two minutes","The rest of the match"],"a":1},{"q":"5 v 4: the team with five players scores. What happens?","o":["The team with four can add one player","Nothing changes","The match is restarted with a dropped ball"],"a":0},{"q":"5 v 4: the team with four players scores. What happens?","o":["They get a player back","Nothing changes until the two minutes are over","The other team loses a player"],"a":1}]},"listening":{"title":"A booking problem","theme":"life","lines":[["Receptionist","Good evening. How can I help you?"],["Guest","Hi. I booked three nights, but your system says two. I'd like to get to the bottom of this."],["Receptionist","Let me check... You're right, there was a setback with our new booking system this week."],["Guest","I'm here for a tournament until Sunday, so I really need that third night."],["Receptionist","The hotel is full on Saturday, but let me think outside the box. Our sister hotel is just across the street."],["Guest","Hmm, I'd have to weigh up the pros and cons. Would I need to move my luggage?"],["Receptionist","No, we'll do it for you. And breakfast is free. I'm sure we can iron out any other details."]],"q":[{"q":"What is the problem?","o":["The room is dirty","The booking is for two nights instead of three","The price is wrong"],"a":1},{"q":"What caused the problem?","o":["A setback with the new booking system","The guest made a mistake","A tournament"],"a":0},{"q":"What solution does the receptionist offer?","o":["A room in the sister hotel across the street","A refund","A bigger room"],"a":0}]}},{"title":"Signals & positioning · Изучение языка","futsal":[{"en":"whistle","ru":"свисток / свистеть","ex":"The referee blew the whistle to stop play."},{"en":"signal","ru":"сигнал (жест) / подавать сигнал","ex":"The referees must give the mandatory signals."},{"en":"action area","ru":"зона действия (где мяч)","ex":"One referee controls the action area."},{"en":"influence area","ru":"зона влияния (где мяча нет, но возможен конфликт)","ex":"The other referee watches the influence area."},{"en":"eye contact","ru":"зрительный контакт","ex":"After a goal, the referees make eye contact."}],"life":[{"en":"to get the hang of","ru":"наловчиться, освоить","ex":"It took me a while to get the hang of the four-second count."},{"en":"to struggle with","ru":"с трудом справляться с","ex":"I still struggle with phrasal verbs."},{"en":"to grasp","ru":"уловить, понять (суть)","ex":"She quickly grasped the main idea of the rule."},{"en":"to learn by heart","ru":"выучить наизусть","ex":"I learned all the referee signals by heart."},{"en":"to be rusty","ru":"«заржаветь», подзабыть (навык)","ex":"My English is a bit rusty — I haven't spoken it for years."}],"grammar":{"title":"used to / be used to / get used to","explain":"<p><b>used to + V</b> — привычка/состояние в прошлом, которых сейчас нет:</p>\n<p class=\"ex\">I <b>used to play</b> futsal, but now I referee. Did you <b>use to</b> live here?</p>\n<p><b>be used to + -ing / noun</b> — быть привычным к чему-то:</p>\n<p class=\"ex\">I'<b>m used to working</b> under pressure.</p>\n<p><b>get used to + -ing / noun</b> — привыкать:</p>\n<p class=\"ex\">It took me a year to <b>get used to</b> the new rules.</p>","ex":[{"q":"I ___ be a player before I became a referee.","o":["used to","am used to","use to"],"a":0,"why":"Прошлое, которого сейчас нет → used to + V."},{"q":"Referees ___ shouting fans.","o":["used to","are used to","use to"],"a":1,"why":"Привычны к → are used to + noun."},{"q":"I'm slowly getting used to ___ up at 6 am.","o":["get","getting","got"],"a":1,"why":"get used to + -ing."},{"q":"Did you ___ watch cartoons when you were a child?","o":["used to","use to","using to"],"a":1,"why":"В вопросе с did → use to."},{"q":"She isn't used to ___ in English yet.","o":["speak","speaking","spoke"],"a":1,"why":"be used to + -ing."}]},"reading":{"title":"Positioning of the referees","text":["The two referees use a diagonal system. They usually stay outside the pitch, along opposite touchlines, so the play is between them. They only enter the pitch to get a better view.","The referee nearest to the ball controls the action area — the place where the ball is. The other referee watches the influence area — the place where the ball isn't, but where a dispute between players may happen. What needs to be seen is not always near the ball.","One referee should be in line with the second-last defender, or with the ball if it is nearer to the end line. The referees must always face the pitch.","After a clear goal, the two referees make eye contact. Then the referee nearest to the timekeeper's table goes there and shows the number of the player who scored with the mandatory signal."],"q":[{"q":"What is the 'influence area'?","o":["Where the ball is","Where the ball isn't, but a dispute may happen","The technical area"],"a":1},{"q":"When do the referees enter the pitch?","o":["Never","To get a better view","At every restart"],"a":1},{"q":"What do the referees do after a clear goal?","o":["Make eye contact","Stop the chronometer","Talk to the coaches"],"a":0}]},"listening":{"title":"Learning English for refereeing","theme":"life","lines":[["Teacher","So, why do you want to improve your English?"],["Referee","I've been selected for international tournaments, and all the communication there is in English."],["Teacher","Congratulations! How would you describe your level?"],["Referee","I studied English at school, but I'm a bit rusty. I can grasp most written texts, but I struggle with speaking."],["Teacher","That's very common. Once you start speaking every day, you'll get the hang of it quickly."],["Referee","I've already learned the key referee phrases by heart."],["Teacher","Great start. Now let's practise using them in real situations."]],"q":[{"q":"Why does the referee need English?","o":["International tournaments","A new job abroad","A university exam"],"a":0},{"q":"What does the referee struggle with?","o":["Reading","Speaking","Listening"],"a":1},{"q":"What has the referee already done?","o":["Learned key referee phrases by heart","Lived in England","Passed an exam"],"a":0}]}},{"title":"Video support · Идиомы","futsal":[{"en":"video support (VS)","ru":"видеоподдержка","ex":"Video support can be used for goals, penalties and direct red cards."},{"en":"to challenge a decision","ru":"оспорить решение (запросить просмотр)","ex":"The head coach challenged the decision."},{"en":"review","ru":"просмотр (видеоповтора) / пересматривать","ex":"The referees went to the review area to watch the replay."},{"en":"to overturn","ru":"отменить (решение)","ex":"After the review, the referee overturned the decision."},{"en":"spirit of the game","ru":"дух игры","ex":"Referees should apply the Laws within the spirit of the game."}],"life":[{"en":"to bite off more than you can chew","ru":"взять на себя больше, чем можешь","ex":"Three tournaments in one month? You've bitten off more than you can chew."},{"en":"to call it a day","ru":"закончить (на сегодня)","ex":"It's late — let's call it a day."},{"en":"to go the extra mile","ru":"сделать больше, чем требуется","ex":"She always goes the extra mile to prepare for a match."},{"en":"to be on the same page","ru":"одинаково понимать ситуацию, быть на одной волне","ex":"Before the match, the referees make sure they're on the same page."},{"en":"to cut corners","ru":"халтурить, экономить на качестве","ex":"Never cut corners when you check the pitch."}],"grammar":{"title":"Present Perfect Continuous; for vs since","explain":"<p><b>Present Perfect Continuous</b> (have/has been + -ing) — действие началось в прошлом и продолжается до сих пор (или только что закончилось, и виден результат).</p>\n<p class=\"ex\">I<b>'ve been refereeing</b> for six years. She<b>'s been studying</b> English since September.</p>\n<p><b>for</b> + период: <i>for two hours, for ten years</i>. <b>since</b> + точка отсчёта: <i>since 2020, since Monday, since I was a child</i>.</p>\n<p>С глаголами состояния — обычный Present Perfect: <i>I<b>'ve known</b> him for years</i>.</p>","ex":[{"q":"I've been learning English ___ three months.","o":["since","for","from"],"a":1,"why":"Период → for."},{"q":"She has been a referee ___ 2019.","o":["for","since","ago"],"a":1,"why":"Точка отсчёта → since."},{"q":"You look tired. ___ you been running?","o":["Have","Did","Are"],"a":0,"why":"Have you been running? — видимый результат."},{"q":"I ___ him since we were at school.","o":["have been knowing","have known","know"],"a":1,"why":"know — глагол состояния → Present Perfect."},{"q":"How long ___ you been waiting?","o":["have","are","did"],"a":0,"why":"How long have you been + -ing."}]},"reading":{"title":"Video Support in futsal","text":["In futsal, video support (VS) works differently from VAR in football. There is no video assistant watching all the time. Instead, a team's head coach can challenge a decision.","A coach can ask for a review only in certain situations: goal or no goal, penalty or no penalty, direct red cards, and mistaken identity. To challenge, the coach twirls a finger in the air and tells the third or fourth referee.","The referees show the TV signal — the outline of a screen — and go to the referee review area to watch the replay. Slow motion is used for facts, like the position of a foul; normal speed is used to judge how strong a foul was.","After the review, the referee makes the final decision and can confirm or overturn the first decision. Accuracy is more important than speed, so there is no time limit for a review."],"q":[{"q":"Who can ask for a video review?","o":["Any player","The head coach","The timekeeper"],"a":1},{"q":"Which situation can be reviewed?","o":["A kick-in","Penalty or no penalty","A second yellow card"],"a":1},{"q":"Why is there no time limit for a review?","o":["Accuracy is more important than speed","Because the clock is stopped","Because coaches can talk"],"a":0}]},"listening":{"title":"After the final","theme":"futsal","lines":[["Assessor","Congratulations on the final. How do you feel?"],["Referee","Relieved! I was worried I'd bitten off more than I could chew with three tournaments this month."],["Assessor","Well, it didn't show. You and your colleague were clearly on the same page all match."],["Referee","We spent a lot of time on the briefing. I didn't want to cut corners."],["Assessor","And the video review in the second half? You overturned the penalty."],["Referee","After the replay, I saw there was no contact. Getting it right matters more than my pride."],["Assessor","That's going the extra mile. Now go and rest — let's call it a day."]],"q":[{"q":"What was the referee worried about?","o":["Taking on too much","The weather","Her English"],"a":0},{"q":"Why did the referees work well together?","o":["They had a long briefing","They are old friends","They used video support"],"a":0},{"q":"What happened to the penalty decision?","o":["It was confirmed","It was overturned after the replay","It was never given"],"a":1}]}}];

function currentLesson(){ for(let n=1;n<=LESSONS.length;n++){ if(!lessonDone(n)) return n; } return LESSONS.length; }
function unlocked(n){ return n===1 || lessonDone(n-1) || lessonDone(n); }
function completeStep(n, k, score){
  const p=lp(n); const first = p.steps[k]===undefined;
  p.steps[k] = Math.max(score??1, p.steps[k]??0);
  if(k==='words'){ LESSONS[n-1].futsal.forEach((_,j)=>addCard(cardId(n,'futsal',j))); LESSONS[n-1].life.forEach((_,j)=>addCard(cardId(n,'life',j))); }
  if(lessonDone(n) && !p.done) p.done = today();
  markActive(); save();
  return first;
}
function addCard(id){ if(!S.cards[id]) S.cards[id] = {b:0, due: today()+1, ok:0, no:0}; }
function dueCards(){ const t=today(); return Object.entries(S.cards).filter(([id,c])=>c.due<=t && WMAP[id]).map(([id])=>id); }

      <div class="row between"><span class="pill ${w.kind==='life'?'life':''}">${w.kind==='futsal'?'⚽ Футзал':'☕ Жизнь'}</span><span class="small muted">${i+1} / ${list.length}</span></div>
      <div class="row" style="margin-top:6px"><div class="word grow">${esc(w.en)}</div><button class="say" onclick="say('${w.id}','w')">${ICON.speak}</button></div>
      <div class="tr">${esc(w.ru)}</div>
      <div class="exs row"><div class="grow">${esc(w.ex)}</div><button class="say sm" onclick="say('${w.id}','x')">${ICON.speak}</button></div>
    </div>
    <div class="btns">
      <button class="btn line" ${i===0?'disabled':''} onclick="route.wi--;render()">Назад</button>
      ${i<list.length-1?`<button class="btn" onclick="route.wi++;render()">Дальше</button>`:`<button class="btn" onclick="completeStep(${n},'words');nextStep(${n},route)">Готово — к проверке</button>`}
    </div>`;
  setTimeout(()=>say(w.id,'w'),150);
};

/* Generic multiple-choice runner */
function runQuiz(container, questions, opts){
  // questions: [{q, o:[], a, why?, html?}]
  const state = opts.state; // persistent across renders
  if(!state.qs){ state.qs = questions.map(q=>{ const order=shuffle(q.o.map((_,i)=>i)); return {...q, order}; }); state.i=0; state.score=0; state.picked=null; }
  const draw = () => {
    const q = state.qs[state.i];
    if(!q){ // finished
      const pct = Math.round(state.score/state.qs.length*100);
      container.innerHTML = `<div class="card center"><div class="big">${pct>=80?'🏆':pct>=50?'👍':'💪'}</div><h3>${state.score} из ${state.qs.length}</h3><div class="muted small">${pct>=80?'Отлично!':pct>=50?'Хорошо, но есть что подтянуть':'Стоит повторить ещё раз'}</div></div>
        <div class="btns"><button class="btn line" id="again">Ещё раз</button><button class="btn" id="cont">${opts.nextLabel||'Дальше'}</button></div>`;
      container.querySelector('#again').onclick=()=>{ Object.keys(state).forEach(k=>delete state[k]); runQuiz(container, questions, opts); };
      container.querySelector('#cont').onclick=()=>opts.onDone(state.score/state.qs.length);
      return;
    }
    const picked = state.picked;
    container.innerHTML = `
      <div class="progress"><i style="width:${state.i/state.qs.length*100}%"></i></div>
      <div class="card">
        <div class="small muted">${opts.label||'Вопрос'} ${state.i+1} / ${state.qs.length}</div>
        <div class="q" style="margin:6px 0 10px">${q.html||esc(q.q)}</div>
        ${q.order.map(k=>{ let cls=''; if(picked!==null){ if(k===q.a) cls='ok'; else if(k===picked) cls='bad'; }
          return `<button class="opt ${cls}" data-k="${k}" ${picked!==null?'disabled':''}>${esc(q.o[k])}</button>`; }).join('')}
        ${picked!==null?`<div class="feedback ${picked===q.a?'ok':'bad'}">${picked===q.a?'Верно! ':'Правильно: <b>'+esc(q.o[q.a])+'</b>. '}${q.why?esc(q.why):''}</div>`:''}
      </div>
      ${picked!==null?`<button class="btn" id="nx">${state.i<state.qs.length-1?'Следующий':'Результат'}</button>`:''}`;
    container.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; state.picked=k; const ok=k===q.a; if(ok) state.score++; answer(ok); if(opts.onAnswer) opts.onAnswer(q,ok); save(); draw(); });
    const nx=container.querySelector('#nx'); if(nx) nx.onclick=()=>{ state.i++; state.picked=null; draw(); };
  };
  draw();
}

/* Word quiz */
STEP_VIEWS.quiz = (n, L, r) => {
  r.qs = r.qs || {};
  const ids=[...L.futsal.map((_,j)=>cardId(n,'futsal',j)), ...L.life.map((_,j)=>cardId(n,'life',j))];
  if(!r.qs.qs){
    r.questions = shuffle(ids).map((id,idx)=>{
      const w=WMAP[id]; let cand=WORDS.filter(x=>x.kind===w.kind && x.id!==id && x.lesson<=n); if(cand.length<6) cand=WORDS.filter(x=>x.kind===w.kind && x.id!==id && x.lesson<=n+2); const pool=shuffle(cand).slice(0,3);
      const opts=shuffle([w,...pool]); const dir = idx%2===0 ? 'en' : 'ru';
      return dir==='en' ? {q:w.en, html:`Переведи на русский:<br><b>${esc(w.en)}</b>`, o:opts.map(x=>x.ru), a:opts.indexOf(w), id}
                        : {q:w.ru, html:`Как сказать по-английски:<br><b>${esc(w.ru)}</b>`, o:opts.map(x=>x.en), a:opts.indexOf(w), id};
    });
  }
  runQuiz($('#step'), r.questions, {state:r.qs, label:'Слово', nextLabel:'К грамматике',
    onAnswer:(q,ok)=>{ if(ok) say(q.id,'w'); },
    onDone:(sc)=>{ completeStep(n,'quiz',sc); nextStep(n,route); }});
};

/* Player */
function playerHTML(id){
  return `<div class="card player"><button class="play" id="pp">${ICON.play}</button>
    <div class="grow"><div class="bar" id="bar"><i style="width:0"></i></div><div class="row between small muted" style="margin-top:6px"><span id="tcur">0:00</span><span id="tdur">--:--</span></div></div>
    <button class="speed" id="spd">${audioRate}×</button></div>`;
}
function fmt(t){ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function bindPlayer(id, onLine){
  const pp=$('#pp'), bar=$('#bar'), spd=$('#spd');
  const src='audio/'+id+'.mp3';
  const sync=(ended)=>{
    if(!pp || !pp.isConnected) return;
    const mine = audio.src.endsWith(src);
    const playing = mine && !audio.paused && !ended;
    pp.innerHTML = playing?ICON.pause:ICON.play;
    if(mine && audio.duration){ bar.firstElementChild.style.width=(audio.currentTime/audio.duration*100)+'%'; $('#tcur').textContent=fmt(audio.currentTime); $('#tdur').textContent=fmt(audio.duration); }
    if(onLine) onLine(mine?audio.currentTime:-1, ended);
  };
  onTick = sync;
  pp.onclick=()=>{
    if(audio.src.endsWith(src)){ if(audio.paused){ audio.playbackRate=audioRate; audio.play(); } else audio.pause(); }
    else play(id, audioRate);
    setTimeout(()=>sync(),50);
  };
  audio.onpause = ()=>sync(); audio.onplay=()=>sync(); audio.onloadedmetadata=()=>sync();
  bar.onclick=(e)=>{ if(!audio.src.endsWith(src)||!audio.duration) return; const r=bar.getBoundingClientRect(); audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; };
  spd.onclick=()=>{ audioRate = audioRate===1?0.8:audioRate===0.8?1.2:1; spd.textContent=audioRate+'×'; audio.playbackRate=audioRate; };
  return sync;
}

/* Reading */
function termIndex(upTo){
  const terms=[];
  WORDS.filter(w=>w.lesson<=upTo).forEach(w=>{
    let base=w.en.replace(/\(.*?\)/g,'').replace(/^to /,'').replace(/[?!.]/g,'').replace(/\.\.\./g,'').trim();
    if(base.length<3 || /\.\.\.|…/.test(w.en)) return;
    terms.push({base, w});
  });
  terms.sort((a,b)=>b.base.length-a.base.length);
  return terms;
}
function highlight(text, terms){
  // mark terms (case-insensitive, allow simple endings)
  let html = esc(text); const segs=[];
  terms.forEach(t=>{
    const re = new RegExp('(^|[^\\w])('+t.base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/ /g,'\\s')+'(?:s|es|ed|d|ing)?)(?!\\w)','i');
    if(re.test(html)) html = html.replace(re, (m,a,b)=>{ segs.push([t.w.id,b]); return a+'\u0001'+(segs.length-1)+'\u0002'; });
  });
  return html.replace(/\u0001(\d+)\u0002/g,(m,k)=>`<span class="term" onclick="showTerm('${segs[k][0]}')">${segs[k][1]}</span>`);
}
let popT;
window.showTerm = (id) => {
  const w=WMAP[id]; let p=$('.pop'); if(!p){ p=document.createElement('div'); p.className='pop'; document.body.appendChild(p); }
  p.innerHTML = `<b>${esc(w.en)}</b> — ${esc(w.ru)}`; p.style.display='block'; say(id,'w');
  clearTimeout(popT); popT=setTimeout(()=>p.style.display='none', 3500);
};
STEP_VIEWS.reading = (n, L, r) => {
  r.rq = r.rq || {};
  const terms = termIndex(n);
  $('#step').innerHTML = `<div class="small muted" style="margin:4px 2px">Прочитай текст (можно параллельно слушать). Подчёркнутые слова — нажми, чтобы увидеть перевод.</div>
    ${playerHTML('r'+n)}
    <div class="card text"><span class="pill">📖 Reading</span><h2 style="margin:10px 0">${esc(L.reading.title)}</h2>
      ${L.reading.text.map((p,i)=>`<p data-p="${i}" class="tline">${highlight(p, terms)}</p>`).join('')}</div>
    <h2>Вопросы к тексту</h2><div id="rq"></div>`;
  const starts = TIMING['r'+n]||[];
  bindPlayer('r'+n, (t)=>{ let cur=-1; starts.forEach((s,i)=>{ if(t>=s-0.05) cur=i; }); document.querySelectorAll('.text .tline').forEach((el,i)=>el.classList.toggle('cur', i===cur && !audio.paused)); });
  runQuiz($('#rq'), L.reading.q, {state:r.rq, label:'Вопрос', nextLabel:'К аудированию',
    onDone:(sc)=>{ completeStep(n,'reading',sc); nextStep(n,route); }});
};

/* Listening */
STEP_VIEWS.listening = (n, L, r) => {
  r.lq = r.lq || {}; const D=L.listening;
  const showT = !!r.showT;
  $('#step').innerHTML = `<div class="small muted" style="margin:4px 2px">Сначала послушай диалог (можно 2–3 раза) и ответь на вопросы. Текст лучше открыть в конце.</div>
    <div class="card"><span class="pill ${D.theme==='life'?'life':''}">🎧 ${D.theme==='futsal'?'Futsal':'Everyday'} dialogue</span><h2 style="margin:10px 0 0">${esc(D.title)}</h2></div>
    ${playerHTML('d'+n)}
    <div id="lq"></div>

  runQuiz($('#lq'), D.q, {state:r.lq, label:'Вопрос', nextLabel:'Завершить урок',

      <div class="stats" style="margin-top:16px">
        ${['quiz','grammar','reading','listening'].map(k=>`<div class="stat"><b>${p.steps[k]!==undefined?Math.round(p.steps[k]*100)+'%':'—'}</b><span>${STEPS.find(s=>s.k===k).t}</span></div>`).join('')}
        <div class="stat"><b>🔥 ${streak()}</b><span>дней подряд</span></div>
      </div>
    </div>
    ${done?'<div class="small muted center">Рекомендуем один урок в день — так слова лучше запоминаются. Следующий урок уже открыт, если хочется больше.</div>':''}
    <button class="btn" onclick="tab('home')">На главную</button>`;

/* Review (spaced repetition) */
VIEWS.review = (r) => {
  if(!r.queue){ r.queue = shuffle(dueCards()).slice(0,30); r.i=0; r.flipped=false; r.ok=0; r.total=r.queue.length; }
  const id = r.queue[r.i];
  if(!id){
    $('#app').innerHTML = topbar('Повторение','') + `<div class="card center"><div class="big">✨</div><h3>Готово!</h3><div class="muted">Повторено: ${r.total}, вспомнила сразу: ${r.ok}</div></div><button class="btn" onclick="tab('home')">На главную</button>`;
    markActive(); save(); return;
  }
  const w=WMAP[id], c=S.cards[id];
  const dir = c.b>=2 && (id.charCodeAt(id.length-1)+today())%2 ? 'ru' : 'en';
  const front = dir==='en' ? `<div class="word">${esc(w.en)}</div>` : `<div class="tr" style="font-size:24px;font-weight:600">${esc(w.ru)}</div>`;
  $('#app').innerHTML = topbar('Повторение', `${r.i+1} / ${r.queue.length}`) + `
    <div class="progress"><i style="width:${r.i/r.queue.length*100}%"></i></div>
    <div class="card flip" onclick="if(!route.flipped){route.flipped=true;render()}">
      <div><span class="pill ${w.kind==='life'?'life':''}">${w.kind==='futsal'?'⚽ Футзал':'☕ Жизнь'}</span></div>
      ${front}
      ${r.flipped?`<div style="margin-top:10px">${dir==='en'?`<div class="tr">${esc(w.ru)}</div>`:`<div class="word">${esc(w.en)}</div>`}
        <div class="small muted" style="margin-top:8px">${esc(w.ex)}</div>
        <div style="margin-top:12px"><button class="btn ghost" style="display:inline-flex;width:auto;gap:6px;padding:8px 14px;margin:0 4px" onclick="event.stopPropagation();say('${id}','w')">🔊 слово</button><button class="btn ghost" style="display:inline-flex;width:auto;gap:6px;padding:8px 14px;margin:0 4px" onclick="event.stopPropagation();say('${id}','x')">🔊 пример</button></div></div>`
        :`<div class="small muted" style="margin-top:20px">${dir==='en'?'Вспомни перевод':'Вспомни по-английски'} · нажми, чтобы открыть</div>`}
    </div>
    ${r.flipped?`<div class="btns"><button class="btn line" onclick="grade(false)">Не помню</button><button class="btn" onclick="grade(true)">Помню</button></div>`:''}`;
  if(dir==='en' && !r.flipped) setTimeout(()=>say(id,'w'),150);
  if(dir==='ru' && r.flipped) setTimeout(()=>say(id,'w'),100);
};
window.grade = (ok) => {
  const r=route, id=r.queue[r.i], c=S.cards[id];
  answer(ok);
  if(ok){ c.ok++; c.b=Math.min(c.b+1, INTERVALS.length-1); c.due=today()+INTERVALS[c.b]; if(!r.retry||!r.retry[id]) r.ok++; }
  else { c.no++; c.b=0; c.due=today()+1; r.retry=r.retry||{}; if(!r.retry[id]){ r.retry[id]=1; r.queue.push(id); } }
  r.i++; r.flipped=false; save(); render();
};

/* Dictionary */
VIEWS.dict = (r) => {
  r.f = r.f||'all'; r.s = r.s||'';
  const learnedOnly = Object.keys(S.cards).length>0;
  let list = WORDS.filter(w=>S.cards[w.id] || unlocked(w.lesson) && (S.lessons[w.lesson]||{}).steps?.words!==undefined);
  if(!list.length) list=[];
  const q=r.s.toLowerCase();
  const view = list.filter(w=>(r.f==='all'||w.kind===r.f) && (!q || w.en.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q)));
  $('#app').innerHTML = `<h1>Словарь</h1><div class="small muted">Все слова из пройденных уроков. Точки — насколько хорошо слово закрепилось.</div>
    <div style="margin-top:12px"><input class="search" id="srch" placeholder="Поиск по-английски или по-русски" value="${esc(r.s)}"></div>
    <div class="tabs">${[['all','Все'],['futsal','⚽ Футзал'],['life','☕ Жизнь']].map(([k,t])=>`<button class="${r.f===k?'on':''}" onclick="route.f='${k}';render()">${t}</button>`).join('')}</div>
    <div class="card list dict" id="dl">${view.length?view.map(w=>{ const c=S.cards[w.id]||{b:0};
      return `<div class="item"><div class="grow"><b>${esc(w.en)}</b> <span class="boxdots">${[1,2,3,4,5,6].map(k=>`<i class="${c.b>=k?'on':''}"></i>`).join('')}</span><div>${esc(w.ru)}</div><div class="small muted">${esc(w.ex)}</div></div><button class="say sm" onclick="say('${w.id}','w')">${ICON.speak}</button></div>`;}).join('')
      :`<div class="muted center" style="padding:20px">${list.length?'Ничего не найдено':'Пройди первый шаг урока, и слова появятся здесь'}</div>`}</div>`;
  const s=$('#srch'); s.oninput=()=>{ r.s=s.value; const pos=s.selectionStart; render(); const n=$('#srch'); n.focus(); n.setSelectionRange(pos,pos); };
};

/* Stats */
VIEWS.stats = () => {

  const boxes=[0,0,0,0,0,0,0]; Object.values(S.cards).forEach(c=>boxes[c.b]++);
  const days=new Set(S.days); const t=today();
  const cal=[...Array(28)].map((_,i)=>t-27+i);

      <div class="stat"><b>🔥 ${streak()}</b><span>дней подряд</span></div>
      <div class="stat"><b>${done}/${LESSONS.length}</b><span>уроков</span></div>

    <h2>Слова</h2>
    <div class="card">
      ${[['Новые (0)',boxes[0]],['Знакомые (1–2)',boxes[1]+boxes[2]],['Почти выучены (3–4)',boxes[3]+boxes[4]],['Выучены (5–6)',boxes[5]+boxes[6]]].map(([l,v])=>`<div class="row between" style="padding:6px 0"><span>${l}</span><b>${v}</b></div>`).join('')}
      <div class="small muted" style="margin-top:6px">Слово возвращается через 1, 2, 4, 7, 14, 30 и 60 дней, если ты его помнишь. Если забыла — снова через день.</div>
    </div>
    <h2>Сохранение</h2>
    <div class="card small">${inTG?'Прогресс сохраняется в облаке Telegram и не пропадёт при смене телефона.':'Прогресс сохраняется в этом браузере. Внутри Telegram он будет храниться в облаке Telegram.'}
      <div class="btns"><button class="btn line" onclick="exportProgress()">Резервная копия</button><button class="btn line" onclick="importProgress()">Восстановить</button></div>
      <button class="btn line" style="color:var(--red)" onclick="resetAll()">Сбросить весь прогресс</button></div>`;
};
window.exportProgress = () => { const s=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alertMsg('Резервная копия скопирована. Сохрани её, например, в «Избранном» Telegram.')).catch(()=>prompt('Скопируй этот код:', s)); };
window.importProgress = () => { const s=prompt('Вставь код резервной копии:'); if(!s) return; try{ S=JSON.parse(decodeURIComponent(escape(atob(s.trim())))); save(); render(); alertMsg('Прогресс восстановлен'); }catch(e){ alertMsg('Код не подошёл'); } };
window.resetAll = () => { const doit=()=>{ S=blank(); save(); tab('home'); };
  if(inTG && tg.showConfirm) tg.showConfirm('Точно удалить весь прогресс?', ok=>ok&&doit()); else if(confirm('Точно удалить весь прогресс?')) doit(); };
function alertMsg(m){ if(inTG && tg.showAlert) tg.showAlert(m); else alert(m); }

/* ---------- Boot ---------- */
(async function(){
  const local = loadLocal(); if(local) S = Object.assign(blank(), local);
  render();
  const cloud = await loadCloud();
  if(cloud && (cloud.updated||0) > (S.updated||0)){ S = Object.assign(blank(), cloud); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
})();
</script>
