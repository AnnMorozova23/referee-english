yed indoors, …</div>\n<p><b>which</b> о всём предложении: <i>He apologised, <b>which</b> was a surprise.</i> — Он извинился, что было неожиданно.</p>\n\n<h4>5. Предлоги</h4>\n<p class=\"ex\">Разговорно: This is the colleague I work <b>with</b>.<br>Формально: This is the colleague <b>with whom</b> I work.</p>\n<div class=\"note\">⚠️ После предлога — только whom/which, не who/that: <s>with who</s>, <s>in that</s>.</div>\n<p><b>where = in/at which:</b> <i>the hall <b>where</b> we play = the hall <b>in which</b> we play = the hall (that) we play <b>in</b></i>.</p>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ The man which called you… → ✅ The man <b>who</b> called you…<br>\n❌ This is the hall where we play in. → ✅ …<b>where</b> we play / …<b>which</b> we play <b>in</b>.<br>\n❌ The player who his shirt was torn… → ✅ The player <b>whose</b> shirt was torn…<br>\n❌ The ball that it hit the post… → ✅ The ball <b>that</b> hit the post… (лишнее it)</div>","ex":[{"q":"The referee ___ controlled the final was from Spain.","o":["which","who","where"],"a":1,"why":"Человек → who."},{"q":"This is the sports hall ___ we train.","o":["which","where","who"],"a":1,"why":"Место, где что-то происходит → where."},{"q":"A kick ___ is taken from the touchline is called a kick-in.","o":["which","who","whose"],"a":0,"why":"Предмет/действие → which (или that)."},{"q":"The player ___ shirt was torn changed it at half-time.","o":["who","whose","which"],"a":1,"why":"Чья футболка → whose."},{"q":"I have a friend ___ speaks four languages.","o":["that","where","which"],"a":0,"why":"Человек → who/that."},{"q":"Futsal, ___ is played indoors, is very fast.","o":["that","which","what"],"a":1,"why":"Неопределяющее придаточное с запятыми → which, не that."},{"q":"The referee ___ I met in Madrid was very friendly. (можно ли убрать?)","o":["— (можно опустить)","whose","where"],"a":0,"why":"who/that — дополнение (дальше I) → можно опустить."},{"q":"The official to ___ I spoke was very helpful.","o":["who","whom","that"],"a":1,"why":"После предлога → whom."},{"q":"He apologised to the referee, ___ surprised everyone.","o":["which","that","what"],"a":0,"why":"which относится ко всему предложению."},{"q":"I remember the day ___ I refereed my first match.","o":["which","when","where"],"a":1,"why":"Время → when."}]},"reading":{"title":"Law 12 — Direct Free Kick Offences","text":["A direct free kick is given when a player commits certain offences against an opponent in a careless or reckless way, or using excessive force. These offences are: charging, jumping at, kicking, pushing, striking, tackling and tripping an opponent — or trying to kick, strike or trip them.","A direct free kick is also given for a deliberate handball, for holding an opponent, for impeding an opponent with contact, for biting or spitting, and for throwing an object at the ball, an opponent or a match official.","If any of these offences happens inside the offender's own penalty area, a penalty kick is awarded instead.","All these offences are accumulated fouls. The third referee records them for each team in each period, and they become very important from the sixth foul."],"q":[{"q":"A defender pushes an attacker inside his own penalty area. What is the restart?","o":["Direct free kick","Penalty kick","Indirect free kick"],"a":1},{"q":"Which of these is a direct free kick offence?","o":["Holding an opponent","Dissent","Playing in a dangerous manner"],"a":0},{"q":"Who records accumulated fouls?","o":["The timekeeper","The coach","The third referee"],"a":2}]},"listening":{"title":"Explaining a decision","theme":"futsal","lines":[["Captain","Referee, why a free kick? I played the ball!"],["Referee","You touched the ball, yes, but then you tripped number nine."],["Captain","But it was an accident!"],["Referee","I know. That's why it's careless, not reckless, so there's no card. But it's still a foul."],["Captain","OK... And how many fouls do we have now?"],["Referee","That was your fourth accumulated foul. Be careful — from the sixth one it's a free kick without a wall."],["Captain","Got it. I'll tell my players. Thanks."]],"q":[{"q":"What did the captain do?","o":["Pushed number nine","Tripped number nine","Held number nine"],"a":1},{"q":"Why is there no card?","o":["Because the foul was careless","Because it was the first foul","Because the captain apologised"],"a":0},{"q":"How many accumulated fouls does the team have now?","o":["Three","Four","Six"],"a":1}]}},{"title":"Careless, reckless · Мнения","futsal":[{"en":"careless","ru":"неосторожный (без санкции)","ex":"A careless tackle is a foul, but no card is needed."},{"en":"reckless","ru":"безрассудный (жёлтая карточка)","ex":"A reckless challenge must be cautioned."},{"en":"excessive force","ru":"чрезмерная сила (красная карточка)","ex":"Using excessive force is a sending-off offence."},{"en":"to endanger the safety","ru":"угрожать безопасности","ex":"The tackle endangered the safety of the opponent."},{"en":"challenge","ru":"единоборство, попытка отбора мяча","ex":"It was a fair challenge for the ball."},{"en":"brutality","ru":"жестокость, грубость","ex":"Serious foul play involves excessive force or brutality."},{"en":"disciplinary sanction","ru":"дисциплинарная санкция","ex":"A careless foul doesn't need a disciplinary sanction."},{"en":"lack of attention","ru":"недостаток внимания","ex":"A careless challenge shows a lack of attention."},{"en":"tackle (n.)","ru":"подкат, отбор мяча","ex":"It was a late tackle from behind."},{"en":"to disregard (the danger)","ru":"пренебречь (опасностью)","ex":"A reckless player disregards the danger to the opponent."}],"life":[{"en":"to see eye to eye (with)","ru":"сходиться во мнениях","ex":"The coaches don't always see eye to eye."},{"en":"As far as I'm concerned, ...","ru":"Что касается меня, ... / По-моему, ...","ex":"As far as I'm concerned, it was a clear penalty."},{"en":"That's a fair point","ru":"Справедливое замечание","ex":"That's a fair point, but there was no contact."},{"en":"to play devil's advocate","ru":"играть роль «адвоката дьявола»","ex":"Let me play devil's advocate: what if he didn't see the ball?"},{"en":"I beg to differ","ru":"Позволю себе не согласиться","ex":"You think it was a yellow card? I beg to differ."},{"en":"to sit on the fence","ru":"занимать нейтральную позицию, не решаться","ex":"Stop sitting on the fence — was it a foul or not?"},{"en":"to have mixed feelings","ru":"испытывать смешанные чувства","ex":"I have mixed feelings about the new rule."},{"en":"It goes without saying","ru":"Само собой разумеется","ex":"It goes without saying that referees must be neutral."},{"en":"to take something with a pinch of salt","ru":"относиться скептически","ex":"Take his stories with a pinch of salt."},{"en":"to have a point","ru":"быть в чём-то правым","ex":"You have a point — the rule isn't very clear."}],"grammar":{"title":"Comparatives and superlatives","explain":"\n<h4>1. Короткие прилагательные (1 слог)</h4>\n<p>+<b>er</b> / the +<b>est</b>: fast → fast<b>er</b> → the fast<b>est</b>; strong → stronger → the strongest</p>\n<ul><li>-e → +r/+st: late → late<b>r</b> → the late<b>st</b></li>\n<li>гласная+согласная → удвоение: big → bi<b>gg</b>er, hot → ho<b>tt</b>est, fit → fi<b>tt</b>er</li></ul>\n\n<h4>2. Прилагательные на -y (2 слога)</h4>\n<p>-y → -<b>ier</b> / -<b>iest</b>: easy → eas<b>ier</b> → the eas<b>iest</b>; busy → busier; happy → happiest</p>\n\n<h4>3. Длинные (2+ слога)</h4>\n<p><b>more / the most</b>: dangerous → <b>more</b> dangerous → <b>the most</b> dangerous; important, difficult, expensive, careful</p>\n<div class=\"note\">⚠️ Некоторые двусложные — оба варианта: clever, narrow, quiet, simple, polite: <i>quieter / more quiet</i>.</div>\n\n<h4>4. Неправильные формы — выучить</h4>\n<table><tr><td>good</td><td>better</td><td>the best</td></tr>\n<tr><td>bad</td><td>worse</td><td>the worst</td></tr>\n<tr><td>far</td><td>further / farther</td><td>the furthest</td></tr>\n<tr><td>much / many</td><td>more</td><td>the most</td></tr>\n<tr><td>little</td><td>less</td><td>the least</td></tr>\n<tr><td>old</td><td>older / elder*</td><td>the oldest / eldest*</td></tr></table>\n<p>* elder/eldest — только о членах семьи: <i>my <b>elder</b> sister</i>.</p>\n\n<h4>5. Конструкции сравнения</h4>\n<ul><li><b>than</b>: <i>Futsal is fast<b>er than</b> football.</i></li>\n<li><b>as … as</b> (такой же): <i>She is <b>as</b> experienced <b>as</b> her colleague.</i></li>\n<li><b>not as/so … as</b> (не такой): <i>The pitch is<b>n't as</b> big <b>as</b> a football pitch.</i></li>\n<li><b>the + превосходная + in / of</b>: <i>the best referee <b>in</b> the country</i>, <i>the hardest match <b>of</b> the season</i></li>\n<li><b>Усиление:</b> <i><b>much / far / a lot</b> faster</i> — намного; <i><b>a bit / slightly</b> faster</i> — чуть</li>\n<li><b>Чем…, тем…:</b> <i><b>The more</b> you practise, <b>the better</b> you get.</i></li>\n<li><b>Всё больше и больше:</b> <i>It's getting <b>colder and colder</b>. Futsal is becoming <b>more and more</b> popular.</i></li></ul>\n<div class=\"note\">⚠️ <b>very</b> не используется со сравнительной степенью: <s>very faster</s> → <b>much</b> faster.</div>\n<div class=\"note\">⚠️ После than в разговоре — <b>me / him</b>: <i>She's taller than <b>me</b>.</i> Формально: <i>than I am</i>.</div>\n\n<h4>6. Наречия</h4>\n<p class=\"ex\">fast → fast<b>er</b>; hard → hard<b>er</b>; well → <b>better</b>; badly → <b>worse</b><br>carefully → <b>more</b> carefully; quickly → <b>more</b> quickly</p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ more faster → ✅ <b>faster</b><br>❌ the most good → ✅ <b>the best</b><br>❌ He is taller that me. → ✅ …taller <b>than</b> me.<br>❌ as fast than → ✅ <b>as</b> fast <b>as</b></div>","ex":[{"q":"A futsal pitch is ___ than a football pitch.","o":["smaller","more small","smallest"],"a":0,"why":"small — короткое → smaller."},{"q":"Serious foul play is ___ offence in this list.","o":["the most serious","the seriousest","more serious"],"a":0,"why":"Длинное прилагательное → the most serious."},{"q":"My English is ___ than last year.","o":["more good","better","best"],"a":1,"why":"good → better (исключение)."},{"q":"This match was ___ match of the season.","o":["the worst","the baddest","worse"],"a":0,"why":"bad → worse → the worst."},{"q":"The second half was not as exciting ___ the first.","o":["than","as","like"],"a":1,"why":"Конструкция as ... as."},{"q":"The ___ you train, the fitter you become.","o":["much","more","most"],"a":1,"why":"The more…, the better… — чем больше, тем лучше."},{"q":"This match is ___ harder than the last one.","o":["very","much","most"],"a":1,"why":"Усиление сравнительной степени — much/far, не very."},{"q":"My ___ brother is a referee too.","o":["elder","older than","eldest than"],"a":0,"why":"elder — о членах семьи перед существительным."},{"q":"It's getting ___.","o":["hot and hot","hotter and hotter","more hot and hot"],"a":1,"why":"Всё больше и больше → hotter and hotter."},{"q":"She speaks English ___ than her colleague.","o":["more fluently","fluenter","more fluent"],"a":0,"why":"Наречие из двух+ слогов → more + наречие."}]},"reading":{"title":"Careless, reckless, excessive force","text":["When a player commits a foul, the referees must decide how serious it is. The Laws use three levels.","Careless means the player didn't pay enough attention or wasn't careful when challenging an opponent. It's a foul, but no disciplinary sanction is needed.","Reckless means the player ignored the danger to the opponent or the possible consequences. A player who commits a reckless foul must be cautioned and shown a yellow card.","Using excessive force means the player used much more force than necessary and endangered the safety of the opponent. This player must be sent off with a red card.","So, the same type of foul — for example, a tackle — can lead to no card, a yellow card or a red card. It depends on how it was done."],"q":[{"q":"What sanction is given for a careless foul?","o":["No card","Yellow card","Red card"],"a":0},{"q":"A player ignores the danger to the opponent. What is this?","o":["Careless","Reckless","Excessive force"],"a":1},{"q":"What is the main idea of the text?","o":["All tackles are red cards","The sanction depends on how the foul was done","Careless fouls are not fouls"],"a":1}]},"listening":{"title":"Arguing about a decision","theme":"life","lines":[["Leo","Did you watch the final? As far as I'm concerned, that red card was a terrible decision."],["Mia","I beg to differ. He went into the tackle with both feet. That's excessive force."],["Leo","That's a fair point, but he did touch the ball first."],["Mia","It doesn't matter if you endanger the safety of an opponent."],["Leo","OK, let me play devil's advocate. What if the other player had jumped into the tackle?"],["Mia","Then it would be different. But I watched the replay three times."],["Leo","Well, I suppose we'll never see eye to eye on this one!"]],"q":[{"q":"What does Mia think of the red card?","o":["It was correct","It was wrong","She didn't see it"],"a":0},{"q":"Which point does Leo accept as fair?","o":["The tackle was dangerous","The player touched the ball first","The referee was far away"],"a":1},{"q":"How does the conversation end?","o":["Leo agrees with Mia","They still disagree","Mia changes her mind"],"a":1}]}},{"title":"Cards · Телефон и сообщения","futsal":[{"en":"caution","ru":"предупреждение (жёлтая карточка) / предупредить","ex":"The player was cautioned for unsporting behaviour."},{"en":"sending-off","ru":"удаление (красная карточка)","ex":"A second caution in the same match leads to a sending-off."},{"en":"to be sent off","ru":"быть удалённым","ex":"He was sent off for violent conduct."},{"en":"dissent","ru":"несогласие с решением (протест)","ex":"Dissent by word or action is punished with a yellow card."},{"en":"unsporting behaviour","ru":"неспортивное поведение","ex":"Removing the shirt after a goal is unsporting behaviour."},{"en":"yellow card","ru":"жёлтая карточка","ex":"The referee showed him a yellow card for dissent."},{"en":"red card","ru":"красная карточка","ex":"A second yellow card means a red card."},{"en":"to book (a player)","ru":"«записать», предупредить (игрока)","ex":"He was booked for delaying the restart."},{"en":"to deceive","ru":"обмануть, ввести в заблуждение","ex":"Players must not try to deceive the referees."},{"en":"to celebrate a goal","ru":"праздновать гол","ex":"A player who removes his shirt to celebrate a goal is cautioned."}],"life":[{"en":"to get through (to)","ru":"дозвониться (до)","ex":"I tried calling the office, but I couldn't get through."},{"en":"to keep someone posted","ru":"держать в курсе","ex":"Keep me posted about the match schedule."},{"en":"to get the wrong end of the stick","ru":"неправильно понять","ex":"I think you got the wrong end of the stick — I wasn't criticising you."},{"en":"to follow up (on)","ru":"вернуться к вопросу, проконтролировать","ex":"I'll follow up on your request tomorrow."},{"en":"to touch base (with)","ru":"связаться, свериться (кратко)","ex":"Let's touch base after the meeting."},{"en":"to beat around the bush","ru":"ходить вокруг да около","ex":"Stop beating around the bush and tell me what happened."},{"en":"to get straight to the point","ru":"сразу перейти к делу","ex":"Let me get straight to the point: we need more referees."},{"en":"to hear (it) through the grapevine","ru":"узнать по сарафанному радио, из слухов","ex":"I heard through the grapevine that you're refereeing the final."},{"en":"to give someone a heads-up","ru":"заранее предупредить","ex":"Thanks for the heads-up about the schedule change."},{"en":"to be in the loop","ru":"быть в курсе дел","ex":"Please keep me in the loop."}],"grammar":{"title":"Gerund vs infinitive","explain":"\n<h4>1. Глаголы + -ing (gerund)</h4>\n<p><i>enjoy, avoid, finish, mind, keep, suggest, practise, consider, deny, admit, miss, risk, imagine, can't stand, can't help, give up, put off, feel like</i></p>\n<p class=\"ex\">I <b>enjoy refereeing</b>. Avoid <b>arguing</b> with the captain. He <b>denied touching</b> the ball.<br>\nDo you <b>mind waiting</b>? I <b>feel like going</b> out. I <b>can't help laughing</b>.</p>\n\n<h4>2. Глаголы + to + infinitive</h4>\n<p><i>want, need, decide, plan, hope, expect, agree, refuse, promise, offer, manage, fail, learn, seem, afford, threaten, tend, would like</i></p>\n<p class=\"ex\">The player <b>refused to leave</b> the pitch. I <b>managed to catch</b> the bus.<br>I <b>can't afford to buy</b> new boots. He <b>seems to be</b> injured.</p>\n\n<h4>3. Глагол + объект + to</h4>\n<p><i>ask, tell, want, allow, advise, expect, encourage, remind, warn</i> + кого + to:</p>\n<p class=\"ex\">The referee <b>told him to move</b> back. I <b>want you to come</b>. (не <s>want that you come</s>)</p>\n\n<h4>4. Без to (bare infinitive)</h4>\n<ul><li>после модальных: <i>can go, must stop</i></li>\n<li><b>make / let</b> + объект: <i>The coach <b>made us run</b>. <b>Let</b> me <b>explain</b>.</i></li>\n<li><b>had better, would rather</b>: <i>You'd better <b>hurry</b>.</i></li></ul>\n<div class=\"note\">⚠️ В пассиве make → с to: <i>We <b>were made to run</b>.</i></div>\n\n<h4>5. Меняют смысл!</h4>\n<table><tr><th>-ing</th><th>to</th></tr>\n<tr><td><b>stop doing</b> — перестать<br><i>Stop talking!</i></td><td><b>stop to do</b> — остановиться, чтобы<br><i>He stopped to tie his laces.</i></td></tr>\n<tr><td><b>remember doing</b> — помнить, что делал<br><i>I remember locking the door.</i></td><td><b>remember to do</b> — не забыть сделать<br><i>Remember to bring your whistle!</i></td></tr>\n<tr><td><b>forget doing</b> — забыть, что делал (чаще в отриц.)<br><i>I'll never forget refereeing my first final.</i></td><td><b>forget to do</b> — забыть сделать<br><i>I forgot to stop the clock.</i></td></tr>\n<tr><td><b>try doing</b> — попробовать (как вариант)<br><i>Try drinking more water.</i></td><td><b>try to do</b> — стараться, пытаться<br><i>I tried to open the door, but it was locked.</i></td></tr>\n<tr><td><b>regret doing</b> — жалеть о сделанном<br><i>I regret shouting at him.</i></td><td><b>regret to tell</b> — с сожалением сообщить<br><i>We regret to inform you…</i></td></tr></table>\n<p><b>Без разницы в смысле:</b> <i>like, love, hate, prefer, start, begin, continue</i>: <i>It started <b>raining</b> / <b>to rain</b>.</i></p>\n\n<h4>6. После предлогов — всегда -ing</h4>\n<p class=\"ex\">cautioned <b>for delaying</b>; interested <b>in learning</b>; good <b>at refereeing</b>; <b>before starting</b>; <b>without asking</b>; <b>instead of playing</b></p>\n<div class=\"note\">⚠️ Ловушка — <b>to</b> как предлог: <i>look forward <b>to seeing</b>, be used <b>to working</b>, object <b>to paying</b>, when it comes <b>to deciding</b></i>.</div>\n\n<h4>7. Gerund как подлежащее</h4>\n<p class=\"ex\"><b>Refereeing</b> futsal is harder than it looks. <b>Learning</b> languages takes time.</p>\n\n<h4>8. Типичные ошибки</h4>\n<div class=\"mist\">❌ I enjoy to watch futsal. → ✅ I enjoy <b>watching</b>…<br>❌ I want that you help me. → ✅ I want <b>you to help</b> me.<br>❌ He made me to wait. → ✅ He made me <b>wait</b>.<br>❌ I look forward to see you. → ✅ …to <b>seeing</b> you.</div>","ex":[{"q":"The defender kept ___ the referee's decision.","o":["to question","questioning","question"],"a":1,"why":"keep + -ing."},{"q":"The coach decided ___ a timeout.","o":["to request","requesting","request"],"a":0,"why":"decide + to + V."},{"q":"He was cautioned for ___ the restart.","o":["to delay","delaying","delay"],"a":1,"why":"После предлога for → -ing."},{"q":"Please stop ___ — I'm trying to concentrate.","o":["to talk","talking","talk"],"a":1,"why":"stop + -ing = перестать что-то делать."},{"q":"I hope ___ an international referee one day.","o":["becoming","to become","become"],"a":1,"why":"hope + to + V."},{"q":"Remember ___ your whistle tomorrow!","o":["bringing","to bring","bring"],"a":1,"why":"remember to do — не забыть сделать."},{"q":"I'll never forget ___ my first final.","o":["to referee","refereeing","referee"],"a":1,"why":"forget doing — помнить опыт из прошлого."},{"q":"The coach made the players ___ ten laps.","o":["to run","run","running"],"a":1,"why":"make + объект + глагол без to."},{"q":"The referee told him ___ back five metres.","o":["move","to move","moving"],"a":1,"why":"tell + объект + to."},{"q":"He denied ___ the ball with his hand.","o":["to touch","touching","touch"],"a":1,"why":"deny + -ing."}]},"reading":{"title":"Cautions — the yellow card","text":["A yellow card shows a caution, and a red card shows a sending-off. Only players, substitutes and team officials can receive cards.","A player is cautioned for: delaying the restart of play; dissent by word or action; entering or leaving the pitch without permission or in the wrong way during a substitution; not respecting the required distance at a restart; persistent offences; and unsporting behaviour.","Unsporting behaviour includes many situations. For example, trying to deceive the referees by pretending to be fouled — this is called simulation. A player is also cautioned for a reckless foul, for stopping a promising attack with a foul, or for removing the shirt to celebrate a goal.","Two cautions in the same match mean a sending-off."],"q":[{"q":"What is 'simulation'?","o":["Pretending to be fouled","Delaying a restart","Leaving the pitch without permission"],"a":0},{"q":"Which of these leads to a caution?","o":["Removing the shirt after a goal","A careless trip","A goal clearance"],"a":0},{"q":"What happens after two cautions in one match?","o":["Nothing","A two-minute break","A sending-off"],"a":2}]},"listening":{"title":"A misunderstanding","theme":"life","lines":[["Sara","Hi Dan, finally! I've been trying to get through to you all morning."],["Dan","Sorry, I was in meetings. Look, about your email — I think you got the wrong end of the stick."],["Sara","Really? It sounded like you were unhappy with my report."],["Dan","Not at all! I just wanted to follow up on a couple of figures. The report is great."],["Sara","Oh, what a relief. I'll check the figures today."],["Dan","Thanks. And keep me posted about the client meeting, OK?"],["Sara","Sure. Let's touch base again on Thursday."]],"q":[{"q":"Why couldn't Sara get through to Dan?","o":["His phone was off","He was in meetings","He was on holiday"],"a":1},{"q":"What did Sara misunderstand?","o":["She thought Dan was unhappy with her report","She thought the meeting was cancelled","She thought she had a new client"],"a":0},{"q":"When will they talk again?","o":["Tomorrow","On Thursday","Next week"],"a":1}]}},{"title":"Red cards · Деньги","futsal":[{"en":"serious foul play","ru":"грубая игра (серьёзное нарушение)","ex":"A tackle with excessive force is serious foul play."},{"en":"violent conduct","ru":"агрессивное поведение","ex":"Hitting an opponent off the ball is violent conduct."},{"en":"simulation","ru":"симуляция","ex":"He fell without contact — that's simulation."},{"en":"persistent offences","ru":"систематические нарушения","ex":"The player was cautioned for persistent offences."},{"en":"offensive, insulting or abusive language","ru":"оскорбительные выражения","ex":"Using abusive language is punished with a red card."},{"en":"to bite","ru":"кусать","ex":"Biting someone is punished with a red card."},{"en":"head-butt","ru":"удар головой (по человеку)","ex":"A head-butt is violent conduct."},{"en":"elbow (n./v.)","ru":"локоть / ударить локтем","ex":"He elbowed the defender in the face."},{"en":"off the ball","ru":"без мяча, вдали от мяча","ex":"The incident happened off the ball."},{"en":"disciplinary committee","ru":"дисциплинарный комитет","ex":"The disciplinary committee decides the length of the suspension."}],"life":[{"en":"to make ends meet","ru":"сводить концы с концами","ex":"Many students work two jobs to make ends meet."},{"en":"to be broke","ru":"быть на мели, без денег","ex":"I can't come out tonight — I'm broke until payday."},{"en":"to cut back on","ru":"сокращать (расходы, потребление)","ex":"We need to cut back on eating out."},{"en":"to cost an arm and a leg","ru":"стоить целое состояние","ex":"Tickets for the final cost an arm and a leg."},{"en":"to pay off (a loan)","ru":"выплатить (кредит, долг)","ex":"It took them ten years to pay off the mortgage."},{"en":"to live beyond your means","ru":"жить не по средствам","ex":"They're living beyond their means."},{"en":"to be in the red","ru":"быть в минусе (по счёту)","ex":"My bank account is in the red again."},{"en":"to save for a rainy day","ru":"откладывать на чёрный день","ex":"Try to save some money for a rainy day."},{"en":"to tighten your belt","ru":"затянуть пояс, экономить","ex":"We'll have to tighten our belts this winter."},{"en":"to be loaded","ru":"быть при деньгах, богатым (разг.)","ex":"His family is loaded."}],"grammar":{"title":"Second conditional (If I were ...)","explain":"\n<h4>1. Образование</h4>\n<p><b>If + Past Simple, would + глагол</b></p>\n<p class=\"ex\">If I <b>had</b> more time, I <b>would study</b> two hours a day.<br><span class=\"t\">Если бы у меня было больше времени, я бы занималась по два часа в день.</span></p>\n<p>Сокращения: I'd, you'd, she'd; отрицание: wouldn't.</p>\n\n<h4>2. Когда используем</h4>\n<ul><li><b>Нереальная ситуация в настоящем:</b> <p class=\"ex\">If I <b>lived</b> in Spain, I <b>would referee</b> in La Liga. (но я не живу в Испании)</p></li>\n<li><b>Маловероятное будущее:</b> <p class=\"ex\">If I <b>won</b> the lottery, I'<b>d travel</b> the world.</p></li>\n<li><b>Советы:</b> <p class=\"ex\">If I <b>were</b> you, I'<b>d apologise</b> to the referee.<br><span class=\"t\">На твоём месте я бы извинилась перед судьёй.</span></p></li>\n<li><b>Вежливые просьбы:</b> <p class=\"ex\">Would you mind if I <b>opened</b> the window? It <b>would be</b> great if you <b>could</b> help.</p></li></ul>\n\n<h4>3. were для всех лиц</h4>\n<p>В формальной речи и устойчивой фразе <b>If I were you</b> — were для I/he/she/it: <i>If she <b>were</b> here, she'd know.</i> В разговоре допустимо was, но <b>If I were you</b> — всегда were.</p>\n\n<h4>4. First vs Second — как выбрать</h4>\n<p>Зависит от того, насколько <b>реально</b> это кажется говорящему:</p>\n<p class=\"ex\">If I <b>get</b> the job, I'<b>ll move</b> to Minsk. (вполне возможно)<br>If I <b>got</b> the job, I'<b>d move</b> to Minsk. (вряд ли получу)</p>\n<p class=\"ex\">If it <b>rains</b>, we'll stay home. — If it <b>snowed</b> in July, I'd be shocked.</p>\n\n<h4>5. Вместо would</h4>\n<p><b>could</b> (смогла бы), <b>might</b> (возможно, стала бы):</p>\n<p class=\"ex\">If I spoke better English, I <b>could</b> referee abroad.<br>If you asked him nicely, he <b>might</b> agree.</p>\n\n<h4>6. I wish + Past Simple</h4>\n<p>Сожаление о настоящем — то же «прошедшее»:</p>\n<p class=\"ex\">I <b>wish</b> I <b>had</b> more free time. (жаль, что нет)<br>I <b>wish</b> I <b>were</b> taller. I wish I <b>could</b> speak Spanish.</p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ If I would have money, I would buy… → ✅ If I <b>had</b> money, I would buy…<br>\n❌ If I am you, I'd… → ✅ If I <b>were</b> you, I'd…<br>\n❌ I wish I have a car. → ✅ I wish I <b>had</b> a car.</div>","ex":[{"q":"If I ___ rich, I would buy a house by the sea.","o":["am","were","will be"],"a":1,"why":"Нереальное настоящее → If I were."},{"q":"If you were the referee, what ___ you do?","o":["will","would","do"],"a":1,"why":"Главная часть → would."},{"q":"I ___ more if I didn't have so much work.","o":["would travel","will travel","travelled"],"a":0,"why":"would + V."},{"q":"If he ___ the rules better, he wouldn't argue so much.","o":["knows","knew","would know"],"a":1,"why":"После if — Past Simple."},{"q":"If it rains tomorrow, we ___ the match indoors. (реальная ситуация)","o":["would play","will play","played"],"a":1,"why":"Реальная ситуация → First conditional (will)."},{"q":"I wish I ___ more free time.","o":["have","had","would have"],"a":1,"why":"I wish + Past Simple для сожаления о настоящем."},{"q":"If I spoke Spanish, I ___ referee in Spain.","o":["can","could","will"],"a":1,"why":"Вместо would можно could (смогла бы)."},{"q":"If I ___ you, I'd take the exam this year.","o":["was","were","am"],"a":1,"why":"If I were you — устойчивая фраза."},{"q":"It would be great if you ___ help me with the report.","o":["can","could","will"],"a":1,"why":"Вежливая просьба: if you could."},{"q":"If I get the job, I ___ to Minsk. (вполне реально)","o":["would move","will move","moved"],"a":1,"why":"Реальная ситуация → First conditional."}]},"reading":{"title":"Sending-off offences","text":["A player or substitute is sent off for: serious foul play; violent conduct; biting or spitting at someone; using offensive, insulting or abusive language or gestures; receiving a second caution in the same match; and some situations of denying a goal or an obvious goalscoring opportunity.","Serious foul play is a tackle or challenge for the ball that endangers the safety of an opponent or uses excessive force or brutality.","Violent conduct is different: it is not a challenge for the ball. For example, a player strikes an opponent when the ball is far away, or deliberately hits someone on the head or face.","A player who is sent off must leave the area around the pitch and the technical area. In futsal, the team then plays with one player fewer for two minutes."],"q":[{"q":"What is the difference between serious foul play and violent conduct?","o":["Violent conduct is not a challenge for the ball","Serious foul play is only verbal","There is no difference"],"a":0},{"q":"Which of these is a sending-off offence?","o":["Dissent","A second caution","Delaying the restart"],"a":1},{"q":"Where must a sent-off player go?","o":["To the bench","Away from the pitch and technical area","To the timekeeper's table"],"a":1}]},"listening":{"title":"Red card report","theme":"futsal","lines":[["Referee","Let's write the report for the red card in the second half."],["Second referee","OK. It was number eleven from the white team, at minute thirty-four."],["Referee","Right. The ball was on the other side of the pitch, so it wasn't a challenge for the ball."],["Second referee","Exactly. He hit the opponent in the face with his elbow. I saw it clearly."],["Referee","So the offence is violent conduct, not serious foul play."],["Second referee","Yes. And after the card, he used abusive language towards you, didn't he?"],["Referee","He did. We need to mention that too. The disciplinary committee will decide the punishment."]],"q":[{"q":"Why isn't it serious foul play?","o":["Because it wasn't a challenge for the ball","Because nobody was hurt","Because it was in the first half"],"a":0},{"q":"What did the player do?","o":["Pushed the opponent","Hit the opponent with his elbow","Tripped the opponent"],"a":1},{"q":"Who will decide the final punishment?","o":["The referee","The coach","The disciplinary committee"],"a":2}]}},{"title":"Accumulated fouls · Погода","futsal":[{"en":"accumulated foul","ru":"накопленный (командный) фол","ex":"Every direct free kick offence counts as an accumulated foul."},{"en":"DFKSAF","ru":"штрафной за 6-й и последующие фолы (direct free kick from the sixth accumulated foul)","ex":"The DFKSAF can be taken from the 10 m mark."},{"en":"wall","ru":"стенка","ex":"Defenders can't form a wall at a DFKSAF."},{"en":"advantage","ru":"преимущество (продолжение игры после нарушения)","ex":"The referee played advantage because the attack continued."},{"en":"to apply the advantage","ru":"применить преимущество","ex":"The referees can't apply the advantage after the fifth accumulated foul (unless there is a clear goalscoring chance)."},{"en":"to play on","ru":"продолжить игру (не останавливать)","ex":"The referee shouted 'Play on!' and signalled advantage."},{"en":"to record","ru":"зафиксировать, записать","ex":"The third referee records every accumulated foul."},{"en":"tally","ru":"подсчёт, количество (фолов)","ex":"Each team's tally starts from zero in each period."},{"en":"offending team","ru":"нарушившая команда","ex":"The offending team has already committed five fouls."},{"en":"non-offending team","ru":"пострадавшая команда","ex":"Advantage is played if it benefits the non-offending team."}],"life":[{"en":"to be soaked to the skin","ru":"промокнуть до нитки","ex":"I forgot my umbrella and got soaked to the skin."},{"en":"a heatwave","ru":"аномальная жара","ex":"The tournament was played during a heatwave."},{"en":"to clear up","ru":"проясниться (о погоде)","ex":"It's cloudy now, but it should clear up by the afternoon."},{"en":"to drizzle","ru":"моросить","ex":"It's only drizzling — we don't need a taxi."},{"en":"to be snowed under (with)","ru":"быть заваленным (работой)","ex":"I'm snowed under with paperwork this week."},{"en":"It's raining cats and dogs","ru":"Льёт как из ведра","ex":"Take a taxi — it's raining cats and dogs!"},{"en":"a cold snap","ru":"резкое похолодание","ex":"A cold snap is expected this weekend."},{"en":"scorching (hot)","ru":"палящий, обжигающе жаркий","ex":"It was a scorching day in Seville."},{"en":"to brave the weather","ru":"не испугаться непогоды","ex":"Hundreds of fans braved the weather to see the match."},{"en":"to steal someone's thunder","ru":"перехватить чужую славу, «украсть» успех","ex":"She stole my thunder by announcing the news first."}],"grammar":{"title":"Countable & uncountable: much, many, a few, a little","explain":"\n<h4>1. Исчисляемые и неисчисляемые</h4>\n<p><b>Исчисляемые</b> — можно посчитать, есть мн. число: <i>a foul → fouls, a player → players, a card → cards</i>.</p>\n<p><b>Неисчисляемые</b> — нет мн. числа, нет a/an, глагол в ед. числе:</p>\n<ul><li>вещества: <i>water, money, food, bread, rice</i></li>\n<li>абстрактные: <i>time, help, advice, information, knowledge, progress, fun</i></li>\n<li>собирательные: <i>equipment, luggage, furniture, homework, research, traffic</i></li></ul>\n\n<h4>2. Ловушки для русскоговорящих</h4>\n<p>В русском они исчисляемые, а в английском — нет:</p>\n<table><tr><th>Неисчисляемое</th><th>«Одна штука»</th></tr>\n<tr><td>advice (совет/советы)</td><td>a piece of advice</td></tr>\n<tr><td>information</td><td>a piece of information</td></tr>\n<tr><td>news (новость/новости)</td><td>a piece of news</td></tr>\n<tr><td>equipment</td><td>a piece of equipment</td></tr>\n<tr><td>luggage / baggage</td><td>a bag, a suitcase</td></tr>\n<tr><td>furniture</td><td>a piece of furniture</td></tr>\n<tr><td>homework / work</td><td>a task, a job</td></tr>\n<tr><td>money</td><td>a coin, a note</td></tr></table>\n<div class=\"note\">⚠️ <b>news</b> — с глаголом в ед. числе: <i>The news <b>is</b> good.</i> (не <s>are</s>)<br>⚠️ <b>police</b> — наоборот, всегда мн. число: <i>The police <b>are</b> here.</i></div>\n\n<h4>3. Слова-количества</h4>\n<table><tr><th></th><th>Исчисляемые</th><th>Неисчисляемые</th></tr>\n<tr><td>много</td><td>many</td><td>much</td></tr>\n<tr><td>оба</td><td colspan=\"2\">a lot of / lots of / plenty of</td></tr>\n<tr><td>несколько, немного</td><td>a few</td><td>a little</td></tr>\n<tr><td>мало (недостаточно)</td><td>few</td><td>little</td></tr>\n<tr><td>сколько?</td><td>How many?</td><td>How much?</td></tr>\n<tr><td>меньше</td><td>fewer</td><td>less</td></tr></table>\n<p class=\"ex\">There were <b>a few</b> fans in the hall. (несколько — нормально)<br>There were <b>few</b> fans in the hall. (мало — плохо)<br>I have <b>a little</b> time. (немного есть) / I have <b>little</b> time. (почти нет)</p>\n<div class=\"note\">⚠️ <b>much</b> в утвердительных предложениях звучит книжно. Разговорно: <i>I have <b>a lot of</b> work.</i>, а much — в вопросах и отрицаниях: <i>I don't have <b>much</b> time.</i></div>\n\n<h4>4. Слова с двумя значениями</h4>\n<p class=\"ex\"><b>time</b> — время (неисч.) / <b>a time</b> — раз (исч.): <i>I don't have time. I've been there three times.</i><br>\n<b>paper</b> — бумага / <b>a paper</b> — газета, доклад<br>\n<b>experience</b> — опыт (неисч.) / <b>an experience</b> — случай, впечатление<br>\n<b>coffee</b> — кофе / <b>a coffee</b> — чашка кофе (в кафе)</p>\n\n<h4>5. some / any</h4>\n<p><b>some</b> — в утверждениях и просьбах/предложениях; <b>any</b> — в отрицаниях и вопросах:</p>\n<p class=\"ex\">I have <b>some</b> questions. Would you like <b>some</b> water? — Do you have <b>any</b> questions? I don't have <b>any</b> money.</p>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ an advice / advices → ✅ <b>a piece of</b> advice / some advice<br>❌ informations → ✅ information<br>❌ How much players? → ✅ How <b>many</b> players?<br>❌ The news are bad. → ✅ The news <b>is</b> bad.</div>","ex":[{"q":"How ___ accumulated fouls does the blue team have?","o":["much","many","little"],"a":1,"why":"fouls — исчисляемое → many."},{"q":"How ___ time is left in the first period?","o":["much","many","few"],"a":0,"why":"time — неисчисляемое → much."},{"q":"Can I give you ___?","o":["an advice","a piece of advice","advices"],"a":1,"why":"advice неисчисляемое → a piece of advice."},{"q":"I have ___ friends in London, so I'm not alone there.","o":["a few","a little","much"],"a":0,"why":"friends — исчисляемое, «несколько» → a few."},{"q":"Players must check their ___ before the match.","o":["equipments","equipment","an equipment"],"a":1,"why":"equipment — неисчисляемое, без -s."},{"q":"The news ___ good: you're refereeing the final!","o":["are","is","were"],"a":1,"why":"news — неисчисляемое, глагол в ед. числе."},{"q":"There were ___ fans, so the hall was almost empty.","o":["a few","few","little"],"a":1,"why":"few = мало (с негативным оттенком), исчисляемое."},{"q":"I've been to Spain three ___.","o":["time","times","timing"],"a":1,"why":"a time = раз (исчисляемое)."},{"q":"Do you have ___ questions?","o":["some","any","much"],"a":1,"why":"Вопрос → any."},{"q":"There are ___ referees this year than last year.","o":["less","fewer","little"],"a":1,"why":"referees — исчисляемые → fewer."}]},"reading":{"title":"Law 13 — Accumulated Fouls","text":["Accumulated fouls are all offences that are punished with a direct free kick. Each team's fouls are counted separately in each period, starting from zero. If there is extra time, the fouls from the second period continue to count.","For the first five accumulated fouls, the opponents can form a wall at the free kick. But from the sixth foul in a period, every foul is punished with a special direct free kick — a DFKSAF. Defenders cannot form a wall. Only the goalkeeper defends, and the kicker must try to score directly.","The DFKSAF is taken from the 10 m mark. If the foul happened closer to the goal than 10 m (but outside the penalty area), the team can choose to take it from the place of the foul instead. If the sixth foul happens inside the penalty area, it's a penalty kick.","The referees can play advantage for an accumulated foul only if the team has committed fewer than five fouls before — unless there is a clear goalscoring opportunity."],"q":[{"q":"From which foul is there no wall?","o":["The fifth","The sixth","The tenth"],"a":1},{"q":"Where is the DFKSAF normally taken from?","o":["The penalty mark","The 10 m mark","The halfway line"],"a":1},{"q":"The team's sixth foul happens inside its penalty area. What is given?","o":["DFKSAF","Penalty kick","Indirect free kick"],"a":1}]},"listening":{"title":"Weekend weather","theme":"life","lines":[["Jess","Have you seen the forecast? After last week's heatwave, it's going to pour all weekend."],["Rob","I know. I got soaked to the skin on my way home yesterday."],["Jess","We wanted to go hiking on Saturday, but I think we'll have to cancel."],["Rob","Not necessarily. The forecast says it'll only drizzle in the morning and clear up by noon."],["Jess","Even so, I'm snowed under with work. I need to prepare for a referee course on Monday."],["Rob","Then let's go next weekend. It's supposed to be sunny."],["Jess","Deal."]],"q":[{"q":"What happened to Rob yesterday?","o":["He got very wet","He got sunburnt","He missed his bus"],"a":0},{"q":"What will the weather be like on Saturday afternoon?","o":["Heavy rain","It should clear up","Snow"],"a":1},{"q":"Why can't Jess go hiking this weekend?","o":["She's ill","She's snowed under with work","She's working at a tournament"],"a":1}]}},{"title":"Free kicks · Друзья","futsal":[{"en":"indirect free kick","ru":"свободный удар","ex":"A goal can't be scored directly from an indirect free kick."},{"en":"four-second count","ru":"отсчёт четырёх секунд","ex":"The referee shows the four-second count with his fingers."},{"en":"quick free kick","ru":"быстро разыгранный штрафной","ex":"The team took a quick free kick before the defenders were ready."},{"en":"stationary","ru":"неподвижный","ex":"The ball must be stationary when the free kick is taken."},{"en":"to retake","ru":"перебить, повторить удар","ex":"The free kick must be retaken."},{"en":"required distance","ru":"установленная дистанция","ex":"Failing to respect the required distance is a caution."},{"en":"kicker","ru":"бьющий (игрок)","ex":"The kicker must not touch the ball again until another player has touched it."},{"en":"to raise an arm","ru":"поднять руку (сигнал)","ex":"For an indirect free kick, the referees raise an arm above the head."},{"en":"to lift the ball","ru":"поднять мяч (ногой)","ex":"A free kick can be taken by lifting the ball with a foot."},{"en":"penalty-area line","ru":"линия штрафной площади","ex":"The indirect free kick was taken on the penalty-area line."}],"life":[{"en":"to fall out (with)","ru":"поссориться (с)","ex":"They fell out over money."},{"en":"to make up","ru":"помириться","ex":"They argued, but they made up the next day."},{"en":"to keep in touch","ru":"поддерживать связь","ex":"We've kept in touch since the tournament in Spain."},{"en":"to drift apart","ru":"отдалиться друг от друга","ex":"We drifted apart after school."},{"en":"to have someone's back","ru":"прикрывать, поддерживать кого-то","ex":"Don't worry, your second referee has your back."},{"en":"to look up to","ru":"уважать, равняться на","ex":"I've always looked up to my first referee instructor."},{"en":"to let someone down","ru":"подвести кого-то","ex":"I promised to help and I won't let you down."},{"en":"a fair-weather friend","ru":"друг только в хорошие времена","ex":"He turned out to be a fair-weather friend."},{"en":"to stand by someone","ru":"поддерживать кого-то, быть рядом","ex":"My family stood by me after the injury."},{"en":"to bury the hatchet","ru":"зарыть топор войны, помириться","ex":"After years of arguing, they finally buried the hatchet."}],"grammar":{"title":"Articles: a / an / the / —","explain":"\n<h4>1. a / an — неопределённый артикль</h4>\n<ul><li>Один из многих, <b>впервые упоминается</b>: <i>The referee awarded <b>a</b> free kick.</i></li>\n<li><b>Профессия:</b> <i>She's <b>a</b> referee. He's <b>an</b> engineer.</i> (в русском — без слова, в английском обязательно!)</li>\n<li>«Один», «какой-то»: <i>I'll be there in <b>an</b> hour. I need <b>a</b> pen.</i></li>\n<li><b>Классификация/описание:</b> <i>It was <b>a</b> difficult match. Futsal is <b>a</b> fast game.</i></li>\n<li>«В/за»: <i>twice <b>a</b> week, 50 km <b>an</b> hour</i></li></ul>\n<div class=\"note\">⚠️ a/an выбирается по <b>звуку</b>, а не по букве:<br><b>an</b> hour, <b>an</b> honest man (h не читается), <b>an</b> MBA [em]<br><b>a</b> university, <b>a</b> European team, <b>a</b> one-minute timeout ([j], [w] — согласные звуки)</div>\n\n<h4>2. the — определённый артикль</h4>\n<ul><li><b>Уже упоминали:</b> <i>The referee awarded a free kick. <b>The</b> free kick was taken quickly.</i></li>\n<li><b>Понятно из ситуации, о чём речь:</b> <i>Close <b>the</b> door. Where's <b>the</b> ball?</i></li>\n<li><b>Единственный в своём роде:</b> <i><b>the</b> sun, <b>the</b> referee (матча), <b>the</b> halfway line, <b>the</b> captain</i></li>\n<li><b>Превосходная степень и порядковые:</b> <i><b>the</b> best, <b>the</b> first period, <b>the</b> sixth foul</i></li>\n<li>С уточнением of/who/that: <i><b>the</b> Laws <b>of</b> the Game, <b>the</b> player <b>who</b> scored</i></li></ul>\n\n<h4>3. Без артикля (нулевой)</h4>\n<ul><li>Мн. число и неисчисляемые <b>в общем смысле</b>: <i><b>Referees</b> must be fit. <b>Water</b> is important.</i><br>Сравните: <i><b>The</b> referees of this match were great.</i> (конкретные)</li>\n<li><b>Виды спорта, игры:</b> <i>play futsal, play chess</i></li>\n<li><b>Приёмы пищи:</b> <i>have breakfast / lunch / dinner</i></li>\n<li><b>Языки:</b> <i>I speak English.</i> (но <i>the English language</i>)</li>\n<li><b>Большинство стран, городов, континентов:</b> <i>Belarus, Spain, Minsk, Europe</i></li>\n<li>Устойчивые: <i>at home, at work, go to bed, by bus, in the morning (но at night), next week, last year</i></li></ul>\n\n<h4>4. Исключения с географией</h4>\n<p><b>the</b>: страны-«объединения» и во мн. числе (<i>the UK, the USA, the Netherlands</i>), реки, моря, океаны (<i>the Thames, the Black Sea</i>), горные цепи (<i>the Alps</i>).<br>\nБез артикля: отдельные горы и озёра (<i>Everest, Lake Geneva</i>).</p>\n\n<h4>5. Учреждения: school, hospital, prison, church</h4>\n<p>Без артикля — по их прямому назначению; с the — как здание:</p>\n<p class=\"ex\">He's <b>in hospital</b>. (лечится)<br>I went to <b>the hospital</b> to visit him. (как посетитель)</p>\n\n<h4>6. Типичные ошибки</h4>\n<div class=\"mist\">❌ She is referee. → ✅ She is <b>a</b> referee.<br>❌ The life is beautiful. → ✅ <b>Life</b> is beautiful.<br>❌ I play the futsal. → ✅ I play <b>futsal</b>.<br>❌ It was a best match. → ✅ It was <b>the</b> best match.<br>❌ a hour → ✅ <b>an</b> hour; ❌ an university → ✅ <b>a</b> university</div>","ex":[{"q":"The referees awarded ___ indirect free kick.","o":["a","an","—"],"a":1,"why":"Перед гласным звуком (indirect) → an."},{"q":"___ ball must be stationary on the centre mark.","o":["A","The","—"],"a":1,"why":"Конкретный мяч матча → the."},{"q":"I play ___ futsal twice a week.","o":["the","a","—"],"a":2,"why":"Виды спорта — без артикля."},{"q":"She's ___ referee. She works in ___ national league.","o":["a / the","the / a","— / the"],"a":0,"why":"Профессия → a; конкретная лига → the."},{"q":"I'll be there in ___ hour.","o":["a","an","the"],"a":1,"why":"hour начинается с гласного звука [aʊ] → an."},{"q":"It was ___ one-minute timeout.","o":["a","an","—"],"a":0,"why":"one читается [wʌn] — согласный звук → a."},{"q":"She studied at ___ university in Minsk.","o":["an","a","the"],"a":1,"why":"university [juː] — согласный звук → a."},{"q":"___ referees must be physically fit. (в общем)","o":["The","—","A"],"a":1,"why":"Мн. число в общем смысле — без артикля."},{"q":"My grandfather is in ___ hospital. (лечится)","o":["the","a","—"],"a":2,"why":"Учреждение по назначению — без артикля."},{"q":"We're flying to ___ Netherlands for the tournament.","o":["—","the","a"],"a":1,"why":"Страны во мн. числе → the Netherlands."}]},"reading":{"title":"Law 13 — Free Kicks","text":["There are two types of free kick: direct and indirect. From a direct free kick, a goal can be scored directly against the opponents. From an indirect free kick, a goal counts only if another player touches the ball after the kick. To show an indirect free kick, the referees raise one arm above the head.","At a free kick, the ball must be stationary, and the opponents must be at least 5 metres away until the ball is in play. The ball is in play when it is kicked and clearly moves. The kicker must not touch the ball again until another player has touched it.","The free kick must be taken within four seconds. One of the referees shows the four-second count with their hand. If the kick is not taken in time, an indirect free kick is given to the other team.","An indirect free kick for the attacking team inside the penalty area is taken from the penalty area line, at the point nearest to where the offence happened."],"q":[{"q":"How do the referees show an indirect free kick?","o":["One arm raised above the head","Pointing to the penalty mark","Two whistles"],"a":0},{"q":"How far must the opponents be at a free kick?","o":["3 m","5 m","10 m"],"a":1},{"q":"What happens if the free kick is not taken within four seconds?","o":["It is retaken","An indirect free kick to the other team","A caution"],"a":1}]},"listening":{"title":"Old friends","theme":"life","lines":[["Nina","Do you still keep in touch with Lucy?"],["Ben","Not really. We fell out last year over something silly, and then we just drifted apart."],["Nina","That's a shame. You two used to be inseparable."],["Ben","I know. Honestly, I miss her. She always had my back, especially when things were hard at work."],["Nina","Then why don't you call her? Life's too short."],["Ben","You're right. Maybe it's time to make up."],["Nina","She'll be happy to hear from you, I'm sure."]],"q":[{"q":"What happened between Ben and Lucy?","o":["They fell out and drifted apart","They moved to different cities","They started working together"],"a":0},{"q":"What does Ben miss about Lucy?","o":["Her jokes","She always supported him","Her cooking"],"a":1},{"q":"What does Ben decide?","o":["To forget about Lucy","To call her and make up","To write her a letter"],"a":1}]}},{"title":"Penalty kick · Дом","futsal":[{"en":"penalty kick","ru":"пенальти (6-метровый удар)","ex":"A penalty kick is taken from the penalty mark."},{"en":"to award","ru":"назначить (удар)","ex":"The referee awarded a penalty kick."},{"en":"to back-heel","ru":"ударить пяткой","ex":"Back-heeling is permitted if the ball moves forwards."},{"en":"to face the kicker","ru":"стоять лицом к бьющему","ex":"The goalkeeper must stay on the goal line, facing the kicker."},{"en":"penalty shoot-out","ru":"серия пенальти","ex":"The match was decided by a penalty shoot-out."},{"en":"to save (a shot)","ru":"отбить (удар), спасти","ex":"The goalkeeper saved the penalty."},{"en":"to miss","ru":"промахнуться, не забить","ex":"He missed the penalty — the ball went wide."},{"en":"to be clearly identified","ru":"быть чётко определённым","ex":"The player taking the penalty must be clearly identified."},{"en":"to complete (a kick)","ru":"завершить (удар)","ex":"The period ends when the penalty kick has been completed."},{"en":"to go wide","ru":"пройти мимо ворот","ex":"The shot went wide of the right post."}],"life":[{"en":"to settle in","ru":"обустроиться, освоиться","ex":"Have you settled in to your new flat yet?"},{"en":"to do up (a flat)","ru":"сделать ремонт","ex":"We're doing up the kitchen this summer."},{"en":"to put up with","ru":"терпеть, мириться с","ex":"I can't put up with the noise any longer."},{"en":"a deposit","ru":"залог, депозит","ex":"The landlord asked for a two-month deposit."},{"en":"to declutter","ru":"расхламить, избавиться от лишнего","ex":"I decluttered my wardrobe and gave away ten bags of clothes."},{"en":"to move out","ru":"съехать","ex":"I moved out of my parents' flat at twenty."},{"en":"a flatmate","ru":"сосед по квартире","ex":"My flatmate always leaves dishes in the sink."},{"en":"household bills","ru":"коммунальные платежи","ex":"We split the household bills equally."},{"en":"Make yourself at home","ru":"Чувствуй себя как дома","ex":"Come in and make yourself at home!"},{"en":"cramped","ru":"тесный","ex":"The changing room for referees was really cramped."}],"grammar":{"title":"Prepositions of time and place: in, on, at","explain":"\n<h4>1. Время: AT — точка</h4>\n<p class=\"ex\"><b>at</b> 7 pm, <b>at</b> noon, <b>at</b> midnight, <b>at</b> half-time, <b>at</b> the end of the match, <b>at</b> the moment, <b>at</b> night, <b>at</b> the weekend (BrE), <b>at</b> Christmas</p>\n\n<h4>2. Время: ON — день</h4>\n<p class=\"ex\"><b>on</b> Saturday, <b>on</b> 5 May, <b>on</b> my birthday, <b>on</b> Christmas Day, <b>on</b> Monday morning, <b>on</b> weekdays, <b>on</b> the weekend (AmE)</p>\n\n<h4>3. Время: IN — период</h4>\n<p class=\"ex\"><b>in</b> May, <b>in</b> 2026, <b>in</b> summer, <b>in</b> the 1990s, <b>in</b> the morning/afternoon/evening, <b>in</b> the second period, <b>in</b> extra time</p>\n<p><b>in</b> = «через» (о будущем): <i>The match starts <b>in</b> ten minutes.</i></p>\n\n<div class=\"note\">⚠️ Без предлога: <b>this/next/last/every</b> + время: <i><s>on</s> next Monday</i> → <b>next Monday</b>; <i>last year, this morning, every day, tomorrow, yesterday</i>.</div>\n<div class=\"note\">⚠️ <b>in the morning</b>, но <b>on</b> Monday morning; <b>in the evening</b>, но <b>at night</b>.</div>\n\n<h4>4. on time vs in time</h4>\n<p class=\"ex\"><b>on time</b> — точно по расписанию: <i>The match started <b>on time</b>.</i><br><b>in time</b> — успеть (не опоздать): <i>We arrived <b>in time</b> for the kick-off.</i></p>\n\n<h4>5. Место: AT — точка, место события</h4>\n<p class=\"ex\"><b>at</b> the table, <b>at</b> the door, <b>at</b> the corner arc, <b>at</b> the bus stop, <b>at</b> home, <b>at</b> work, <b>at</b> school, <b>at</b> a match, <b>at</b> a party, <b>at</b> the airport</p>\n\n<h4>6. Место: ON — поверхность, линия</h4>\n<p class=\"ex\"><b>on</b> the pitch, <b>on</b> the touchline, <b>on</b> the goal line, <b>on</b> the floor, <b>on</b> the wall, <b>on</b> the bench, <b>on</b> page 5, <b>on</b> the bus/train/plane, <b>on</b> TV, <b>on</b> the internet</p>\n\n<h4>7. Место: IN — внутри</h4>\n<p class=\"ex\"><b>in</b> the penalty area, <b>in</b> the technical area, <b>in</b> the net, <b>in</b> the room, <b>in</b> Minsk, <b>in</b> Belarus, <b>in</b> a car, <b>in</b> a taxi, <b>in</b> the picture, <b>in</b> the newspaper</p>\n<div class=\"note\">⚠️ Транспорт: <b>on</b> the bus / train / plane (можно ходить внутри), но <b>in</b> a car / taxi. Способ передвижения: <b>by</b> bus, <b>by</b> car (без артикля), но <b>on foot</b>.</div>\n<div class=\"note\">⚠️ Футзал: <b>on</b> the pitch (на площадке), но <b>in</b> the penalty area (внутри зоны), <b>at</b> the timekeeper's table, <b>in</b> the stands (на трибунах).</div>\n\n<h4>8. Направление</h4>\n<p class=\"ex\"><b>to</b> — куда: go <b>to</b> the hall (но go <b>home</b> — без to!)<br><b>into</b> — внутрь: The ball went <b>into</b> the net.<br><b>onto</b> — на поверхность: The dog ran <b>onto</b> the pitch.<br><b>arrive in</b> (город, страна) / <b>arrive at</b> (здание, место): <i>arrive <b>in</b> Lisbon, arrive <b>at</b> the airport</i> — никогда <s>arrive to</s></p>\n\n<h4>9. Типичные ошибки</h4>\n<div class=\"mist\">❌ on next week → ✅ <b>next week</b><br>❌ in Monday → ✅ <b>on</b> Monday<br>❌ arrive to Minsk → ✅ arrive <b>in</b> Minsk<br>❌ go to home → ✅ go <b>home</b><br>❌ in the bus → ✅ <b>on</b> the bus</div>","ex":[{"q":"The goalkeeper must stay ___ the goal line.","o":["in","on","at"],"a":1,"why":"Линия → on."},{"q":"The offence happened ___ the penalty area.","o":["in","on","at"],"a":0,"why":"Внутри области → in."},{"q":"The match starts ___ 6:30 ___ Friday.","o":["at / on","in / at","on / in"],"a":0,"why":"Время → at; день недели → on."},{"q":"I was born ___ 1998.","o":["on","at","in"],"a":2,"why":"Год → in."},{"q":"The third referee sits ___ the timekeeper's table.","o":["at","in","on"],"a":0,"why":"Точка, место у стола → at."},{"q":"We'll leave ___ next Monday.","o":["on","in","— (без предлога)"],"a":2,"why":"next + время — без предлога."},{"q":"The ball went ___ the net.","o":["into","onto","at"],"a":0,"why":"Движение внутрь → into."},{"q":"We arrived ___ Lisbon at midnight.","o":["to","in","at"],"a":1,"why":"arrive in + город."},{"q":"The match starts ___ ten minutes. Hurry!","o":["after","in","on"],"a":1,"why":"in = через (о будущем)."},{"q":"I usually go to the hall ___ bus, but today I'm ___ foot.","o":["by / on","on / by","with / on"],"a":0,"why":"by bus, on foot."}]},"reading":{"title":"Law 14 — The Penalty Kick","text":["A penalty kick is awarded when a player commits a direct free kick offence inside their own penalty area. The ball is placed on the penalty mark, 6 metres from the goal.","The kicker must be clearly identified. The defending goalkeeper must stay on the goal line, between the posts, facing the kicker, until the ball is kicked. At the moment of the kick, at least part of one of the goalkeeper's feet must be touching, in line with or behind the goal line.","All other players must be on the pitch, at least 5 metres from the penalty mark, behind it and outside the penalty area.","The kicker must kick the ball forwards; back-heeling is allowed if the ball moves forwards. The kicker cannot touch the ball again until another player has touched it. If a penalty is awarded just before the end of a period, the period continues until the kick is completed."],"q":[{"q":"Where must the goalkeeper stand?","o":["On the goal line, facing the kicker","Anywhere in the penalty area","5 m from the ball"],"a":0},{"q":"Can the kicker back-heel the ball?","o":["Never","Yes, if the ball moves forwards","Only in a shoot-out"],"a":1},{"q":"Where must the other players be?","o":["Inside the penalty area","At least 5 m from the mark, behind it, outside the area","On the halfway line"],"a":1}]},"listening":{"title":"Penalty instructions","theme":"futsal","lines":[["Referee","Number seven, are you taking the penalty?"],["Player","Yes, I am."],["Referee","OK. Wait for my whistle. Goalkeeper, stay on the line until the ball is kicked, please."],["Goalkeeper","Can I move along the line?"],["Referee","Yes, you can move sideways, but don't come off the line, and don't touch the posts or the net."],["Referee","Everybody else — outside the penalty area and five metres behind the ball. Number four, move back, please!"],["Player","Ready."],["Referee","Go ahead."]],"q":[{"q":"What can the goalkeeper do?","o":["Move forward","Move sideways along the line","Hold the crossbar"],"a":1},{"q":"Why does the referee talk to number four?","o":["He is too close","He is the kicker","He is injured"],"a":0},{"q":"When can the kicker take the penalty?","o":["Immediately","After the referee's whistle","After the timekeeper's signal"],"a":1}]}},{"title":"Goalkeeper · Вежливые просьбы","futsal":[{"en":"goal clearance","ru":"ввод мяча вратарём (рукой)","ex":"The goal clearance is thrown or released by the goalkeeper."},{"en":"to release the ball","ru":"выпустить мяч из рук, ввести в игру","ex":"The goalkeeper must release the ball within four seconds."},{"en":"to be in control of the ball","ru":"контролировать мяч","ex":"The goalkeeper can't control the ball in his own half for more than four seconds."},{"en":"deliberately played (back pass)","ru":"намеренно отданный (пас назад)","ex":"The goalkeeper touched the ball again after it was deliberately played back by a team-mate."},{"en":"team-mate","ru":"партнёр по команде","ex":"He passed the ball to a team-mate."},{"en":"to throw","ru":"бросить (рукой)","ex":"The goalkeeper threw the ball to a team-mate."},{"en":"to catch","ru":"поймать","ex":"The goalkeeper caught the ball safely."},{"en":"to handle the ball","ru":"играть рукой","ex":"The goalkeeper may handle the ball only inside the penalty area."},{"en":"to touch the ball twice","ru":"дважды коснуться мяча","ex":"The goalkeeper touched the ball twice after the goal clearance."},{"en":"to delay (the restart)","ru":"затягивать (возобновление)","ex":"A goalkeeper outside the area may be cautioned for delaying the restart."}],"life":[{"en":"Would it be possible to ...?","ru":"Можно ли было бы ...? (вежливо)","ex":"Would it be possible to change my seat?"},{"en":"I'd appreciate it if ...","ru":"Я была бы признательна, если ...","ex":"I'd appreciate it if you could reply by Friday."},{"en":"to turn down","ru":"отклонить, отказаться (от предложения)","ex":"She turned down the job offer."},{"en":"to put someone on the spot","ru":"поставить в неловкое положение","ex":"Sorry to put you on the spot, but what's your decision?"},{"en":"No hard feelings","ru":"Без обид","ex":"I voted for the other plan, but no hard feelings!"},{"en":"Do you happen to know ...?","ru":"Вы случайно не знаете ...?","ex":"Do you happen to know where the referees' room is?"},{"en":"Would you be so kind as to ...?","ru":"Не будете ли вы так любезны ...?","ex":"Would you be so kind as to close the door?"},{"en":"to take someone up on (an offer)","ru":"принять чьё-то предложение","ex":"I'll take you up on that offer of a lift."},{"en":"I'm afraid ...","ru":"Боюсь, что ... (вежливый отказ / плохая новость)","ex":"I'm afraid the match has been cancelled."},{"en":"to bend over backwards","ru":"из кожи вон лезть (чтобы помочь)","ex":"The organisers bent over backwards to help us."}],"grammar":{"title":"Reported speech (statements and questions)","explain":"\n<h4>1. Сдвиг времён (backshift)</h4>\n<p>Если вводный глагол в прошедшем (<i>said, told, asked</i>), время обычно сдвигается «на шаг назад»:</p>\n<table><tr><th>Прямая речь</th><th>Косвенная речь</th></tr>\n<tr><td>Present Simple: \"I <b>am</b> tired.\"</td><td>Past Simple: She said she <b>was</b> tired.</td></tr>\n<tr><td>Present Continuous: \"I'<b>m waiting</b>.\"</td><td>Past Continuous: …she <b>was waiting</b>.</td></tr>\n<tr><td>Past Simple: \"I <b>saw</b> the foul.\"</td><td>Past Perfect: …he <b>had seen</b> the foul.</td></tr>\n<tr><td>Present Perfect: \"I'<b>ve finished</b>.\"</td><td>Past Perfect: …she <b>had finished</b>.</td></tr>\n<tr><td>will: \"I'<b>ll call</b>.\"</td><td>would: …he <b>would call</b>.</td></tr>\n<tr><td>can: \"I <b>can</b> help.\"</td><td>could: …she <b>could</b> help.</td></tr>\n<tr><td>must: \"You <b>must</b> leave.\"</td><td>had to / must: …I <b>had to</b> leave.</td></tr></table>\n<p>Не меняются: <b>would, could, should, might, ought to</b>.</p>\n\n<h4>2. Когда сдвиг НЕ обязателен</h4>\n<ul><li>Вводный глагол в настоящем: <i>He <b>says</b> he <b>is</b> tired.</i></li>\n<li>Это всё ещё правда / общий факт: <i>She said futsal <b>is</b> played indoors.</i> / <i>He told me he <b>lives</b> in Minsk.</i> (и сейчас живёт)</li></ul>\n\n<h4>3. Меняются местоимения и указатели</h4>\n<p class=\"ex\">now → then; today → that day; tomorrow → the next day / the following day; yesterday → the day before / the previous day; here → there; this → that; ago → before; next week → the following week</p>\n<p class=\"ex\">\"I'll referee <b>here tomorrow</b>.\" → She said she would referee <b>there the next day</b>.</p>\n\n<h4>4. say vs tell</h4>\n<p class=\"ex\"><b>say</b> (something) (<b>to</b> someone): He <b>said</b> (to me) that he was ready.<br><b>tell</b> + someone (обязательно, без to): He <b>told me</b> that he was ready.</p>\n<div class=\"note\">⚠️ ❌ He said me… ❌ He told that… → ✅ He <b>told me</b> / He <b>said</b> that…<br>Устойчивые: <b>tell</b> the truth, tell a lie, tell a story, tell the time; <b>say</b> hello, say sorry, say something.</div>\n\n<h4>5. Вопросы</h4>\n<p>Порядок слов <b>прямой</b> (как в утверждении), без do/does/did, без вопросительного знака:</p>\n<p class=\"ex\">\"Where <b>is</b> the timekeeper?\" → She asked where the timekeeper <b>was</b>.<br>\"What time <b>does</b> the match <b>start</b>?\" → He asked what time the match <b>started</b>.</p>\n<p>Вопросы да/нет → <b>if / whether</b>:</p>\n<p class=\"ex\">\"<b>Are</b> you the captain?\" → The referee asked <b>if</b> I <b>was</b> the captain.</p>\n\n<h4>6. Просьбы и приказы → to / not to</h4>\n<p class=\"ex\">\"Move back, please.\" → The referee <b>asked him to move</b> back.<br>\"Don't touch the ball!\" → She <b>told them not to touch</b> the ball.</p>\n\n<h4>7. Другие вводные глаголы</h4>\n<p class=\"ex\">He <b>admitted</b> touching the ball. She <b>promised</b> to call. The coach <b>refused</b> to leave. He <b>apologised for</b> being late. She <b>warned</b> him <b>not to</b> argue. They <b>suggested</b> going by train.</p>\n\n<h4>8. Типичные ошибки</h4>\n<div class=\"mist\">❌ She asked where was the ball. → ✅ …where the ball <b>was</b>.<br>❌ He asked me do I speak English. → ✅ …<b>if</b> I spoke English.<br>❌ He said me that… → ✅ He <b>told</b> me that…<br>❌ She told me don't go. → ✅ She told me <b>not to go</b>.</div>","ex":[{"q":"\"I am the captain.\" → He said he ___ the captain.","o":["is","was","were"],"a":1,"why":"am → was."},{"q":"\"I will check the balls.\" → She said she ___ check the balls.","o":["will","would","can"],"a":1,"why":"will → would."},{"q":"The coach ___ me that the team was ready.","o":["said","told","asked"],"a":1,"why":"tell + кому (me)."},{"q":"\"Where is the timekeeper?\" → He asked where the timekeeper ___.","o":["is","was","was is"],"a":1,"why":"Прямой порядок + сдвиг времени."},{"q":"\"I didn't touch the ball.\" → He said he ___ the ball.","o":["hadn't touched","didn't touched","doesn't touch"],"a":0,"why":"Past Simple → Past Perfect."},{"q":"\"Are you the captain?\" → The referee asked ___ I was the captain.","o":["that","if","do"],"a":1,"why":"Вопрос да/нет → if/whether."},{"q":"\"Don't argue!\" → She told him ___.","o":["don't argue","not to argue","to not arguing"],"a":1,"why":"Приказ-запрет → not to + глагол."},{"q":"\"I'll referee here tomorrow.\" → She said she would referee there ___.","o":["tomorrow","the next day","yesterday"],"a":1,"why":"tomorrow → the next day."},{"q":"\"What time does the match start?\" → He asked what time the match ___.","o":["does start","started","did start"],"a":1,"why":"Прямой порядок без did + сдвиг времени."},{"q":"He ___ that he was sorry.","o":["told","said","told to"],"a":1,"why":"say + that (без дополнения-человека)."}]},"reading":{"title":"The goalkeeper and the four seconds","text":["In futsal, the goalkeeper has special restrictions. An indirect free kick is given if the goalkeeper controls the ball with the hands, arms or feet in their own half for more than four seconds.","There is also a back-pass rule. After the goalkeeper has played the ball, they cannot touch it again in their own half if a team-mate deliberately plays it back to them, unless an opponent has touched it first. The goalkeeper also cannot touch the ball with the hands inside their penalty area after a team-mate has deliberately kicked it to them.","When the ball goes over the end line after an attacker last touched it, the restart is a goal clearance. In futsal, the goalkeeper throws or releases the ball by hand from anywhere inside the penalty area. The opponents must be outside the penalty area, and the ball must be put into play within four seconds. A goal cannot be scored directly from a goal clearance."],"q":[{"q":"How is a goal clearance taken in futsal?","o":["Kicked from the floor","Thrown or released by hand","Taken by any player"],"a":1},{"q":"What happens if the goalkeeper controls the ball in their own half for more than four seconds?","o":["Penalty kick","Indirect free kick","Corner kick"],"a":1},{"q":"Can a goal be scored directly from a goal clearance?","o":["Yes","No"],"a":1}]},"listening":{"title":"A delicate request","theme":"life","lines":[["Anna","Mr Green, sorry to put you on the spot, but could I ask you a favour?"],["Mr Green","Of course, Anna. What is it?"],["Anna","I've been appointed to a tournament at short notice. Would it be possible for you to water my plants while I'm away?"],["Mr Green","I'd love to help, but I'm going to my daughter's next week. I'm afraid I'll have to turn you down this time."],["Anna","No problem at all — no hard feelings! I'll ask the neighbours downstairs."],["Mr Green","Actually, my son is staying here. I'd appreciate it if you left the key with him."],["Anna","Perfect. Thank you so much!"]],"q":[{"q":"Why is Anna going away?","o":["A holiday","A tournament at short notice","A family visit"],"a":1},{"q":"Why does Mr Green turn her down?","o":["He doesn't like plants","He's going to his daughter's","He's ill"],"a":1},{"q":"Who will help in the end?","o":["The neighbours downstairs","Mr Green's son","Anna's friend"],"a":1}]}},{"title":"Corners & kick-ins · Время","futsal":[{"en":"corner kick","ru":"угловой удар","ex":"A corner kick is awarded when a defender last touched the ball before it crossed the end line."},{"en":"corner area","ru":"угловой сектор","ex":"The ball must be placed in the corner area."},{"en":"attacking team","ru":"атакующая команда","ex":"The corner kick is taken by a player of the attacking team."},{"en":"defending team","ru":"обороняющаяся команда","ex":"Players of the defending team must be 5 m from the corner arc."},{"en":"to encroach","ru":"нарушить дистанцию, подойти ближе положенного","ex":"The defender encroached at the kick-in and was cautioned."},{"en":"to take (a kick)","ru":"выполнять (удар)","ex":"Number ten will take the corner kick."},{"en":"near post","ru":"ближняя штанга","ex":"He headed the ball in at the near post."},{"en":"far post","ru":"дальняя штанга","ex":"The cross went to the far post."},{"en":"set piece","ru":"стандартное положение","ex":"The team practises set pieces every week."},{"en":"to clear (the ball)","ru":"выбить (мяч), отбить","ex":"The defender cleared the ball over the touchline."}],"life":[{"en":"in the long run","ru":"в долгосрочной перспективе","ex":"Daily practice pays off in the long run."},{"en":"for the time being","ru":"пока что, на данный момент","ex":"For the time being, I'm staying with my parents."},{"en":"at short notice","ru":"в последний момент, без предупреждения","ex":"I was appointed to the match at short notice."},{"en":"in the nick of time","ru":"в самый последний момент","ex":"We arrived in the nick of time — the doors were closing."},{"en":"to make up for lost time","ru":"наверстать упущенное","ex":"After the injury, she trained hard to make up for lost time."},{"en":"to kill time","ru":"убить время","ex":"We killed time at the airport by playing cards."},{"en":"to be behind schedule","ru":"отставать от графика","ex":"The tournament is running behind schedule."},{"en":"around the clock","ru":"круглосуточно","ex":"The medical team is available around the clock."},{"en":"Time flies","ru":"Время летит","ex":"Time flies when you're having fun!"},{"en":"once and for all","ru":"раз и навсегда","ex":"Let's settle this argument once and for all."}],"grammar":{"title":"Passive with modals and in the past","explain":"\n<h4>1. Пассив во всех временах — формула одна</h4>\n<p><b>be</b> (в нужной форме) + <b>V3</b></p>\n<table><tr><th>Время</th><th>Пример</th></tr>\n<tr><td>Present Simple</td><td>A penalty <b>is awarded</b>.</td></tr>\n<tr><td>Present Continuous</td><td>The pitch <b>is being cleaned</b>.</td></tr>\n<tr><td>Past Simple</td><td>He <b>was sent off</b>. Two cards <b>were shown</b>.</td></tr>\n<tr><td>Past Continuous</td><td>The goal <b>was being repaired</b> when we arrived.</td></tr>\n<tr><td>Present Perfect</td><td>The match <b>has been suspended</b>.</td></tr>\n<tr><td>Past Perfect</td><td>The decision <b>had</b> already <b>been made</b>.</td></tr>\n<tr><td>Future (will)</td><td>The result <b>will be announced</b> tomorrow.</td></tr>\n<tr><td>be going to</td><td>A new rule <b>is going to be introduced</b>.</td></tr></table>\n\n<h4>2. Модальные глаголы + be + V3</h4>\n<p>Самая частая конструкция в Laws of the Game:</p>\n<p class=\"ex\">The ball <b>must be placed</b> in the corner area.<br><span class=\"t\">Мяч должен быть установлен в угловом секторе.</span></p>\n<p class=\"ex\">A goal <b>can be scored</b> directly from a corner kick.<br>A goal <b>cannot be scored</b> directly from a kick-in.<br>The player <b>must be cautioned</b>. The kick <b>should be retaken</b>.<br>A substitution <b>may be made</b> at any time.</p>\n<div class=\"note\">⚠️ После модального — всегда <b>be</b> (не is/are/was): <s>must is placed</s> → must <b>be</b> placed.</div>\n\n<h4>3. Модальные в прошлом: modal + have been + V3</h4>\n<p class=\"ex\">He <b>should have been sent off</b>. — Его следовало удалить (но не удалили).<br>The goal <b>must have been moved</b>. — Ворота, должно быть, сдвинули.<br>The foul <b>could have been avoided</b>. — Фола можно было избежать.</p>\n\n<h4>4. Пассив с get (разговорный)</h4>\n<p>Часто о неожиданных или неприятных событиях:</p>\n<p class=\"ex\">He <b>got sent off</b> in the first half. My phone <b>got stolen</b>. She <b>got injured</b>.</p>\n\n<h4>5. Пассив с инфинитивом и герундием</h4>\n<p class=\"ex\">I want <b>to be appointed</b> to the final.<br>Players hate <b>being substituted</b>.<br>She was proud of <b>being selected</b>.</p>\n\n<h4>6. have something done — услуга</h4>\n<p>Когда кто-то делает что-то для вас:</p>\n<p class=\"ex\">I <b>had my boots repaired</b>. — Мне починили бутсы (я отдала в ремонт).<br>She <b>is having her hair cut</b> tomorrow.</p>\n\n<h4>7. Типичные ошибки</h4>\n<div class=\"mist\">❌ The ball must placed. → ✅ The ball must <b>be</b> placed.<br>❌ He was send off. → ✅ He was <b>sent</b> off.<br>❌ The match has suspended. → ✅ The match has <b>been</b> suspended.<br>❌ I repaired my boots (если чинил мастер) → ✅ I <b>had</b> my boots <b>repaired</b>.</div>","ex":[{"q":"A goal can ___ directly from a corner kick.","o":["score","be scored","been scored"],"a":1,"why":"can + be + V3."},{"q":"The player ___ off for violent conduct yesterday.","o":["was sent","is sent","sent"],"a":0,"why":"yesterday → was + V3."},{"q":"The kick-in must ___ within four seconds.","o":["take","be taken","taken"],"a":1,"why":"must + be + V3."},{"q":"Three yellow cards ___ so far.","o":["have been shown","were show","have shown"],"a":0,"why":"so far → Present Perfect Passive."},{"q":"The match ___ because of a leak in the roof.","o":["was suspended","suspended","was suspend"],"a":0,"why":"Матч приостановили → was + V3."},{"q":"The result ___ tomorrow.","o":["will announced","will be announced","is announcing"],"a":1,"why":"Future Passive: will be + V3."},{"q":"He ___ off. It was a clear red card! (но не удалили)","o":["should be sent","should have been sent","must sent"],"a":1,"why":"Сожаление о прошлом: should have been + V3."},{"q":"The goal ___ repaired when we arrived.","o":["was being","is being","has"],"a":0,"why":"Процесс в прошлом → was being + V3."},{"q":"I ___ my boots repaired last week.","o":["have","had","was"],"a":1,"why":"have something done (прошлое) → had … repaired."},{"q":"Players hate ___ substituted.","o":["being","been","be"],"a":0,"why":"hate + -ing, пассив → being + V3."}]},"reading":{"title":"Laws 15 & 17 — Kick-In and Corner Kick","text":["When the whole ball passes over the touchline, or hits the ceiling, the opponents of the player who last touched it get a kick-in. The ball must be stationary on the touchline, and the opponents must stand at least 5 metres away. The ball must be put into play within four seconds; if not, the kick-in goes to the other team. A goal cannot be scored directly from a kick-in.","When the whole ball passes over the end line and a defender touched it last, the attacking team gets a corner kick. The ball is placed in the corner area nearest to where it went out. Opponents must stay at least 5 metres from the corner arc.","A corner kick must also be taken within four seconds. If it isn't, or if any other offence happens, a goal clearance is awarded to the defending team. A goal can be scored directly from a corner kick, but only against the opponents."],"q":[{"q":"Can a goal be scored directly from a kick-in?","o":["Yes","No"],"a":1},{"q":"What happens if a corner kick is not taken within four seconds?","o":["Kick-in","Goal clearance to the defending team","Retake"],"a":1},{"q":"How far must the opponents be at a kick-in?","o":["3 m","5 m","6 m"],"a":1}]},"listening":{"title":"Running late","theme":"life","lines":[["Ben","Hi, it's me. The bus broke down, so I'm walking. I'll be there in about fifteen minutes."],["Ella","Don't worry, the film doesn't start until eight. You'll make it."],["Ben","I hope so. For the time being, I'm just trying not to get lost!"],["Ella","Ha-ha. Last time we arrived in the nick of time, remember?"],["Ben","How could I forget? Listen, I'm sorry I've been so busy lately. I'll make up for lost time, I promise."],["Ella","I know. In the long run, the new job will be worth it."],["Ben","Thanks for being so patient. See you soon!"]],"q":[{"q":"Why is Ben walking?","o":["The bus broke down","He likes walking","He missed the train"],"a":0},{"q":"What happened last time?","o":["They missed the film","They arrived at the last moment","They went to the wrong cinema"],"a":1},{"q":"What does Ella say about Ben's new job?","o":["It's a mistake","It will be worth it in the long run","It's too far away"],"a":1}]}},{"title":"DOGSO & handball · Спорт и фитнес","futsal":[{"en":"obvious goalscoring opportunity","ru":"явная возможность забить гол","ex":"He denied an obvious goalscoring opportunity and was sent off."},{"en":"to deny","ru":"лишить, помешать","ex":"Denying a goal with a deliberate handball is a red card."},{"en":"promising attack","ru":"перспективная атака","ex":"Stopping a promising attack with a foul is a yellow card."},{"en":"handball offence","ru":"игра рукой (нарушение)","ex":"Not every touch of the hand is a handball offence."},{"en":"unguarded goal","ru":"пустые (незащищённые) ворота","ex":"The goal was unguarded because the goalkeeper was outside the area."},{"en":"deliberate","ru":"умышленный","ex":"A deliberate handball that denies a goal is a red card."},{"en":"to make the body unnaturally bigger","ru":"неестественно увеличить объём тела","ex":"A player who makes the body unnaturally bigger with the arm risks a handball offence."},{"en":"armpit","ru":"подмышка","ex":"The upper boundary of the arm is in line with the bottom of the armpit."},{"en":"direction of play","ru":"направление игры","ex":"The referees consider the general direction of play."},{"en":"counter-attack","ru":"контратака","ex":"He stopped a dangerous counter-attack with a tactical foul."}],"life":[{"en":"to get back in shape","ru":"вернуться в форму","ex":"I'm trying to get back in shape after the holidays."},{"en":"stamina","ru":"выносливость","ex":"Futsal referees need a lot of stamina."},{"en":"to push yourself","ru":"выкладываться, заставлять себя","ex":"Don't push yourself too hard on the first day."},{"en":"to be sore","ru":"болеть, ныть (о мышцах)","ex":"My legs are sore after yesterday's training."},{"en":"to take it easy","ru":"не перенапрягаться, расслабиться","ex":"Take it easy for a few days after the test."},{"en":"to break a sweat","ru":"вспотеть, напрячься","ex":"He won the race without breaking a sweat."},{"en":"to run out of steam","ru":"выдохнуться","ex":"The team ran out of steam in the second half."},{"en":"a personal best","ru":"личный рекорд","ex":"I set a personal best in the fitness test."},{"en":"to pace yourself","ru":"распределять силы","ex":"Pace yourself — it's a long tournament."},{"en":"to build up (strength)","ru":"наращивать (силу, выносливость)","ex":"Build up your stamina gradually."}],"grammar":{"title":"Linking words: although, however, unless, until, as long as","explain":"\n<h4>1. Противопоставление</h4>\n<table><tr><th>Слово</th><th>Как используется</th></tr>\n<tr><td><b>but</b></td><td>в середине предложения: <i>He touched the ball, <b>but</b> it was a foul.</i></td></tr>\n<tr><td><b>although / though / even though</b></td><td>+ подлежащее + глагол: <i><b>Although</b> it was raining, the match started.</i> (even though — сильнее: «даже несмотря на то, что»)</td></tr>\n<tr><td><b>despite / in spite of</b></td><td>+ существительное или -ing: <i><b>Despite</b> the rain… / <b>Despite</b> being tired, she…</i></td></tr>\n<tr><td><b>however</b></td><td>начинает новое предложение, после него запятая: <i>Blocking is allowed. <b>However</b>, the player must be stationary.</i></td></tr>\n<tr><td><b>whereas / while</b></td><td>сравнение двух фактов: <i>Football has offside, <b>whereas</b> futsal doesn't.</i></td></tr></table>\n<div class=\"note\">⚠️ ❌ Despite it was raining → ✅ <b>Although</b> it was raining / <b>Despite the rain</b> / Despite <b>the fact that</b> it was raining.<br>⚠️ ❌ Although…, but… — нельзя использовать оба: <s>Although he was tired, but he played</s>.</div>\n\n<h4>2. Условие</h4>\n<ul><li><b>unless
